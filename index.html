// ===== ADMIN DASHBOARD (オーナーのみ) =====
function AdminDashboard({employees,setEmployees,admins,setAdmins,queueStaffOp,selectedMonth,setSelectedMonth,getMonthlySummary,showToast,currentUser,setCurrentUser,setView}){
  const [tab,setTab]=useState("summary");
  const [selEmp,setSelEmp]=useState(null);
  const isSuperAdmin=currentUser?.role==="superadmin";
  const [showPinChange,setShowPinChange]=useState(currentUser?.passHash==null);
  useEffect(()=>{ if(currentUser&&currentUser.passHash==null)setShowPinChange(true); },[currentUser?.passHash]);
  const [showHelp,setShowHelp]=useState(false);

  const savePassToList=hash=>{
    const upd={...currentUser,passHash:hash};
    const inAdmins=(admins||[]).some(x=>x.id===currentUser.id);
    if(inAdmins)setAdmins(prev=>prev.map(x=>x.id===currentUser.id?upd:x));
    else setEmployees(prev=>prev.map(x=>x.id===currentUser.id?upd:x));
    queueStaffOp({action:"upsert",type:inAdmins?"admins":"employees",staff:upd});
    setCurrentUser(upd);showToast("パスワードを変更しました");
  };

  return e("div",null,
    showPinChange&&e(PasswordChangeModal,{currentUser,isForced:currentUser?.passHash==null,
      onCancel:()=>{
        if(currentUser?.passHash==null){
          setCurrentUser(null);setView("login");
        } else {
          setShowPinChange(false);
        }
      },
      onDone:hash=>{savePassToList(hash);setShowPinChange(false);}
    }),
    showHelp&&e(HelpModal,{isAdmin:true,isOwner:currentUser?.role==="superadmin",onClose:()=>setShowHelp(false)}),
    e("div",{className:"no-print",style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,gap:10,flexWrap:"wrap"}},
      e("h2",{style:{fontSize:20,fontWeight:700,color:"#1e3a5f"}},"管理者ダッシュボード"),
      e("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
        e("button",{className:"btn btn-outline",onClick:()=>setShowHelp(true)},"❓ 使い方"),
        e("input",{type:"month",value:selectedMonth,onChange:ev=>setSelectedMonth(ev.target.value),className:"input-field",style:{width:"auto"}}),
        e("button",{className:"btn btn-outline",onClick:()=>window.print()},
          tab==="employees"
            ?"🖨 従業員一覧を印刷"
            :selEmp
              ?"🖨 "+([...employees,...admins].find(x=>x.id===selEmp)?.name||"")+"さんの明細を印刷"
              :"🖨 全員分を印刷"
        )
      )
    ),
    e("div",{style:{display:"flex",borderBottom:"2px solid #e2e8f0",marginBottom:20,gap:4},className:"no-print"},
      [["summary","📊 月次集計"],["employees","👥 従業員設定"]].map(([k,l])=>
        e("button",{key:k,className:`tab ${tab===k?"active":""}`,onClick:()=>setTab(k)},l)
      )
    ),
    // 月次集計
    tab==="summary"&&e("div",null,
      // 店舗ごとに見出しを付けて給与カードを並べる
      e("div",{className:"no-print",style:{marginBottom:20}},
        ...groupByStore([...employees,...admins]).map(([store,list])=>e("div",{key:store,style:{marginBottom:16}},
          e("div",{style:{fontSize:12,fontWeight:700,color:"#1e3a5f",background:"#f1f5f9",
            borderRadius:6,padding:"5px 12px",marginBottom:8,display:"inline-block"}},
            store+"（"+list.length+"名）"),
          e("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12}},
            ...list.map(emp=>{
              const s=getMonthlySummary(emp.id);
              return e("div",{key:emp.id,className:"stat-box",style:{cursor:"pointer",border:selEmp===emp.id?"2px solid #1e3a5f":"2px solid transparent"},onClick:()=>setSelEmp(selEmp===emp.id?null:emp.id)},
                e("div",{style:{marginBottom:8}},
                  e("div",{style:{fontWeight:700,fontSize:13,color:"#1e3a5f"}},emp.name),
                  e("div",{style:{fontSize:10,color:"#94a3b8"}},emp.store)
                ),
                e("div",{style:{fontSize:18,fontWeight:700,color:"#059669"}},"¥"+s.totalPay.toLocaleString()),
                e("div",{style:{fontSize:10,color:"#94a3b8",marginTop:2}},mHHMM(s.totalWork))
              );
            })
          )
        ))
      ),
      selEmp&&e("div",{className:"card no-print"},
        e("h3",{style:{fontSize:15,fontWeight:700,color:"#1e3a5f",marginBottom:12}},[...employees,...admins].find(x=>x.id===selEmp)?.name+" の月次明細"),
        e(MonthlyTable,{summary:getMonthlySummary(selEmp),currentUser,selectedMonth,isMgrClosed:isAdminClosed(selEmp,selectedMonth)})
      ),
      // 印刷対象：スタッフ選択中はその1人だけ、未選択なら全員（1人1ページ）
      ...[...employees,...admins]
        .filter(emp=>!selEmp||emp.id===selEmp)
        .map(emp=>e(PrintSummary,{key:emp.id,summary:getMonthlySummary(emp.id),selectedMonth,isAdmin:true}))
    ),
    // 従業員設定
    tab==="employees"&&e("div",null,
      e("div",{className:"card no-print"},
      e("h3",{style:{fontSize:15,fontWeight:700,color:"#1e3a5f",marginBottom:16}},"従業員設定"),
      // 新規追加フォーム
      e(AddEmployeeForm,{employees,setEmployees,admins,setAdmins,queueStaffOp,showToast}),
      e("div",{style:{overflowX:"auto",marginTop:16}},e("table",{className:"table",style:{fontSize:12}},
        e("thead",null,e("tr",null,["氏名","ログインID","部署","店舗","役割","給与","担当店舗","パスワード","英語","操作"].map(h=>e("th",{key:h},h)))),
        e("tbody",null,...sortByStore([...employees,...admins]).flatMap((emp,i,arr)=>[
          // 店舗が変わるところで見出しを挟む
          (i===0||arr[i-1].store!==emp.store)
            ? e("tr",{key:"h-"+emp.store},
                e("td",{colSpan:10,style:{background:"#f1f5f9",fontWeight:700,fontSize:12,color:"#1e3a5f",padding:"6px 10px"}},
                  emp.store+"（"+arr.filter(x=>x.store===emp.store).length+"名）"))
            : null,
          e(EmployeeRow,{key:emp.id,emp,isSuperAdmin,
          onSave:upd=>{
            const lid=String(upd.loginId||"").trim().toLowerCase();
            if(!lid){showToast("ログインIDを入力してください","warning");return;}
            const dup=[...employees,...admins].some(x=>x.id!==upd.id&&String(x.loginId||"").toLowerCase()===lid);
            if(dup){showToast("このログインIDは既に使われています","warning");return;}
            upd={...upd,loginId:lid,
              // 給与形態に合わない項目は残さない
              payType:upd.payType==="monthly"?"monthly":undefined,
              hourlyWage:upd.payType==="monthly"?undefined:(Number(upd.hourlyWage)||0),
              monthlyWage:upd.payType==="monthly"?(Number(upd.monthlyWage)||0):undefined};
            const wasAdmin=admins.some(x=>x.id===upd.id);
            const shouldBeAdmin=upd.role!=="employee";
            // 役割に応じた担当店舗の初期化・整理
            if(shouldBeAdmin&&(!upd.managedStores||upd.managedStores.length===0)){
              upd={...upd,managedStores:upd.role==="superadmin"?ALL_STORES.filter(s=>!INACTIVE_STORES.includes(s)):[upd.store]};
            }
            if(!shouldBeAdmin)upd={...upd,managedStores:undefined};
            // 役割変更時はemployees⇔admins間で配列を移動
            // （moveFromを渡すことで、GAS側で「元のシートから削除→新しいシートに保存」を1回の保存でまとめて行う）
            if(wasAdmin&&!shouldBeAdmin){
              setAdmins(prev=>prev.filter(x=>x.id!==upd.id));
              setEmployees(prev=>[...prev.filter(x=>x.id!==upd.id),upd]);
              queueStaffOp({action:"upsert",type:"employees",staff:upd,moveFrom:"admins"});
            }else if(!wasAdmin&&shouldBeAdmin){
              setEmployees(prev=>prev.filter(x=>x.id!==upd.id));
              setAdmins(prev=>[...prev.filter(x=>x.id!==upd.id),upd]);
              queueStaffOp({action:"upsert",type:"admins",staff:upd,moveFrom:"employees"});
            }else if(wasAdmin){
              setAdmins(prev=>prev.map(x=>x.id===upd.id?upd:x));
              queueStaffOp({action:"upsert",type:"admins",staff:upd});
            }else{
              setEmployees(prev=>prev.map(x=>x.id===upd.id?upd:x));
              queueStaffOp({action:"upsert",type:"employees",staff:upd});
            }
            // 編集したのが自分自身なら、ログイン中の情報も更新する
            // （更新しないと、変更前の時給などが勤怠に記録されてしまう）
            if(currentUser&&upd.id===currentUser.id)setCurrentUser(upd);
            showToast(upd.name+" を更新しました");
          },
          onDelete:emp=>{
            const inAdmins=admins.some(x=>x.id===emp.id);
            if(inAdmins)setAdmins(prev=>prev.filter(x=>x.id!==emp.id));
            else setEmployees(prev=>prev.filter(x=>x.id!==emp.id));
            queueStaffOp({action:"delete",type:inAdmins?"admins":"employees",id:emp.id});
            showToast(emp.name+" を削除しました","warning");
          },
          onPassReset:emp=>{
            const inAdmins=admins.some(x=>x.id===emp.id);
            const upd={...emp,passHash:null};
            if(inAdmins)setAdmins(prev=>prev.map(x=>x.id===emp.id?upd:x));
            else setEmployees(prev=>prev.map(x=>x.id===emp.id?upd:x));
            queueStaffOp({action:"upsert",type:inAdmins?"admins":"employees",staff:upd});
            showToast(emp.name+" のパスワードをリセットしました（初期パスワード: "+INITIAL_PASSWORD+"）");
          }
          })
        ].filter(Boolean)))
      ))),
      // 印刷用の従業員一覧（画面には出ない）
      e("div",{className:"print-only",style:{display:"none"}},
        e("h2",{style:{fontSize:14,marginBottom:4}},"従業員一覧"),
        e("p",{style:{fontSize:10,marginBottom:8,color:"#666"}},"出力日: "+formatDate(new Date())+" ／ 全"+([...employees,...admins].length)+"名"),
        e("table",{className:"print-table"},
          e("colgroup",null,...[16,24,12,16,9,11,12].map((w,i)=>e("col",{key:i,style:{width:w+"%"}}))),
          e("thead",null,e("tr",null,...["氏名","ログインID","部署","所属店舗","役割","給与","担当店舗"].map(h=>e("th",{key:h},h)))),
          e("tbody",null,...sortByStore([...employees,...admins]).map(emp=>e("tr",{key:emp.id},
            e("td",{className:"c-nowrap"},emp.name),
            e("td",{className:"c-wrap"},emp.loginId||"—"),
            e("td",{className:"c-nowrap"},emp.department||"—"),
            e("td",{className:"c-wrap"},emp.store||"—"),
            e("td",{className:"c-nowrap"},{employee:"一般",admin:"管理者",superadmin:"オーナー"}[emp.role]||emp.role),
            e("td",{className:"c-nowrap c-right"},emp.payType==="monthly"?"月 "+(emp.monthlyWage||0).toLocaleString():(emp.hourlyWage||0).toLocaleString()+"/h"),
            e("td",{className:"c-wrap"},emp.role==="employee"?"—":(emp.managedStores||[emp.store]).join("・"))
          )))
        )
      )
    )
  );
}

// ===== MAIN APP =====
function App(){
  const [employees,setEmpRaw]=useState(()=>migrateAuth(loadLS("kintai_employees",INITIAL_EMPLOYEES),INITIAL_EMPLOYEES));
  const [admins,setAdminsRaw]=useState(()=>migrateAuth(loadLS("kintai_admins",INITIAL_ADMINS),INITIAL_ADMINS));
  const [records,setRecRaw]=useState(()=>loadLS("kintai_records",{}));
  const [view,setViewRaw]=useState(()=>{try{const s=JSON.parse(localStorage.getItem("kintai_session")||"null");if(s&&s.view&&s.view!=="login")return s.view;}catch{}return "login";});
  const setView=v=>{setViewRaw(v);try{const cu=JSON.parse(localStorage.getItem("kintai_session")||"null");if(cu)saveLS("kintai_session",{...cu,view:v,ts:Date.now()});}catch{}};
  const [currentUser,setCUraw]=useState(()=>{
    try{const s=JSON.parse(localStorage.getItem("kintai_session")||"null");
      if(s){const emps=migrateAuth(loadLS("kintai_employees",INITIAL_EMPLOYEES),INITIAL_EMPLOYEES);const adms=migrateAuth(loadLS("kintai_admins",INITIAL_ADMINS),INITIAL_ADMINS);
        return emps.find(x=>x.id===s.empId)||adms.find(x=>x.id===s.empId)||null;}}catch{}return null;
  });
  // ログイン状態はログアウトするまで保持する（時間による自動ロックはしない）
  // 読み込み処理（useEffect内）から「今ログインしている人」「今の画面」を参照するための控え
  const currentUserRef=useRef(currentUser);currentUserRef.current=currentUser;
  const viewRef=useRef(view);viewRef.current=view;
  const [selectedMonth,setSelectedMonth]=useState(`${TODAY.getFullYear()}-${String(TODAY.getMonth()+1).padStart(2,"0")}`);
  const [toast,setToast]=useState(null);
  // スタッフ情報のGAS同期は状態更新の外で行う（更新関数内で通信すると二重送信になるため）
  // 2026年9月：以前は「今ブラウザが持っている全員分」を毎回まとめて送って洗い替えていたが、
  // ログアウトが自動で起きない仕様のため、古い状態のまま誰かが何か保存すると、
  // その間に他の人が加えた変更（追加・編集）を消してしまう可能性があった。
  // 変更があった「その人の分だけ」を保存する方式（saveOneStaff/deleteStaff）に変更し、
  // 溜めておいた操作を配列でまとめて送る（1回のレンダーで複数箇所が変更されても取りこぼさないように）
  const pendingStaffOps=useRef([]);
  // この端末でスタッフ情報を最後に変更した時刻（読み込み途中の少し古い一覧で、変更直後の内容を上書きしないため）
  const lastStaffWriteAt=useRef(0);
  const queueStaffOp=op=>{pendingStaffOps.current=[...pendingStaffOps.current,op];lastStaffWriteAt.current=Date.now();};
  const staffSyncing=useRef(false);
  const [syncBusy,setSyncBusy]=useState(false);
  useEffect(()=>{
    if(!pendingStaffOps.current.length)return;
    const ops=pendingStaffOps.current;
    pendingStaffOps.current=[];
    staffSyncing.current=true;setSyncBusy(true);
    const done=ok=>{
      staffSyncing.current=false;setSyncBusy(false);
      if(ok)setToast({msg:"スタッフ情報を保存しました",type:"success"});
      else setToast({msg:"保存できませんでした。通信環境を確認して、もう一度保存してください。",type:"warning"});
      setTimeout(()=>setToast(null),3000);
    };
    (async()=>{
      let allOk=true;
      for(const op of ops){
        try{
          const r=op.action==="delete"
            ?await gasPost("deleteStaff",{type:op.type,id:op.id})
            :await gasPost("saveOneStaff",{type:op.type,staff:op.staff,moveFrom:op.moveFrom});
          if(!r||r.success===false)allOk=false;
        }catch(e){allOk=false;}
      }
      done(allOk);
    })();
  });
  // 保存が終わる前にページを閉じようとしたら警告する（変更が消えるのを防ぐ）
  useEffect(()=>{
    const h=ev=>{if(staffSyncing.current){ev.preventDefault();ev.returnValue="";}};
    window.addEventListener("beforeunload",h);
    return ()=>window.removeEventListener("beforeunload",h);
  },[]);

  // 状態更新は必ずReactの最新値(prev)を基準にする
  // （素早い連続操作でも更新が失われないようにするため）
  // GASへの保存は、各呼び出し元がqueueStaffOp()で「変更した本人分だけ」を個別に指示する
  // （2026年9月：以前はここで全員分をまとめて自動的に送っていたが、全件洗い替え方式の
  //  データ消失リスクをなくすため、1人分だけ保存する方式に変更した）
  const setEmployees=v=>{
    setEmpRaw(prev=>{
      const nx=typeof v==="function"?v(prev):v;
      saveLS("kintai_employees",nx);
      return nx;
    });
  };
  const setAdmins=v=>{
    setAdminsRaw(prev=>{
      const nx=typeof v==="function"?v(prev):v;
      saveLS("kintai_admins",nx);
      return nx;
    });
  };
  const setRecords=v=>{
    setRecRaw(prev=>{
      const nx=typeof v==="function"?v(prev):v;
      saveRecordsLS(nx);
      return nx;
    });
  };

  // 起動時にスプレッドシートから読めなかったときの表示
  const [loadFailed,setLoadFailed]=useState(null);
  const reloadFromGAS=useRef(null);
  const [reloading,setReloading]=useState(false);
  // データを最後に取り込んだ時刻（ナビゲーションバーの更新ボタン横に表示し、古さを確認できるようにする）
  const [lastLoadedAt,setLastLoadedAt]=useState(null);
  // closedSet（月締めの状態）はReactの外側で管理しているため、
  // GASから読み込んで更新しても、それだけでは画面が再描画されない。
  // このカウンターを更新することで、App配下すべてを再描画させる
  const [closesVersion,setClosesVersion]=useState(0);
  const retryLoad=async()=>{
    if(!reloadFromGAS.current)return;
    setReloading(true);
    await reloadFromGAS.current();
    setReloading(false);
  };
  // スプレッドシートから読んだ勤怠（範囲付き）を、端末側の記録とそろえる。
  // recRes … getRecords の返事。range が付いていれば「その範囲だけ読んだ」返事（新しいGAS）。
  //          付いていなければ全件（古いGAS）として扱う。
  // 端末にだけある記録は、次のものだけを残し、それ以外は消す：
  //   ① まだ送信できていない記録（synced:false。再提出できるように残す。ただし月締め済みの月は除く）
  //   ② この読み込みの途中に、この端末で保存した記録
  //   ③ 今回読んでいない範囲の月で、この画面で追加読み込み済みの月（extraMonths）の記録
  // 読んでいない範囲の古い月の記録（以前の端末保存に残っていたもの）は消す（必要になればその月を選んだときに読み直す）
  const mergeServerRecords=(recRes,loadStartedAt,serverClosed)=>{
    const range=recRes.range;
    const inRange=range
      ?m=>((range.from&&range.to&&m>=range.from&&m<=range.to)||(range.months||[]).includes(m))
      :()=>true;
    // シートそのものが空（total が 0）のときだけは、念のため端末側の記録を消さない（シート名の変更等の事故に備える）
    const serverEmpty=typeof recRes.total==="number"?recRes.total===0:recRes.data.length===0;
    setRecRaw(prev=>{
      const isRecentLocal=(id,date)=>isLocalRecWriteFresh(id,date,loadStartedAt);
      const next={};
      const put=(id,date,r)=>{next[id]={...(next[id]||{}),[date]:r};};
      const seen=new Set();
      recRes.data.forEach(sr=>{
        if(!sr||sr.empId==null||!sr.date)return;
        const id=Number(sr.empId);
        if(!Number.isFinite(id))return;
        seen.add(id+"_"+sr.date);
        if(isRecentLocal(id,sr.date)){
          // 読み込み中にこの端末で書き換えた（または削除した）→端末側を優先する
          const loc=(prev[id]||{})[sr.date];
          if(loc)put(id,sr.date,loc);
          return;
        }
        put(id,sr.date,{...sr,empId:id});
      });
      Object.keys(prev).forEach(idKey=>{
        const id=Number(idKey);
        Object.entries(prev[idKey]||{}).forEach(([date,loc])=>{
          if(!loc||seen.has(id+"_"+date))return;
          const month=String(date).substring(0,7);
          const unsent=loc.synced===false&&!(serverClosed&&serverClosed.has(closeKey(id,month)));
          if(unsent||isRecentLocal(id,date)){put(id,date,loc);return;}
          if(!inRange(month)){
            // 今回読んでいない月：通常の読み込み範囲（当月＋前2か月）か、追加読み込み済みの月ならそのまま残す。
            // それ以外（以前の端末保存に残っていた古い月）は消す
            if(inLoadedRange(month))put(id,date,loc);
            return;
          }
          if(serverEmpty)put(id,date,loc);
        });
      });
      saveRecordsLS(next);
      return next;
    });
  };
  // 古い月（通常の読み込み範囲の外）を選んだときに、その月だけ追加で読む
  // monthLoad：{month,status:"loading"|"failed"}（画面上部の小さな表示に使う）
  const [monthLoad,setMonthLoad]=useState(null);
  const loadingMonths=useRef(new Set());
  const ensureMonthLoaded=async(month,force)=>{
    if(!month||!/^\d{4}-\d{2}$/.test(month))return;
    if(!force&&inLoadedRange(month))return;
    if(loadingMonths.current.has(month))return;
    loadingMonths.current.add(month);
    setMonthLoad({month,status:"loading"});
    const startedAt=Date.now();
    try{
      const r=await gasGet("getRecords",{months:month});
      if(r&&r.success!==false&&Array.isArray(r.data)){
        extraMonths.add(month);
        // 古いGAS（範囲指定に未対応）は全件を返してくる。その場合は range が無いので全件として扱われる
        mergeServerRecords(r,startedAt,null);
        setMonthLoad(m=>(m&&m.month===month)?null:m);
      }else{
        setMonthLoad({month,status:"failed"});
      }
    }catch(e){
      console.error("月の追加読み込みエラー:",e);
      setMonthLoad({month,status:"failed"});
    }finally{
      loadingMonths.current.delete(month);
    }
  };
  // GASから初期データ取得
  // 読み込みが重なったとき（自動更新と手動更新など）に、後から始めた新しい読み込みの結果を
  // 先に始めた古い読み込みの結果で上書きしないよう、番号を振って管理する
  const loadSeq=useRef(0),appliedSeq=useRef(0);
  useEffect(()=>{
    async function loadFromGAS(){
      const mySeq=++loadSeq.current;
      const loadStartedAt=Date.now();
      try{
        const win=baseWindow();
        const recParams={from:win.from,to:win.to};
        if(extraMonths.size)recParams.months=[...extraMonths].join(",");
        const [empRes,admRes,recRes,closeRes]=await Promise.all([gasGet("getEmployees"),gasGet("getAdmins"),gasGet("getRecords",recParams),gasGet("getCloses")]);
        if(mySeq<appliedSeq.current)return;   // より新しい読み込みがすでに反映済み
        appliedSeq.current=mySeq;
        // スプレッドシートにデータがあれば、それを正として端末側を置き換える
        // （ただし読み込み中にこの端末でスタッフ情報を変更した場合は、今回は置き換えない＝次回の読み込みで反映）
        const staffWrittenDuringLoad=lastStaffWriteAt.current>=loadStartedAt||staffSyncing.current;
        let empList=null,admList=null;
        if(!staffWrittenDuringLoad&&empRes.success&&Array.isArray(empRes.data)&&empRes.data.length>0){
          empList=migrateAuth(empRes.data,INITIAL_EMPLOYEES);
          saveLS("kintai_employees",empList);setEmpRaw(empList);
        }
        if(!staffWrittenDuringLoad&&admRes.success&&Array.isArray(admRes.data)&&admRes.data.length>0){
          admList=migrateAuth(admRes.data,INITIAL_ADMINS);
          saveLS("kintai_admins",admList);setAdminsRaw(admList);
        }
        // 2026年9月（追加修正⑥）：ログイン中の本人の情報も、スプレッドシートの内容に合わせる。
        // 以前はログインした時点の情報のまま変わらなかったため、オーナーが別の端末で
        // 担当店舗・役割（管理者→一般など）・パスワードを変更しても、ログイン中の端末では
        // 反映されなかった（例：一般に変更された人に、承認管理タブが表示されたまま）。
        if(empList&&admList){
          const cur=currentUserRef.current;
          const fresh=cur&&[...empList,...admList].find(x=>x.id===cur.id);
          if(fresh&&JSON.stringify(fresh)!==JSON.stringify(cur)){
            setCUraw(fresh);
            // オーナーでなくなった人がダッシュボードを開いたままなら、マイ勤怠に切り替える
            if(fresh.role!=="superadmin"&&viewRef.current==="dashboard")setView("employee");
          }
          // スプレッドシートから削除された人（退職者など）がログインしたままなら、ログアウトする
          // （2026年9月・総点検で発見：以前は開き直しても2回目までログインが残っていた）
          if(cur&&!fresh){
            setCurrentUser(null);setView("login");
            setToast({msg:"スタッフ情報が見つからないため、ログアウトしました。管理者にご確認ください。",type:"warning"});
            setTimeout(()=>setToast(null),5000);
          }
        }
        // 月締めの一覧（勤怠の整理にも使うので先に組み立てる）
        const closesOk=closeRes.success&&Array.isArray(closeRes.data);
        const serverClosed=new Set();
        if(closesOk)closeRes.data.forEach(c=>{if(c&&c.empId!=null&&c.month)serverClosed.add(closeKey(c.empId,c.month));});
        // 勤怠レコード：スプレッドシートを正として端末側をそろえる。
        // 2026年9月（追加修正⑥）：以前は「スプレッドシートの内容を上書き・追加する」だけで、
        // 「スプレッドシートから消えた記録を端末からも消す」処理がなかった。そのため、
        // 別の端末でリセット（削除）された記録が、この端末では「差戻中」等のまま残り続け、
        // キャッシュ（端末に保存されたデータ）を消すまで直らなかった。
        // 端末にだけある記録は、次の2種類だけを残し、それ以外は「他の端末で削除された」ものとして消す。
        //   ① まだ送信できていない記録（synced:false。再提出できるように残す）
        //      ※ただし月締め済みの月のものは、もう送信できないため残さない
        //   ② この読み込みの途中に、この端末で保存した記録
        if(recRes.success&&Array.isArray(recRes.data)){
          mergeServerRecords(recRes,loadStartedAt,serverClosed);
        }
        // 月締めの状態はスプレッドシートを正として反映する（全管理者で共有される）
        if(closesOk){
          applyClosesFromServer(closeRes.data,loadStartedAt);
          setClosesVersion(v=>v+1);   // グローバル変数の更新をReactに気づかせる
        }
        // 3つのうち1つでも読めなければ、古い情報のまま操作しないよう知らせる
        const failed=[
          !empRes.success&&"スタッフ",
          !admRes.success&&"管理者",
          !recRes.success&&"勤怠",
          !closeRes.success&&"月締め"
        ].filter(Boolean);
        setLoadFailed(failed.length>0?failed:null);
        setLastLoadedAt(new Date());
      }catch(e){
        console.error("GAS初期ロードエラー:",e);
        setLoadFailed(["データ"]);
      }
    }
    loadFromGAS();
    reloadFromGAS.current=loadFromGAS;   // あとから呼び直せるようにしておく
  },[]);
  // 別の端末で提出・差し戻し・承認された内容が反映されないまま画面が古くなる対策：
  // 他のアプリ・画面に切り替えてこのページに戻ってきたタイミングで、自動的に最新データを取り込む。
  // （ページを開きっぱなしで一度も切り替えない場合はこれだけでは更新されないため、
  //   ナビゲーションバーの「🔄 最新の情報に更新」ボタンでも手動で更新できるようにしてある）
  const lastAutoReloadRef=useRef(Date.now());
  useEffect(()=>{
    const AUTO_RELOAD_MIN_INTERVAL=60*1000; // 短時間に連続して発生しても通信しすぎないように間隔を空ける
    const tryAutoReload=()=>{
      if(document.visibilityState!=="visible")return;
      if(!reloadFromGAS.current)return;
      if(reloading)return;
      const now=Date.now();
      if(now-lastAutoReloadRef.current<AUTO_RELOAD_MIN_INTERVAL)return;
      lastAutoReloadRef.current=now;
      retryLoad();
    };
    document.addEventListener("visibilitychange",tryAutoReload);
    window.addEventListener("focus",tryAutoReload);
    return()=>{
      document.removeEventListener("visibilitychange",tryAutoReload);
      window.removeEventListener("focus",tryAutoReload);
    };
  },[reloading]);
  const setCurrentUser=emp=>{
    if(emp)saveLS("kintai_session",{empId:emp.id,role:emp.role,ts:Date.now()});
    else try{localStorage.removeItem("kintai_session");}catch{}
    setCUraw(emp);
  };
  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};
  // 履歴の記録に失敗したら知らせる（操作自体は完了している）
  useEffect(()=>{
    onLogFailed=action=>showToast(`「${action}」は完了しましたが、操作履歴に記録できませんでした。`,"warning");
    return ()=>{onLogFailed=null;};
  },[]);

  useEffect(()=>{
    if(!currentUser)return;
    const t=setInterval(()=>{
      saveLS("kintai_session",{empId:currentUser.id,role:currentUser.role,view,ts:Date.now()});
    },5*60*1000);
    return()=>clearInterval(t);
  },[currentUser,view]);

  const getRecord=(empId,date)=>records[empId]?.[date]||{empId,date,clockIn:"",clockOut:"",breaks:[{start:"",end:""}],status:"draft",note:"",hourlyWage:[...employees,...admins].find(x=>x.id===empId)?.hourlyWage??1000};
  // 保存の結果（スプレッドシートに届いたか）を返す。
  // 届いたかどうかを synced に記録し、未送信なら同じ内容でも送り直せるようにする
  // 端末側の記録を、送信前の状態に戻す（スプレッドシート側に断られたとき用）
  const revertRecord=(empId,date,before)=>setRecords(prev=>{
    const emp={...(prev[empId]||{})};
    if(before)emp[date]=before;else delete emp[date];
    return {...prev,[empId]:emp};
  });
  // 2026年9月（追加修正⑥）：通信はできたがスプレッドシート側のルール（月締め済み・承認済み・
  // 他の端末で内容が変わっている等）で断られた場合（GASが refused:true を付けて返す）の扱いを変更した。
  // 以前は通信失敗と同じく「まだ送信できていません」として端末に残していたため、
  // 何度再提出しても断られ続け、画面にも「通信環境を確認して」という誤った案内が出ていた。
  // 断られたときは、端末の表示を送信前に戻し、断られた理由を表示し、最新の状態を読み込み直す。
  const handleRefusal=(r,list)=>{
    lastRefusal=(r&&r.error)||"保存できませんでした";
    list.forEach(([empId,date,before])=>revertRecord(empId,date,before));
    if(reloadFromGAS.current)reloadFromGAS.current();
  };
  useEffect(()=>{
    onRefusalReload=()=>{if(reloadFromGAS.current)reloadFromGAS.current();};
    return ()=>{onRefusalReload=null;};
  },[]);
  // log を渡すと、操作履歴も同じ通信で書く（2026年9月・重さ対策。古いGASのときは別の通信で送る）
  const saveRecord=(rec,log)=>{
    if(currentUser&&currentUser.role==="employee"&&rec.empId!==currentUser.id){showToast("他のユーザーのデータは編集できません","warning");return Promise.resolve(false);}
    const before=(records[rec.empId]||{})[rec.date];   // 送信前の端末側の記録
    markLocalRecWrite(rec.empId,rec.date,true);        // 送信が終わるまで、読み込み結果で打ち消されないようにする
    // 送信の結果を端末側に反映する。成功なら「送った内容」を届いた印つきで確定させる
    // （送信中に自動更新が走って古い内容に置き換わっていても、送った内容に戻す）
    const mark=ok=>setRecords(prev=>{
      const cur=(prev[rec.empId]||{})[rec.date];
      if(ok)return {...prev,[rec.empId]:{...(prev[rec.empId]||{}),[rec.date]:{...rec,synced:true}}};
      if(!cur)return prev;
      return {...prev,[rec.empId]:{...(prev[rec.empId]||{}),[rec.date]:{...cur,synced:false}}};
    });
    setRecords(prev=>({...prev,[rec.empId]:{...(prev[rec.empId]||{}),[rec.date]:{...rec,synced:false}}}));
    if(rec.status&&rec.status!=="draft"){
      const empName=[...employees,...admins].find(x=>x.id===rec.empId)?.name||"";
      return gasPost("saveRecord",{record:{...rec,empName},log})
        .then(r=>{
          settleLocalRecWrite(rec.empId,rec.date);
          // ルールで断られた（refused）→元に戻して理由を表示。通信の失敗→「まだ送信できていません」として残す（従来どおり）
          if(r&&r.refused){handleRefusal(r,[[rec.empId,rec.date,before]]);return false;}
          const ok=!!(r&&r.success!==false);mark(ok);
          if(ok&&log)afterLogResult(r,log);
          return ok;
        })
        .catch(e=>{console.error("GAS保存エラー:",e);settleLocalRecWrite(rec.empId,rec.date);mark(false);return false;});
    }
    settleLocalRecWrite(rec.empId,rec.date);
    mark(true);
    return Promise.resolve(true);
  };
  // まとめて保存する。何件届いたかを返す
  // 2026年9月（重さ対策）：1回の通信（saveRecordsBatch）でまとめて送る。logs は recs と同じ並びで履歴も同時に書く。
  // 古いGAS（まとめて処理に未対応）のときは、従来どおり1件ずつ送る。
  const saveRecords=async(recs,logs)=>{
    const befores=new Map(recs.map(rec=>[`${rec.empId}_${rec.date}`,(records[rec.empId]||{})[rec.date]]));
    recs.forEach(rec=>markLocalRecWrite(rec.empId,rec.date,true));
    setRecords(prev=>{
      const next={...prev};
      recs.forEach(rec=>{next[rec.empId]={...(next[rec.empId]||{}),[rec.date]:{...rec,synced:false}};});
      return next;
    });
    const targets=recs.filter(r=>r.status&&r.status!=="draft");
    const nameOf=id=>[...employees,...admins].find(x=>x.id===id)?.name||"";
    const payload=targets.map(rec=>({...rec,empName:nameOf(rec.empId)}));
    const targetLogs=logs?recs.map((rec,i)=>[rec,logs[i]]).filter(([rec])=>rec.status&&rec.status!=="draft").map(([,l])=>l):null;
    const refused=[];let lastRefusedRes=null;
    let results=[];
    const finish=(rec,ok,r)=>{
      settleLocalRecWrite(rec.empId,rec.date);
      if(r&&r.refused){refused.push([rec.empId,rec.date,befores.get(`${rec.empId}_${rec.date}`)]);lastRefusedRes=r;return false;}
      if(ok)setRecords(prev=>({...prev,[rec.empId]:{...(prev[rec.empId]||{}),[rec.date]:{...rec,synced:true}}}));
      return ok;
    };
    try{
      const r=targets.length?await gasPost("saveRecordsBatch",{records:payload,logs:targetLogs||undefined}):{success:true,results:[]};
      if(r&&r.success===false&&!r.refused&&/不明なaction/.test(String(r.error||""))){
        // 古いGAS：1件ずつ送る（履歴も別の通信で）
        results=await Promise.all(targets.map((rec,i)=>gasPost("saveRecord",{record:payload[i]})
          .then(x=>{const ok=finish(rec,!!(x&&x.success!==false)&&!x.refused,x);if(ok&&targetLogs&&targetLogs[i])postLog(targetLogs[i]);return ok;})
          .catch(e=>{console.error("GAS保存エラー:",e);settleLocalRecWrite(rec.empId,rec.date);return false;})));
      }else if(r&&r.success!==false&&Array.isArray(r.results)){
        results=targets.map((rec,i)=>{const x=r.results[i]||{success:false};return finish(rec,!!x.success,x);});
        if(targetLogs&&r.logged===false&&onLogFailed)onLogFailed("承認");
      }else{
        // 通信の失敗など：全件「まだ送信できていません」のまま残す
        targets.forEach(rec=>settleLocalRecWrite(rec.empId,rec.date));
        results=targets.map(()=>false);
      }
    }catch(e){
      console.error("GAS保存エラー:",e);
      targets.forEach(rec=>settleLocalRecWrite(rec.empId,rec.date));
      results=targets.map(()=>false);
    }
    if(refused.length)handleRefusal(lastRefusedRes,refused);
    return {
      total:results.length,
      ok:results.filter(Boolean).length,
      allOk:results.every(Boolean)
    };
  };
  // 提出はスプレッドシートに届いたことを確認してから知らせる
  // （端末に保存できても通信に失敗すると、管理者に届かないため）
  const [submitting,setSubmitting]=useState(false);
  const submitRecord=async rec=>{
    setSubmitting(true);
    const ok=await saveRecord({...rec,status:"submitted"});
    setSubmitting(false);
    if(ok)showToast("提出しました");
    else showToast(failMsg("提出できませんでした。通信環境を確認して、もう一度お試しください。"),"warning");
  };

  const getMonthlySummary=empId=>{
    const emp=[...employees,...admins].find(x=>x.id===empId);
    const allDays=Object.values(records[empId]||{}).filter(r=>r.date?.startsWith(selectedMonth));
    let tw=0,to=0,tp=0,tl=0,wd=0;
    // 印刷帳票（13番）の内訳用：所定勤務／通常残業／深夜勤務／深夜残業の月合計（分・円）
    let tNormalM=0,tNormalP=0,tOtOnlyM=0,tOtOnlyP=0,tLnOnlyM=0,tLnOnlyP=0,tLnOtM=0,tLnOtP=0;
    const dd=allDays.map(r=>{
      // 保存時に記録した時給を優先（後から時給変更しても過去月は変わらない）
      const c=calcRecord({...r,hourlyWage:r.hourlyWage!=null?r.hourlyWage:(emp?.hourlyWage??1000)});
      // 給与・勤務日数は承認済みのみカウント
      if(r.status==="approved"){
        tw+=c.workMinutes;to+=c.overtimeMinutes;tp+=c.pay;tl+=c.lateNightMinutes;wd++;
        tNormalM+=c.normalMinutes;tNormalP+=c.normalPay;
        tOtOnlyM+=c.otOnlyMinutes;tOtOnlyP+=c.otOnlyPay;
        tLnOnlyM+=c.lnOnlyMinutes;tLnOnlyP+=c.lnOnlyPay;
        tLnOtM+=c.lnOtMinutes;tLnOtP+=c.lnOtPay;
      }
      return{...r,...c};
    });
    // 月給制：勤務日数が1日以上あれば固定の月給額。日給は表示しない
    const isMonthly=emp?.payType==="monthly";
    const monthlyPay=isMonthly?(wd>0?(emp?.monthlyWage||0):0):tp;
    return{emp,days:dd.sort((a,b)=>a.date>b.date?1:-1),totalWork:tw,totalOvertime:to,totalPay:monthlyPay,totalLateNight:tl,workDays:wd,isMonthly,
      totalNormalMinutes:tNormalM,totalNormalPay:tNormalP,
      totalOtOnlyMinutes:tOtOnlyM,totalOtOnlyPay:tOtOnlyP,
      totalLnOnlyMinutes:tLnOnlyM,totalLnOnlyPay:tLnOnlyP,
      totalLnOtMinutes:tLnOtM,totalLnOtPay:tLnOtP};
  };

  // 月次一覧・ダッシュボードで古い月を選んだら、その月を追加で読む
  useEffect(()=>{ if(currentUser)ensureMonthLoaded(selectedMonth); },[selectedMonth,currentUser&&currentUser.id]);
  const handleLogin=emp=>{
    setCurrentUser(emp);setView("employee");
  };
  const handleAdminLogin=adm=>{
    setCurrentUser(adm);
    setView(adm.role==="superadmin"?"dashboard":"employee");
  };
  const handleBack=()=>{
    setCurrentUser(null);setView("login");
  };

  if(view==="login"||!currentUser)return e("div",null,
    e(LoginScreen,{employees,admins,onLogin:handleLogin,onAdminLogin:handleAdminLogin}),
    // スプレッドシートから読めなかったときの警告
    loadFailed&&e("div",{className:"no-print",style:{background:"#fee2e2",borderBottom:"2px solid #fca5a5",
      padding:"10px 16px",fontSize:12.5,color:"#991b1b",fontWeight:700,display:"flex",
      alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}},
      e("span",null,"⚠ "+loadFailed.join("・")+"の情報を読み込めませんでした。表示が最新でない可能性があります。"),
      e("button",{disabled:reloading,onClick:retryLoad,
        style:{padding:"5px 14px",border:"1.5px solid #991b1b",borderRadius:6,background:"white",
          color:"#991b1b",fontSize:12,fontWeight:700,cursor:reloading?"default":"pointer",fontFamily:"inherit"}},
        reloading?"読み込み中…":"再読み込み")
    ),
    toast&&e("div",{className:`toast-center toast-center-${toast.type}`},
      e("div",{style:{fontSize:20,marginBottom:8}},toast.type==="warning"?"⚠️":"✅"),
      toast.msg
    ),
    // スタッフ情報を保存中の表示（閉じると変更が消えるため知らせる）
    syncBusy&&e("div",{style:{position:"fixed",bottom:16,left:"50%",transform:"translateX(-50%)",
      background:"#1e3a5f",color:"white",padding:"9px 18px",borderRadius:20,fontSize:13,
      fontWeight:700,zIndex:1200,boxShadow:"0 2px 10px rgba(0,0,0,.25)"}},"保存中… そのままお待ちください")
  );

  return e("div",{style:{fontFamily:"'Noto Sans JP',sans-serif",minHeight:"100vh",background:"#f0f2f5"}},
    e("nav",{className:"nav no-print"},
      e("div",{className:"nav-brand"},"⏱ 勤怠管理システム"),
      e("div",{style:{display:"flex",alignItems:"center",gap:10}},
        currentUser.role==="superadmin"&&e("span",{style:{fontSize:11,background:"rgba(124,58,237,.6)",padding:"2px 8px",borderRadius:20}},"オーナー"),
        currentUser.role==="admin"&&e("span",{style:{fontSize:11,background:"rgba(255,255,255,.2)",padding:"2px 8px",borderRadius:20}},"管理者"),
        // アプリのプログラム・勤怠データの両方を最新の状態にするボタン（2026年9月：2つあったボタンを1つに統合）
        // タブに戻ってきたときは自動更新されるが、開きっぱなしで気になったときにも押せるようにしてある
        e(UpdateAppButton,null),
        lastLoadedAt&&e("span",{style:{fontSize:10.5,color:"rgba(255,255,255,.65)"}},
          "（"+lastLoadedAt.getHours()+":"+String(lastLoadedAt.getMinutes()).padStart(2,"0")+"時点）"),
        e("button",{style:{fontSize:12,padding:"5px 12px",background:"transparent",color:"white",border:"1px solid rgba(255,255,255,.4)",borderRadius:6,cursor:"pointer",fontFamily:"inherit"},
          onClick:()=>{saveLS("kintai_session",{empId:currentUser.id,role:currentUser.role,view:"login",ts:Date.now()});setCurrentUser(null);setView("login");}},"⌂ ログアウト"),
        // オーナーのみダッシュボードへのリンク
        view==="employee"&&currentUser.role==="superadmin"&&e("button",{style:{fontSize:12,padding:"5px 12px",background:"rgba(124,58,237,.6)",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"},onClick:()=>setView("dashboard")},"📊 ダッシュボード"),
        view==="dashboard"&&currentUser.role==="superadmin"&&e("button",{style:{fontSize:12,padding:"5px 12px",background:"rgba(255,255,255,.2)",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"},onClick:()=>setView("employee")},"← マイ勤怠")
      )
    ),
    // 古い月（通常の読み込み範囲の外）を追加で読んでいるときの表示
    monthLoad&&e("div",{className:"no-print",style:{position:"fixed",top:64,left:"50%",transform:"translateX(-50%)",zIndex:950,
      background:monthLoad.status==="failed"?"#fee2e2":"#1e3a5f",color:monthLoad.status==="failed"?"#991b1b":"white",
      padding:"8px 16px",borderRadius:20,fontSize:13,fontWeight:700,boxShadow:"0 2px 10px rgba(0,0,0,.25)",display:"flex",gap:10,alignItems:"center",maxWidth:"calc(100% - 32px)"}},
      monthLoad.status==="failed"
        ?e(React.Fragment,null,e("span",null,monthLoad.month+"分を読み込めませんでした"),
          e("button",{onClick:()=>ensureMonthLoaded(monthLoad.month,true),style:{padding:"4px 12px",border:"1.5px solid #991b1b",borderRadius:6,background:"white",color:"#991b1b",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}},"再読み込み"),
          e("button",{onClick:()=>setMonthLoad(null),style:{border:"none",background:"none",color:"#991b1b",fontSize:14,cursor:"pointer",fontFamily:"inherit"}},"✕"))
        :e("span",null,monthLoad.month+"分を読み込んでいます…")
    ),
    e("div",{style:{maxWidth:1100,margin:"0 auto",padding:"24px 20px"}},
      e("div",null,
          (view==="employee")&&e(EmployeeView,{currentUser,setCurrentUser,onBack:handleBack,records,setRecords,getRecord,saveRecord,saveRecords,submitRecord,submitting,selectedMonth,setSelectedMonth,getMonthlySummary,showToast,employees,setEmployees,admins,setAdmins,queueStaffOp,setView,closesVersion,ensureMonthLoaded}),
          (view==="dashboard")&&currentUser.role==="superadmin"&&e(AdminDashboard,{employees,setEmployees,admins,setAdmins,queueStaffOp,selectedMonth,setSelectedMonth,getMonthlySummary,showToast,currentUser,setCurrentUser,setView,closesVersion})
        )
    ),
    // スプレッドシートから読めなかったときの警告
    loadFailed&&e("div",{className:"no-print",style:{background:"#fee2e2",borderBottom:"2px solid #fca5a5",
      padding:"10px 16px",fontSize:12.5,color:"#991b1b",fontWeight:700,display:"flex",
      alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap"}},
      e("span",null,"⚠ "+loadFailed.join("・")+"の情報を読み込めませんでした。表示が最新でない可能性があります。"),
      e("button",{disabled:reloading,onClick:retryLoad,
        style:{padding:"5px 14px",border:"1.5px solid #991b1b",borderRadius:6,background:"white",
          color:"#991b1b",fontSize:12,fontWeight:700,cursor:reloading?"default":"pointer",fontFamily:"inherit"}},
        reloading?"読み込み中…":"再読み込み")
    ),
    toast&&e("div",{className:`toast-center toast-center-${toast.type}`},
      e("div",{style:{fontSize:20,marginBottom:8}},toast.type==="warning"?"⚠️":"✅"),
      toast.msg
    ),
    // スタッフ情報を保存中の表示（閉じると変更が消えるため知らせる）
    syncBusy&&e("div",{style:{position:"fixed",bottom:16,left:"50%",transform:"translateX(-50%)",
      background:"#1e3a5f",color:"white",padding:"9px 18px",borderRadius:20,fontSize:13,
      fontWeight:700,zIndex:1200,boxShadow:"0 2px 10px rgba(0,0,0,.25)"}},"保存中… そのままお待ちください")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
