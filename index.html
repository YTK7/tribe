<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤怠管理システム</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;background:#f0f2f5;min-height:100vh}
@media print{
  .no-print{display:none!important}
  .print-only{display:block!important}
  /* 複数人を印刷する場合は1人1ページ。2人目以降の直前で改ページ（末尾に空白ページを作らない） */
  .print-only+.print-only{page-break-before:always;break-before:page}
  body{background:white;margin:0;padding:0}
  @page{size:A4 portrait;margin:7mm}
  /* 1ページに収めるため、表全体を分割禁止＋行の折り返しを最小化 */
  .print-table{width:100%;border-collapse:collapse;font-size:9px;table-layout:fixed;page-break-inside:avoid}
  .print-table tr{page-break-inside:avoid}
  .print-table th,.print-table td{border:1px solid #555;padding:1.6px 3px;line-height:1.2;vertical-align:middle;overflow:hidden}
  .print-table th{background:#d0d0d0;font-weight:bold;text-align:center}
  .print-table tfoot td{background:#e8e8e8;font-weight:bold}
  .print-table .c-nowrap{white-space:nowrap}
  .print-table .c-wrap{white-space:normal;word-break:break-all}
  .print-table .c-right{text-align:right}
  .print-table .row-weekend td{background:#f4f4f4}
  h2{font-size:11px!important;margin-bottom:2px!important}
  p{font-size:8px!important;margin-bottom:2px!important}
}
.status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.05em;display:inline-block}
.status-draft{background:#e8e8e8;color:#666}
.status-submitted{background:#fff3cd;color:#856404}
.status-approved{background:#d1fae5;color:#065f46}
.status-rejected{background:#fee2e2;color:#991b1b}
.btn{padding:8px 18px;border-radius:8px;border:none;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;transition:all .15s}
.btn-primary{background:#1e3a5f;color:white}.btn-primary:hover{background:#16305a}
.btn-success{background:#059669;color:white}.btn-success:hover{background:#047857}
.btn-danger{background:#dc2626;color:white}.btn-danger:hover{background:#b91c1c}
.btn-warning{background:#d97706;color:white}.btn-warning:hover{background:#b45309}
.btn-outline{background:white;color:#1e3a5f;border:2px solid #1e3a5f}.btn-outline:hover{background:#f0f4f8}
.card{background:white;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);padding:20px}
.input-field{width:100%;padding:10px 14px;border:1.5px solid #d1d5db;border-radius:8px;font-family:inherit;font-size:14px;transition:border-color .15s;outline:none;color:#1e3a5f;background:white}
/* 日付・時刻の入力欄はブラウザごとに見た目が違うため、そろえる */
input[type="time"],input[type="date"],input[type="month"]{
  -webkit-appearance:none;appearance:none;box-sizing:border-box;
  font-family:inherit;background:white;color:#1e3a5f;
}
.input-field:focus{border-color:#1e3a5f}
.tab{padding:10px 14px;border:none;background:transparent;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;color:#888;border-bottom:3px solid transparent;transition:all .15s;white-space:nowrap}
.tab.active{color:#1e3a5f;border-bottom-color:#1e3a5f}
.table{width:100%;border-collapse:collapse}
.table th{background:#f8fafc;color:#64748b;font-size:11px;font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid #e2e8f0}
.table td{padding:10px 12px;border-bottom:1px solid #f1f5f9;font-size:13px}
.table tr:hover td{background:#fafbff}
.toast-center{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);padding:24px 32px;border-radius:16px;color:white;font-weight:700;font-size:15px;z-index:9999;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:fadeIn .2s ease;text-align:center;max-width:90vw;min-width:260px}
.toast-center-warning{background:#d97706}
.toast-center-success{background:#059669}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-55%)}to{opacity:1;transform:translate(-50%,-50%)}}
.nav{background:#1e3a5f;color:white;padding:0 16px;display:flex;align-items:center;justify-content:space-between;height:56px;flex-wrap:wrap}
.nav-brand{font-family:'Noto Sans JP','Hiragino Sans',sans-serif;font-size:15px;font-weight:700;letter-spacing:.08em}
.login-btn{display:flex;align-items:center;gap:12px;padding:13px 14px;border:2px solid #e8ecf0;border-radius:14px;background:white;cursor:pointer;text-align:left;font-family:inherit;transition:all .15s;width:100%}
.login-btn:hover{border-color:#1e3a5f;background:#f8faff}
.pin-key{height:52px;border-radius:12px;border:2px solid #e2e8f0;font-size:20px;font-weight:700;color:#1e3a5f;cursor:pointer;font-family:inherit;transition:all .1s;background:white}
.pin-key:hover{background:#f0f4ff}.pin-key.del{background:#fee2e2;color:#dc2626}.pin-key.del:hover{background:#fecaca}
.stat-box{background:white;border-radius:12px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
/* スマホ対応 */
@media(max-width:600px){
  .card{padding:14px;border-radius:12px}
  .btn{padding:8px 12px;font-size:13px}
  .nav-brand{font-size:13px}
  .nav{height:auto;min-height:56px;padding:8px 16px;gap:8px}
  .table th,.table td{padding:8px 8px;font-size:11px;white-space:nowrap}
  .tab{padding:8px 10px;font-size:12px}
  .stat-box{padding:12px 14px}
  .pin-key{height:48px;font-size:18px}
  .stat-grid{grid-template-columns:repeat(2,1fr)!important}
  .emp-header{flex-wrap:wrap!important;gap:8px!important}
  .emp-header-left{flex-wrap:wrap!important;gap:8px!important}
  /* 画面外へのはみ出しを防ぐ */
  body{overflow-x:hidden}
  .input-field{max-width:100%}
  /* iOSで入力欄をタップすると拡大されるのを防ぐ（16px以上が必要） */
  input,select,textarea{font-size:16px!important}
  /* 指でタップしやすい高さを確保する */
  .btn{min-height:40px}
  input,select{min-height:42px}
  /* iOSのSafariは日付・時刻の入力欄に独自の見た目を付けるため、
     高さや配置がずれる。指定を打ち消して他の入力欄とそろえる */
  input[type="time"],input[type="date"],input[type="month"]{
    -webkit-appearance:none;appearance:none;
    display:block;width:100%;box-sizing:border-box;
    min-height:44px;line-height:normal;
    padding:10px 12px;text-align:left;
    background:white;color:#1e3a5f;
  }
  input[type="time"]:disabled,input[type="date"]:disabled,input[type="month"]:disabled{
    background:#f1f5f9;color:#94a3b8;
  }
  /* 中の文字が縦にずれるのを防ぐ */
  input[type="time"]::-webkit-date-and-time-value,
  input[type="date"]::-webkit-date-and-time-value{
    text-align:left;margin:0;
  }
}
/* Android/iOSで端末の文字サイズ設定により表示が崩れるのを防ぐ */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
/* 横方向のはみ出し対策（どの端末でも） */
body{overflow-x:hidden}
/* 表は指でスクロールしやすくする */
.table{width:100%}
</style>

const sortByStore = list => [...list].sort((a,b)=>{
  const d = storeOrder(a.store) - storeOrder(b.store);
  return d !== 0 ? d : String(a.name).localeCompare(String(b.name), "ja");
});

  const sorted = sortByStore(list);
  const out = [];
  sorted.forEach(x => {
    const last = out[out.length - 1];
    if (last && last[0] === x.store) last[1].push(x);
    else out.push([x.store, [x]]);
  });
  return out;
};

  const parts=String(dateStr||"").split("-").map(Number);

  const[y,mo,d]=parts;
  const dowIdx=new Date(y,mo-1,d).getDay();

      Object.entries(recs[id]||{}).forEach(([date,r])=>{
        if(String(date)>=from||(r&&r.synced===false)){(trimmed[id]=trimmed[id]||{})[date]=r;}
      });
    });
    localStorage.setItem("kintai_records",JSON.stringify(trimmed));
  }catch{}
}

// ===== パスワード認証（SHA-256ハッシュ化して保存） =====
async function sha256(str){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    // crypto.subtle が使えない環境（非https等）向けの簡易フォールバック
    let h=5381;for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))>>>0;}
    return "fb_"+h.toString(16)+"_"+str.length;
  }
}
// passHash が null/undefined = 初期パスワードのまま（初回ログイン後に変更必須）
async function verifyPassword(emp,input){
  if(!emp)return false;
  if(emp.passHash==null)return input===INITIAL_PASSWORD;
  return (await sha256(input))===emp.passHash;
}
// 旧データ（PIN方式）→ ID/PW方式への移行。loginIdが無ければ初期リスト or 自動生成で補完
function migrateAuth(list,initialList){
  return (list||[]).map(emp=>{
    const init=(initialList||[]).find(x=>x.id===emp.id);
    const isMonthly=emp.payType==="monthly";
    return {...emp,
      // 旧データに副管理者が残っていれば管理者に変換（副管理者は廃止）
      role:emp.role==="subadmin"?"admin":emp.role,
      // 給与形態に合わない金額は読み込み時に無視する
      // （スプレッドシートに古い数字が残っていても画面には出さない）
      hourlyWage:isMonthly?undefined:emp.hourlyWage,
      monthlyWage:isMonthly?emp.monthlyWage:undefined,
      loginId:emp.loginId||init?.loginId||("user"+emp.id+"@tribe.jp"),
      passHash:emp.passHash!==undefined?emp.passHash:null};
  });
}

const GAS_URL="https://script.google.com/macros/s/AKfycbz_YZdXZ20_PIUR6hofmuJLCLX2gh-CIug7wNC3HRKHT835QpzVx70nPJHZTgb_vowh/exec";

// ===== GAS通信関数 =====
// 通信の設定
const GAS_TIMEOUT_MS=20000;   // 20秒で打ち切る（電波が悪いとき固まらないように）
const GAS_RETRY=2;            // 失敗したらこの回数まで送り直す

// 制限時間つきの通信。時間内に応答がなければ中断する
// （古い端末で中断の仕組みが使えない場合は、そのまま通信する）
async function fetchWithTimeout(url,opts={},ms=GAS_TIMEOUT_MS){
  if(typeof AbortController==="undefined")return fetch(url,opts);
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms);
  try{
    return await fetch(url,{...opts,signal:ctrl.signal});
  }finally{
    clearTimeout(timer);
  }
}
// 通信の記録（2026年9月・重さ対策）：直近の通信について「押してから返事が来るまでの時間」と
// 「そのうちGAS側の処理にかかった時間（GASが返事に付けてくる ms）」を残す。
// 「❓ 使い方」の「通信の記録」から見られる。遅さの原因の切り分けに使う（端末には保存しない）
const commLog=[];
function recordComm(label,totalMs,r,tries){
  commLog.unshift({at:new Date(),label,totalMs,serverMs:(r&&typeof r.ms==="number")?r.ms:null,
    ok:!!(r&&r.success!==false),refused:!!(r&&r.refused),tries});
  if(commLog.length>30)commLog.length=30;
}
// 一時的な不調で失敗することがあるため、少し待って送り直す
async function withRetry(fn,label){
  let last=null;
  const t0=Date.now();
  for(let i=0;i<=GAS_RETRY;i++){
    try{
      const r=await fn();
      if(r&&r.success!==false){recordComm(label,Date.now()-t0,r,i+1);return r;}
      // スプレッドシート側のルールで断られた（refused）ときは、何度送っても同じなので送り直さない
      if(r&&r.refused){recordComm(label,Date.now()-t0,r,i+1);return r;}
      // 「不明なaction」（GASが古くてその機能を知らない）や「データが不正」も、送り直しても変わらないので即座に返す
      if(r&&/不明なaction|データが不正/.test(String(r.error||""))){recordComm(label,Date.now()-t0,r,i+1);return r;}
      last=r;
    }catch(e){
      last={success:false,error:e.name==="AbortError"?"応答がありません（時間切れ）":e.message};
    }
    if(i<GAS_RETRY)await new Promise(res=>setTimeout(res,600*(i+1)));  // 0.6秒 → 1.2秒
  }
  console.error("GAS "+label+" 失敗:",last);
  recordComm(label,Date.now()-t0,last,GAS_RETRY+1);
  return last||{success:false,error:"通信に失敗しました"};
}

// 2026年9月：ブラウザ側のキャッシュにより、GETの問い合わせが「前回と同じ内容」と判定され、
// 古い回答がそのまま返ってきてしまうことがあった（月締めの状態が更新ボタンを押しても
// 反映されないケースの原因のひとつ）。毎回内容が変わる目印(_ts)をURLに付け、
// あわせてfetch自体にもキャッシュを使わない指定をして、必ず最新のデータを取りに行くようにする。
async function gasGet(action,params={}){
  return withRetry(async()=>{
    const q=new URLSearchParams({action,...params,_ts:Date.now()+"_"+Math.random().toString(36).slice(2)}).toString();
    const res=await fetchWithTimeout(`${GAS_URL}?${q}`,{cache:"no-store"});
    return await res.json();
  },"GET "+action);
}
async function gasPost(action,data={}){
  return withRetry(async()=>{
    const res=await fetchWithTimeout(GAS_URL,{method:"POST",body:JSON.stringify({action,...data}),cache:"no-store"});
    return await res.json();
  },"POST "+action);
}
// ===== 読み込む勤怠データの範囲（2026年9月・追加修正⑧・重さ対策） =====
// 通常の読み込みは「当月＋前2か月」だけにする（全期間を毎回読むと、月を追うごとに待ち時間と
// 端末の保存量が増えていくため）。それより古い月は、画面でその月を選んだときに、その月だけ追加で読む。
const RECORD_WINDOW_MONTHS=3;   // 当月を含めて何か月分を通常読み込みするか（当月＋前2か月＝3）
function monthKeyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function addMonths(month,n){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+n,1);return monthKeyOf(d);}
function baseWindow(){const to=monthKeyOf(new Date());return {from:addMonths(to,-(RECORD_WINDOW_MONTHS-1)),to};}
// この画面で追加で読み込んだ古い月（自動更新のときも一緒に読み直す。ページを開き直すと空に戻る）
const extraMonths=new Set();
function inLoadedRange(month){const w=baseWindow();return (month>=w.from&&month<=w.to)||extraMonths.has(month);}

// ===== 端末とスプレッドシートのズレ対策（2026年9月・追加修正⑥） =====
// この端末で直近に書き換えた勤怠（"empId_date" → 書き換えた時刻）。
// 読み込みの途中にこの端末で保存・削除した記録を、少し古い読み込み結果で
// 上書き・復活・削除してしまわないようにするために使う。
// 値は {at:書き換えた時刻, pending:GASへの送信がまだ終わっていないか}。
// 送信が終わるまでは、読み込み結果（送信前に読んだ古い内容かもしれない）で打ち消さない。
const localRecWrites=new Map();
function markLocalRecWrite(empId,date,pending){localRecWrites.set(`${empId}_${date}`,{at:Date.now(),pending:!!pending});}
// 送信が終わったら pending を外す（at は書き換えた時刻のまま。送信直後に始まる読み込みより「新しい」扱いにしないため）
function settleLocalRecWrite(empId,date){const k=`${empId}_${date}`;const w=localRecWrites.get(k);localRecWrites.set(k,{at:w?w.at:0,pending:false});}
function isLocalRecWriteFresh(empId,date,since){const w=localRecWrites.get(`${empId}_${date}`);return !!w&&(w.pending||w.at>=since);}
// スプレッドシート側のルール（月締め済み・承認済みなど）で保存を断られたときの理由。
// 「通信環境を確認して」という誤った案内ではなく、断られた本当の理由を表示するために使う
let lastRefusal=null;
// 断られたときに最新の状態を読み込み直すための受け口（Appから設定される）
let onRefusalReload=null;
function refusalText(r){
  // GAS側の文言に「（画面を最新の状態に更新してください）」が付いている場合は外し、画面側の案内にそろえる
  return String(r).replace(/（画面を最新の状態に更新してください）/g,"")+"（画面を最新の状態に読み込み直します）";
}
function failMsg(defaultMsg){
  const r=lastRefusal;lastRefusal=null;
  return r?refusalText(r):defaultMsg;
}
// レコード削除をGASにも通知（リセット・差戻取消でスプレッドシートと不整合にならないように）
// log を渡すと、操作履歴も同じ通信で書く（古いGASでは無視されるので、その場合はあとから別に送る）
function gasDeleteRecord(empId,date,log){
  return gasPost("deleteRecord",{empId,date,log})
    .then(r=>{
      if(r&&r.refused){lastRefusal=r.error||null;if(onRefusalReload)onRefusalReload();return false;}
      const ok=!!(r&&r.success!==false);
      if(ok&&log)afterLogResult(r,log);
      return ok;
    })
    .catch(e=>{console.error("GAS削除エラー:",e);return false;});
}
// 管理者の操作を履歴として記録する（承認・差戻し・差戻し取消・月締め）
// 履歴の記録に失敗したときに知らせるための受け口（Appから設定される）
let onLogFailed=null;
// 「今日」タブで未保存（未提出）の入力があるかどうか（EmployeeViewから更新される）。
// 「🔄 最新の状態に更新」ボタンを押したときに、入力中の内容を誤って消さないよう確認するために使う。
let hasUnsavedEntryFlag=false;
function makeLog(by,action,targetName,targetDate,note){
  return {at:new Date().toISOString(),by:by||"",action:action||"",targetName:targetName||"",targetDate:targetDate||"",note:note||""};
}
// 保存などと同じ通信で履歴を送ったあとの後始末：
//  ・GASが logged を返してこない（古いGAS）→ 従来どおり別の通信で履歴を送る
//  ・logged:false（書けなかった）→ 知らせるだけにする（本来の操作は完了している）
function afterLogResult(r,log){
  if(!r||r.logged===undefined){postLog(log);return;}
  if(r.logged===false&&onLogFailed)onLogFailed(log.action);
}
function postLog(log){
  return gasPost("addLog",{log}).then(r=>{
    const ok=!!(r&&r.success!==false);
    if(!ok&&onLogFailed)onLogFailed(log.action);
    return ok;
  }).catch(e=>{console.error("履歴の記録に失敗:",e);if(onLogFailed)onLogFailed(log.action);return false;});
}
function logAction(by,action,targetName,targetDate,note){
  return gasPost("addLog",{log:makeLog(by,action,targetName,targetDate,note)}).then(r=>{
    const ok=!!(r&&r.success!==false);
    // 勤怠そのものは保存できているので、操作は止めずに知らせるだけにする
    if(!ok&&onLogFailed)onLogFailed(action);
    return ok;
  }).catch(e=>{
    console.error("履歴の記録に失敗:",e);
    if(onLogFailed)onLogFailed(action);
    return false;
  });
}

function getAdminCloseKey(empId,month){return `kintai_admin_closed_${empId}_${month}`;}  // 端末の控え（スプレッドシートから読めないときだけ使う）

const localCloseWrites=new Map();

// 画面用に即時反映しつつ、GASにも送って全員に共有する
// byId・passHashはオーナー本人確認用（GAS側でも役割・パスワードを照合する）

// 古いGAS（まとめて処理に未対応）のときは、従来どおり1人ずつ送る。
// 画面には先に反映し、GASに断られた・届かなかったときは元に戻す。
async function setAdminClosedMany(empIds,month,by,byId,passHash,log){
  return applyCloseMany(true,empIds,month,{by:by||"",byId,passHash,log});
}
async function unsetAdminClosedMany(empIds,month,byId,passHash,log){
  return applyCloseMany(false,empIds,month,{byId,passHash,log});
}
async function applyCloseMany(closed,empIds,month,body){
  const keys=empIds.map(id=>closeKey(id,month));
  const before=keys.map(k=>closedSet.has(k));
  keys.forEach(k=>{ if(closed)closedSet.add(k); else closedSet.delete(k); localCloseWrites.set(k,{closed,at:Date.now(),pending:true}); });
  let ok=false,r=null;
  try{
    r=await gasPost(closed?"setCloseBatch":"unsetCloseBatch",{empIds,month,...body});
    if(r&&r.success===false&&!r.refused&&/不明なaction/.test(String(r.error||""))){
      // 古いGAS：1人ずつ送る（履歴も別の通信で送る）
      const rs=await Promise.all(empIds.map(id=>gasPost(closed?"setClose":"unsetClose",closed?{empId:id,month,by:body.by,byId:body.byId,passHash:body.passHash}:{empId:id,month,byId:body.byId,passHash:body.passHash}).then(x=>!!(x&&x.success!==false)).catch(()=>false)));
      ok=rs.every(Boolean);
      if(ok&&body.log)postLog(body.log);
    }else{
      ok=!!(r&&r.success!==false);
      if(r&&r.refused)lastRefusal=r.error||null;
      if(ok&&body.log)afterLogResult(r,body.log);
    }
  }catch(e){ok=false;}
  keys.forEach((k,i)=>{
    if(ok){const w=localCloseWrites.get(k);localCloseWrites.set(k,{closed,at:w?w.at:0,pending:false});try{ if(closed)localStorage.setItem("kintai_admin_closed_"+k,"1"); else localStorage.removeItem("kintai_admin_closed_"+k); }catch{}}
    else{ if(before[i])closedSet.add(k); else closedSet.delete(k); localCloseWrites.delete(k); }
  });
  return ok;
}
// 起動時・再読み込み時にスプレッドシートの内容で上書きする
// loadStartedAt：その読み込みを始めた時刻。読み込み中にこの端末で締め・解除した分だけは端末側を優先する
function applyClosesFromServer(list,loadStartedAt){
  const next=new Set();
  (list||[]).forEach(c=>{ if(c&&c.empId!=null&&c.month)next.add(closeKey(c.empId,c.month)); });
  localCloseWrites.forEach((w,k)=>{ if(w.pending||w.at>=(loadStartedAt||0)){ if(w.closed)next.add(k); else next.delete(k); } });
  closedSet.clear();
  next.forEach(k=>closedSet.add(k));
  closesLoadedFromServer=true;
  // 端末の控えも「最後にスプレッドシートから読めた状態」にそろえる（食い違いが残らないように）
  try{
    const old=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("kintai_admin_closed_")===0)old.push(k);}
    old.forEach(k=>localStorage.removeItem(k));
    closedSet.forEach(k=>localStorage.setItem("kintai_admin_closed_"+k,"1"));
  }catch{}
}

// 「HH:MM」→分に変換
function toMin(t){
  if(!t||typeof t!=="string"||t.length<4)return null;
  const h=parseInt(t.slice(0,2),10),m=parseInt(t.slice(3,5),10);
  if(!Number.isFinite(h)||!Number.isFinite(m))return null;
  return h*60+m;
}
// 重なり合う区間をまとめる（休憩の二重控除を防ぐ）
function mergeRanges(ranges){
  if(ranges.length===0)return[];
  const sorted=[...ranges].sort((a,b)=>a[0]-b[0]);
  const out=[sorted[0].slice()];
  for(let i=1;i<sorted.length;i++){
    const cur=sorted[i],last=out[out.length-1];
    if(cur[0]<=last[1])last[1]=Math.max(last[1],cur[1]);
    else out.push(cur.slice());
  }
  return out;
}
// 2区間の重なり（分）
const overlapMin=(a1,a2,b1,b2)=>Math.max(0,Math.min(a2,b2)-Math.max(a1,b1));

function calcRecord(rec){
  // normal/otOnly/lnOnly/lnOt＝所定勤務／通常残業／深夜勤務／深夜残業の内訳（分・円）。
  // 印刷帳票（13番）の内訳表示のために追加。合計payの計算・丸め方はこれまでと変えていない
  const ZERO={workMinutes:0,overtimeMinutes:0,lateNightMinutes:0,pay:0,
    normalMinutes:0,normalPay:0,otOnlyMinutes:0,otOnlyPay:0,
    lnOnlyMinutes:0,lnOnlyPay:0,lnOtMinutes:0,lnOtPay:0};
  if(!rec||!rec.clockIn||!rec.clockOut)return ZERO;
  const inMin=toMin(rec.clockIn);
  let outMin=toMin(rec.clockOut);
  if(inMin==null||outMin==null)return ZERO;
  // 出勤と退勤が同じ時刻＝勤務0分として扱う（打刻ミス対策）
  if(outMin===inMin)return ZERO;
  // 退勤が出勤より前なら翌日にまたぐ勤務とみなす
  if(outMin<inMin)outMin+=1440;
  const total=Math.min(outMin-inMin,24*60);
  const shiftEnd=inMin+total;

  // 休憩・移動を「シフト開始からの時間軸」に正規化して区間化
  const toRanges=arr=>{
    const out=[];
    (arr||[]).forEach(x=>{
      if(!x||!x.start||!x.end)return;
      let s=toMin(x.start),en=toMin(x.end);
      if(s==null||en==null)return;
      if(s===en)return;                // 同時刻＝0分として無視
      // 日をまたいだ時刻をシフト軸に合わせる
      if(s<inMin)s+=1440;
      if(en<inMin)en+=1440;
      if(en<=s)en+=1440;
      // 勤務時間の範囲内にクランプ（範囲外の入力で給与が狂わないように）
      const cs=Math.max(s,inMin),ce=Math.min(en,shiftEnd);
      if(ce>cs)out.push([cs,ce]);
    });
    return mergeRanges(out);
  };

  const breakRanges=toRanges(rec.breaks);
  let bm=breakRanges.reduce((n,[s,e2])=>n+(e2-s),0);

  // 移動時間（モノレール勤務のみ）。休憩と重なる分は二重控除しない
  const isMonorail=isMonorailWork(rec.empId,rec.store);
  const deductRanges=mergeRanges([...breakRanges,...toRanges(isMonorail?rec.travelTimes:[])]);
  let dm=deductRanges.reduce((n,[s,e2])=>n+(e2-s),0);
  // 旧データ（breakMinutesのみ保存されている場合）の互換
  if(dm===0&&rec.breakMinutes)dm=Math.max(0,Number(rec.breakMinutes)||0);

  const wm=Math.max(0,total-dm);
  const om=Math.max(0,wm-OVERTIME_THRESHOLD*60);

  // 深夜帯（22:00〜翌5:00）を前日・当日・翌日ぶん用意して重なりを合算
  let lnWork=0,lnDeduct=0;
  for(let k=-1;k<=1;k++){
    const ns=1320+1440*k, ne=1740+1440*k;   // 22:00〜29:00(=翌5:00)
    lnWork+=overlapMin(inMin,shiftEnd,ns,ne);
    deductRanges.forEach(([s,e2])=>{lnDeduct+=overlapMin(s,e2,ns,ne);});
  }
  const ln=Math.min(wm,Math.max(0,lnWork-lnDeduct));

  // 給与：通常×1.0 残業のみ×1.25 深夜のみ×1.25 深夜残業×1.5
  const lnOt=Math.min(ln,om),lnOnly=ln-lnOt,otOnly=om-lnOt,normal=wm-om-lnOnly;
  const wage=Math.max(0,rec.hourlyWage!=null?Number(rec.hourlyWage)||0:1000),pm=wage/60;
  const pay=Math.round(normal*pm+otOnly*pm*1.25+lnOnly*pm*1.25+lnOt*pm*1.5);
  // 内訳表示用（4区分ごとに丸めるため、合計payとは端数の丸め方が異なり、
  // 内訳を足した額が合計と1〜数円ずれることがある。合計欄は上のpayをそのまま使う）
  const normalPay=Math.round(normal*pm);
  const otOnlyPay=Math.round(otOnly*pm*1.25);
  const lnOnlyPay=Math.round(lnOnly*pm*1.25);
  const lnOtPay=Math.round(lnOt*pm*1.5);
  return{workMinutes:Math.round(wm),overtimeMinutes:Math.round(om),lateNightMinutes:Math.round(ln),
    pay:Number.isFinite(pay)?pay:0,
    normalMinutes:Math.round(normal),normalPay:Number.isFinite(normalPay)?normalPay:0,
    otOnlyMinutes:Math.round(otOnly),otOnlyPay:Number.isFinite(otOnlyPay)?otOnlyPay:0,
    lnOnlyMinutes:Math.round(lnOnly),lnOnlyPay:Number.isFinite(lnOnlyPay)?lnOnlyPay:0,
    lnOtMinutes:Math.round(lnOt),lnOtPay:Number.isFinite(lnOtPay)?lnOtPay:0};
}
function mHHMM(m){return `${Math.floor(m/60)}時間${String(m%60).padStart(2,"0")}分`}

// ===== 共通ヘルパー（同じ判定・整形が各所で必要なためまとめる） =====
// モノレール勤務か（移動時間の対象になるか）
function isMonorailWork(empId,store){
  return CONSTRUCTION_IDS.includes(empId)||store==="モノレール";
}
// 「移動」列を表示するか（対象スタッフ、またはその月に移動の記録がある）
function needTravelCol(emp,recs){
  if(!emp)return false;
  if(isMonorailWork(emp.id,emp.store))return true;
  return (recs||[]).some(r=>(r.travelTimes||[]).some(t=>t.start&&t.end));
}
// 氏名から苗字だけ取り出す（印刷帳票で幅を取らないようにするため）
function shortName(n){
  if(!n)return "";
  const s=String(n).trim();
  const sp=s.indexOf(" ")>=0?s.indexOf(" "):s.indexOf("　");
  return sp>0?s.slice(0,sp):s;
}
// 休憩・移動の時間帯を「12:00〜13:00/15:00〜15:30」の形に整える
function rangeText(arr,fallback){
  const v=(arr||[]).filter(x=>x.start&&x.end);
  return v.length?v.map(x=>x.start+"〜"+x.end).join("/"):(fallback||"—");
}

// ===== 本人確認モーダル（月締め・解除はオーナー限定＋パスワード確認） =====
function OwnerPasswordModal({currentUser,actionLabel,onCancel,onConfirm}){
  const [pw,setPw]=useState("");
  const [err,setErr]=useState(null);
  const [checking,setChecking]=useState(false);
  const go=async()=>{
    if(!pw){setErr("パスワードを入力してください");return;}
    setChecking(true);
    // まず画面側で確認し、間違っていればここで止める（GAS側でも同じ照合をあらためて行う）
    const ok=await verifyPassword(currentUser,pw);
    if(!ok){setChecking(false);setErr("パスワードが違います");return;}
    const hash=await sha256(pw);
    setChecking(false);
    onConfirm(hash);
  };
  return e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:1000,
    display:"flex",alignItems:"center",justifyContent:"center",padding:16,overflowY:"auto"}},
    e("div",{style:{background:"white",borderRadius:18,width:"100%",maxWidth:360,padding:22,margin:"auto"}},
      e("div",{style:{fontSize:17,fontWeight:700,color:"#1e3a5f",textAlign:"center"}},"🔒 本人確認"),
      e("div",{style:{fontSize:12.5,color:"#94a3b8",margin:"4px 0 16px",textAlign:"center"}},
        actionLabel+"には、オーナー本人のパスワード確認が必要です"),
      e("input",{type:"password",value:pw,autoFocus:true,
        onChange:ev=>{setPw(ev.target.value);setErr(null);},
        onKeyDown:ev=>{if(ev.key==="Enter")go();},
        placeholder:"パスワード",
        style:{width:"100%",padding:"10px 12px",border:"1.5px solid #d1d5db",borderRadius:8,
          fontFamily:"inherit",fontSize:15,outline:"none",boxSizing:"border-box"}}),
      err&&e("p",{style:{color:"#dc2626",fontSize:12,fontWeight:700,marginTop:8}},err),
      e("div",{style:{display:"flex",flexDirection:"column",gap:8,marginTop:16}},
        e("button",{className:"btn btn-primary",style:{width:"100%"},disabled:checking,onClick:go},checking?"確認中…":"確認して実行"),
        e("button",{onClick:onCancel,style:{width:"100%",padding:8,border:"none",background:"none",
          color:"#94a3b8",fontSize:12.5,cursor:"pointer",fontFamily:"inherit",textDecoration:"underline"}},"キャンセル")
      )
    )
  );
}

function PasswordChangeModal({currentUser,onDone,onCancel,isForced}){
  const [p1,setP1]=useState("");
  const [p2,setP2]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState(null);
  const [busy,setBusy]=useState(false);
  const isBi=currentUser?.bilingual===true||BILINGUAL_IDS.includes(currentUser?.id);
  const submit=async()=>{
    if(busy)return;
    if(p1.length<PASSWORD_MIN){setErr(L("パスワードは"+PASSWORD_MIN+"文字以上にしてください","At least "+PASSWORD_MIN+" characters",isBi));return;}
    if(p1===INITIAL_PASSWORD){setErr(L("初期パスワードは使用できません","Initial password is not allowed",isBi));return;}
    if(p1!==p2){setErr(L("パスワードが一致しません。もう一度入力してください。","Passwords do not match.",isBi));setP2("");return;}
    setBusy(true);
    const h=await sha256(p1);
    setBusy(false);
    onDone(h);
  };
  const inputStyle={width:"100%",padding:"11px 14px",border:"1.5px solid #d1d5db",borderRadius:8,fontFamily:"inherit",fontSize:15,outline:"none"};
  return e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",backdropFilter:"blur(8px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,overflowY:"auto"}},

      e("div",{style:{fontSize:32,marginBottom:8,textAlign:"center"}},"🔐"),
      e("h3",{style:{fontSize:16,fontWeight:700,color:"#1e3a5f",marginBottom:6,textAlign:"center"}},
        isForced?L("パスワードの設定が必要です","Password Setup Required",isBi):L("パスワード変更","Change Password",isBi)

      e("p",{style:{fontSize:12,color:"#64748b",marginBottom:16,textAlign:"center"}},

          :L("新しいパスワードを設定してください。","Please set a new password.",isBi)
      ),
      e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},L("新しいパスワード（"+PASSWORD_MIN+"文字以上）","New Password ("+PASSWORD_MIN+"+ chars)",isBi)),
      e("input",{type:showPw?"text":"password",value:p1,onChange:ev=>{setP1(ev.target.value);setErr(null);},style:Object.assign({},inputStyle,{marginBottom:10}),autoComplete:"new-password"}),
      e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},L("もう一度入力","Confirm Password",isBi)),
      e("input",{type:showPw?"text":"password",value:p2,onChange:ev=>{setP2(ev.target.value);setErr(null);},onKeyDown:ev=>{if(ev.key==="Enter")submit();},style:Object.assign({},inputStyle,{marginBottom:8}),autoComplete:"new-password"}),
      e("label",{style:{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#64748b",marginBottom:10,cursor:"pointer"}},
        e("input",{type:"checkbox",checked:showPw,onChange:ev=>setShowPw(ev.target.checked)}),L("パスワードを表示","Show password",isBi)
      ),

// ===== アプリを最新版にするボタン =====
// ホーム画面に追加したアイコンから開いている場合、アドレスバーがなく
// 「URLの末尾に?v=2を付けて開き直す」というキャッシュ回避の操作ができない。
// このボタンは、押すたびに変わる値をURLに付けて開き直すことで、それを自動で行う。
// location.reload()は今のブラウザでは古いキャッシュのまま返ってくることがあるため使わない。
// ※これで直るのは「アプリのプログラムが古い」場合のみ。端末に保存されているデータ自体が
//   壊れているケースはこのボタンでは直らない（12番・引き継ぎメモ参照）。
function refreshApp(){
  const base=location.origin+location.pathname;
  location.href=base+"?v="+Date.now();
}
// アプリのプログラム・勤怠データの両方を最新の状態にするボタン（2026年9月：2つあったボタンを1つに統合）
// 「今日」タブに未保存（未提出）の入力があるときは、誤って消してしまわないよう確認してから実行する。
function UpdateAppButton(){
  const onClick=()=>{
    if(hasUnsavedEntryFlag&&!window.confirm(
      "入力中（未提出分）の内容が消えます。よろしいですか？\n※すでに保存・提出済みのデータは消えません。"
    ))return;
    refreshApp();
  };
  return e("button",{
    type:"button",
    title:"表示が古い場合はここを押して、アプリのプログラムと勤怠データの両方を最新の状態に読み込み直してください",
    style:{fontSize:12,padding:"5px 12px",background:"transparent",color:"white",
      border:"1px solid rgba(255,255,255,.4)",borderRadius:6,cursor:"pointer",fontFamily:"inherit"},
    onClick
  },"🔄 最新の状態に更新");
}

// ===== LOGIN SCREEN（ID・パスワード方式） =====
function LoginScreen({employees,admins,onLogin,onAdminLogin}){
  const [loginId,setLoginId]=useState("");
  const [pw,setPw]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState(null);
  const [busy,setBusy]=useState(false);
  const doLogin=async()=>{
    if(busy)return;
    const idv=loginId.trim().toLowerCase();
    if(!idv||!pw){setErr("IDとパスワードを入力してください");return;}
    setBusy(true);
    const all=[...employees,...(admins||[])];
    const emp=all.find(x=>String(x.loginId||"").toLowerCase()===idv);
    const ok=emp?await verifyPassword(emp,pw):false;
    setBusy(false);
    if(!ok){setErr("IDまたはパスワードが違います");setPw("");return;}
    if(emp.role==="admin"||emp.role==="superadmin")onAdminLogin(emp);
    else onLogin(emp);
  };
  return e("div",{style:{minHeight:"100vh",background:"#f0f2f5",display:"flex",flexDirection:"column"}},
    e("nav",{className:"nav"},
      e("div",{className:"nav-brand"},"⏱ 勤怠管理システム"),
      e(UpdateAppButton,null)
    ),
    e("div",{style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:24}},
      e("div",{style:{width:400,maxWidth:"100%",boxSizing:"border-box"}},
        e("div",{className:"card"},
          e("h2",{style:{fontSize:18,fontWeight:700,color:"#1e3a5f",marginBottom:4,textAlign:"center"}},"ログイン"),
          e("p",{style:{fontSize:12,color:"#94a3b8",marginBottom:20,textAlign:"center"}},"ログインIDとパスワードを入力してください"),
          e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},"ログインID"),
          e("input",{type:"email",value:loginId,onChange:ev=>{setLoginId(ev.target.value);setErr(null);},onKeyDown:ev=>{if(ev.key==="Enter")doLogin();},placeholder:"example@tribe.jp",autoComplete:"username",className:"input-field",style:{marginBottom:14}}),
          e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},"パスワード"),
          e("input",{type:showPw?"text":"password",value:pw,onChange:ev=>{setPw(ev.target.value);setErr(null);},onKeyDown:ev=>{if(ev.key==="Enter")doLogin();},autoComplete:"current-password",className:"input-field",style:{marginBottom:8}}),
          e("label",{style:{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#64748b",marginBottom:12,cursor:"pointer"}},
            e("input",{type:"checkbox",checked:showPw,onChange:ev=>setShowPw(ev.target.checked)}),"パスワードを表示"
          ),
          err&&e("p",{style:{color:"#dc2626",fontSize:12,fontWeight:700,marginBottom:12,textAlign:"center"}},err),
          e("button",{className:"btn btn-primary",style:{width:"100%",padding:"12px"},onClick:doLogin,disabled:busy},busy?"確認中…":"ログイン"),
          e("p",{style:{fontSize:11,color:"#94a3b8",marginTop:14,textAlign:"center",lineHeight:1.6}},"パスワードを忘れた場合は管理者（オーナー）にリセットを依頼してください")

    ?(emp.payType==="monthly"?" ／ 月給: ¥"+(emp.monthlyWage||0).toLocaleString():" ／ 時給: ¥"+(emp.hourlyWage||0).toLocaleString())
    :"";

  // 列幅（重み）→ 1ページに収まるよう固定幅で割り当てる（合計は100でなくてもよい。下でtotalWに対する比率に変換される）
  // 状態欄・日給欄は余白が出やすいため縮小し、実働/残業/深夜の3列は
  // 所定勤務／通常残業／深夜勤務／深夜残業の4列に分けて表示する（2026年9月）
  const cols=showTravel?[
    {k:"date",label:"日付",w:5.5,cls:"c-nowrap"},
    {k:"store",label:"店舗",w:7,cls:"c-wrap"},
    {k:"in",label:"出勤",w:5,cls:"c-nowrap"},
    {k:"out",label:"退勤",w:5,cls:"c-nowrap"},
    {k:"brk",label:"休憩",w:9.5,cls:"c-wrap"},
    {k:"trv",label:"移動",w:8.5,cls:"c-wrap"},
    {k:"note",label:"備考",w:10,cls:"c-wrap"},
    {k:"normal",label:"所定勤務",w:6,cls:"c-nowrap"},
    {k:"otOnly",label:"通常残業",w:6,cls:"c-nowrap"},
    {k:"lnOnly",label:"深夜勤務",w:6,cls:"c-nowrap"},
    {k:"lnOt",label:"深夜残業",w:6,cls:"c-nowrap"},
    {k:"st",label:"状態",w:showPay?8:14.5,cls:"c-wrap"},
    ...(showPay?[{k:"pay",label:"日給(円)",w:6.5,cls:"c-nowrap c-right"}]:[])
  ]:[
    {k:"date",label:"日付",w:6,cls:"c-nowrap"},
    {k:"store",label:"店舗",w:7.5,cls:"c-wrap"},
    {k:"in",label:"出勤",w:5.5,cls:"c-nowrap"},
    {k:"out",label:"退勤",w:5.5,cls:"c-nowrap"},
    {k:"brk",label:"休憩",w:10.5,cls:"c-wrap"},
    {k:"note",label:"備考",w:11,cls:"c-wrap"},
    {k:"normal",label:"所定勤務",w:6.5,cls:"c-nowrap"},
    {k:"otOnly",label:"通常残業",w:6.5,cls:"c-nowrap"},
    {k:"lnOnly",label:"深夜勤務",w:6.5,cls:"c-nowrap"},
    {k:"lnOt",label:"深夜残業",w:6.5,cls:"c-nowrap"},
    {k:"st",label:"状態",w:showPay?8.5:15.5,cls:"c-wrap"},
    ...(showPay?[{k:"pay",label:"日給(円)",w:7,cls:"c-nowrap c-right"}]:[])
  ];
  const totalW=cols.reduce((s,c)=>s+c.w,0);

  return e("div",{className:"print-only",style:{display:"none",padding:0}},
    e("h2",{style:{fontSize:14,marginBottom:4}},"勤怠集計表"+(isAdmin?" （給与含む）":"")),
    // 氏名・部署・時給・対象月は読みやすいよう文字を大きくする（13番）
    e("p",{style:{fontSize:15,fontWeight:700,marginBottom:6}},
      "氏名: "+emp.name+" ／ 部署: "+emp.department+wageLabel+
      " ／ 対象月: "+selectedMonth
    ),
    e("p",{style:{fontSize:10,marginBottom:8,color:"#666"}},
      "※ 承認済みのデータのみ集計"+
      (isMonthly&&isAdmin?"　／　月給制のため支給額は月額固定（当月支給額: ¥"+(totalPay||0).toLocaleString()+"）":"")),
    e("table",{className:"print-table"},
      e("colgroup",null,...cols.map(c=>e("col",{key:c.k,style:{width:(c.w/totalW*100).toFixed(2)+"%"}}))),
      e("thead",null,e("tr",null,...cols.map(c=>e("th",{key:c.k},c.label)))),
      e("tbody",null,...allDates.map((date,i)=>{
        const r=recMap[date];
        const dayNum=i+1;
        const dowIdx=new Date(y,m-1,dayNum).getDay();
        const dateLabel=`${m}/${dayNum}(${DOW[dowIdx]})`;
        const breakStr=r?rangeText(r.breaks,r.breakMinutes?r.breakMinutes+"分":"—"):"—";
        const travelStr=r?rangeText(r.travelTimes):"—";
        const isWeekend=dowIdx===0||dowIdx===6;
        return e("tr",{key:i,className:isWeekend?"row-weekend":""},
          e("td",{className:"c-nowrap"},dateLabel),
          e("td",{className:"c-wrap"},r?.store?(STORE_ABBR[r.store]||r.store):"—"),
          e("td",{className:"c-nowrap"},r?.clockIn||"—"),
          e("td",{className:"c-nowrap"},r?.clockOut||"—"),
          e("td",{className:"c-wrap"},breakStr),
          ...(showTravel?[e("td",{key:"tv",className:"c-wrap"},travelStr)]:[]),
          e("td",{className:"c-wrap"},r?.note||"—"),
          e("td",{className:"c-nowrap"},r?mHHMM(r.normalMinutes):"—"),
          e("td",{className:"c-nowrap"},r?mHHMM(r.otOnlyMinutes):"—"),
          e("td",{className:"c-nowrap"},r?mHHMM(r.lnOnlyMinutes):"—"),
          e("td",{className:"c-nowrap"},r?mHHMM(r.lnOtMinutes):"—"),
          // 状態のあとに、承認した人／差し戻した人を小さく並べる
          e("td",{className:"c-wrap"},
            r?S_LABEL_S[r.status||"draft"]:"—",
            r&&(r.status==="approved"?r.approvedBy:r.status==="rejected"?r.rejectBy:null)
              ?e("span",{style:{color:"#666",marginLeft:3}},
                  " "+shortName(r.status==="approved"?r.approvedBy:r.rejectBy))
              :null
          ),
          ...(showPay?[e("td",{key:"pay",className:"c-nowrap c-right"},r?.status==="approved"?"¥"+(r.pay||0).toLocaleString():"—")]:[])
        );
      })),
      e("tfoot",null,
        e("tr",{style:{fontWeight:"bold",background:"#e8e8e8"}},
          // 合計は「96時間00分」と長くなり列に収まらないため、
          // 左側にまとめて書き、金額だけ右端に出す。
          // 内訳（所定勤務／通常残業／深夜勤務／深夜残業）は日給(円)列の有無に関わらず
          // 常に表示し、金額（¥）だけ日給(円)列が出る条件（=showPay）のときのみ付ける（13番）。
          // 右端の合計欄は変更しない
          e("td",{colSpan:cols.length-(showPay?1:0),className:"c-wrap"},
            e("div",null,
              e("div",null,"承認済合計"),
              e("div",{style:{fontWeight:600,marginTop:2}},"　勤務日数　"+workDays+"日"),
              e("div",{style:{fontWeight:600}},"　所定勤務　"+mHHMM(totalNormalMinutes||0)+(showPay?"　¥"+(totalNormalPay||0).toLocaleString():"")),
              e("div",{style:{fontWeight:600}},"　通常残業　"+mHHMM(totalOtOnlyMinutes||0)+(showPay?"　¥"+(totalOtOnlyPay||0).toLocaleString():"")),
              e("div",{style:{fontWeight:600}},"　深夜勤務　"+mHHMM(totalLnOnlyMinutes||0)+(showPay?"　¥"+(totalLnOnlyPay||0).toLocaleString():"")),
              e("div",{style:{fontWeight:600}},"　深夜残業　"+mHHMM(totalLnOtMinutes||0)+(showPay?"　¥"+(totalLnOtPay||0).toLocaleString():""))
            )
          ),
          ...(showPay?[e("td",{key:"total",className:"c-nowrap c-right",style:{verticalAlign:"top"}},
            e("div",null,"¥"+totalPay.toLocaleString()),
            e("div",{style:{fontSize:8,fontWeight:400,color:"#666",marginTop:2,whiteSpace:"normal",wordBreak:"break-all"}},"※内訳は端数処理の関係で数円ずれる場合あり")
          )]:[])
        )
      )
    )
  );
}
// ===== APPROVAL TAB =====
function ApprovalTab({currentUser,employees,admins,records,setRecords,saveRecord,saveRecords,selectedMonth,showToast,ensureMonthLoaded}){
  const managedStores=currentUser.managedStores||[currentUser.store];
  const [approvalMonth,setApprovalMonth]=useState(selectedMonth);
  // 古い月を選んだら、その月の勤怠を追加で読む（通常は当月＋前2か月しか読んでいないため）
  useEffect(()=>{ if(ensureMonthLoaded)ensureMonthLoaded(approvalMonth); },[approvalMonth]);
  const [selEmpId,setSelEmpId]=useState(null);
  // closedSet（月締めの状態）はReactの外側にあるため、更新後に画面を
  // 再描画させるための空のカウンター。値そのものは使わない
  const [,forceRerender]=useState(0);
  const bumpRerender=()=>forceRerender(n=>n+1);

  // IDで重複排除（employeesとadminsに同一IDが存在する場合に備える）
  const allStaffMap=new Map();
  [...employees,...(admins||[])].forEach(emp=>allStaffMap.set(emp.id,emp));
  // 承認対象の判定
  // ・一般スタッフ：担当店舗にいれば承認可
  // ・管理者同士：同じ店舗の管理者は互いに承認可（自分自身は不可）
  // ・オーナー：全員＋自分自身も承認可（上位者が存在しないため）
  // ・オーナーの勤怠：オーナーのみ承認可
  const targetStaff=[...allStaffMap.values()].filter(emp=>{
    const isSelf=emp.id===currentUser.id;
    if(isSelf)return currentUser.role==="superadmin";
    if(emp.role==="superadmin")return currentUser.role==="superadmin";
    return managedStores.includes(emp.store);
  });

  // 選択中スタッフのその月の全日付レコード
  const selEmp=targetStaff.find(x=>x.id===selEmpId);
  const getDaysInMonth=month=>{
    const [y,m]=month.split("-").map(Number);
    const days=[];
    const last=new Date(y,m,0).getDate();
    for(let d=1;d<=last;d++)days.push(`${month}-${String(d).padStart(2,"0")}`);
    return days;
  };
  const allDays=selEmp?getDaysInMonth(approvalMonth):[];
  const selRecs=selEmp?allDays.map(date=>{
    const r=records[selEmp.id]?.[date];
    return r?{...r,empName:selEmp.name,empStore:selEmp.store}:{empId:selEmp.id,date,empName:selEmp.name,empStore:selEmp.store,status:null,clockIn:"",clockOut:""};
  }):[];
  // 移動列：建設部門スタッフ、またはその月に移動時間の記録があれば表示
  const showTravel=needTravelCol(selEmp,selRecs);

  // 全スタッフの承認待ち件数
  const allPending=[];
  targetStaff.forEach(emp=>{
    Object.values(records[emp.id]||{}).forEach(r=>{
      if(r.date?.startsWith(approvalMonth)&&r.status==="submitted")allPending.push({...r,empName:emp.name});
    });
  });

  const mgrClosed=targetStaff.length>0&&targetStaff.every(emp=>isAdminClosed(emp.id,approvalMonth));
  // 一部のスタッフだけ締まっている（以前の1人ずつ送る方式で、一部の通信が失敗した等）ときの検知用
  const notClosedStaff=targetStaff.filter(emp=>!isAdminClosed(emp.id,approvalMonth));
  const partiallyClosed=targetStaff.length>0&&notClosedStaff.length>0&&notClosedStaff.length<targetStaff.length;

  const nameOfStaff=empId=>([...employees,...(admins||[])].find(x=>x.id===empId)||{}).name||"";
  const me=currentUser?.name||"";

  // 2026年9月（重さ対策）：操作履歴は保存と同じ通信で送る（以前は保存→履歴の2回通信していた）
  const approve=async(empId,date)=>{
    if(mgrClosed){showToast("月締め済みです。月締めを解除してから操作してください。","warning");return;}
    const rec=records[empId]?.[date];if(!rec)return;
    // 承認者と承認日時を残す。届いたことを確認してから知らせる
    const ok=await saveRecord({...rec,status:"approved",approvedBy:me,approvedAt:new Date().toISOString()},makeLog(me,"承認",nameOfStaff(empId),date,""));
    if(!ok){showToast(failMsg("承認できませんでした。通信環境を確認して、もう一度お試しください。"),"warning");return;}
    showToast("承認しました ✓");
  };
  // 差戻しは理由の入力が必須。まず理由を聞いてから実行する
  const [rejectTarget,setRejectTarget]=useState(null);
  const askReject=(empId,date)=>{
    if(mgrClosed){showToast("月締め済みです。月締めを解除してから差戻ししてください。","warning");return;}
    setRejectTarget({empId,date});
  };
  const doReject=async(reason)=>{
    const {empId,date}=rejectTarget;
    const existing=records[empId]?.[date];
    const emp=[...employees,...(admins||[])].find(x=>x.id===empId);
    const rec=existing||{empId,date,clockIn:"",clockOut:"",breaks:[],note:"",status:"draft",hourlyWage:emp?.hourlyWage??1000,store:emp?.store||""};
    const ok=await saveRecord({...rec,status:"rejected",
      rejectReason:reason, rejectBy:me, rejectAt:new Date().toISOString()},makeLog(me,"差戻し",nameOfStaff(empId),date,reason));
    setRejectTarget(null);
    if(!ok){showToast(failMsg("差し戻せませんでした。通信環境を確認して、もう一度お試しください。"),"warning");return;}
    showToast("差し戻しました","warning");
  };
  const approveAll=async()=>{
    if(mgrClosed){showToast("月締め済みです。月締めを解除してから操作してください。","warning");return;}
    if(!selEmp){showToast("スタッフを選択してください","warning");return;}
    const targets=selRecs.filter(r=>r.status==="submitted");
    if(targets.length===0){showToast("承認待ちのデータがありません","warning");return;}
    const at=new Date().toISOString();
    // 全件が届いたことを確認してから知らせる（1回の通信でまとめて送る。履歴も同じ通信で書く）
    const res=await saveRecords(targets.map(r=>({...r,status:"approved",approvedBy:me,approvedAt:at})),
      targets.map(r=>makeLog(me,"承認",selEmp.name,r.date,"一括承認")));
    if(!res.allOk){
      const reason=lastRefusal;lastRefusal=null;
      showToast(reason
        ?`${res.total}件のうち${res.ok}件だけ承認しました。残りは次の理由で承認できませんでした：${refusalText(reason)}`
        :`${res.total}件のうち${res.ok}件しか保存できませんでした。通信環境を確認して、もう一度お試しください。`,"warning");
      return;
    }
    showToast(`${selEmp.name}の${targets.length}件を承認しました`);
  };
  // 月締め・解除はオーナー限定（画面側の表示制御。GAS側でも役割・パスワードを照合する）
  const isOwner=currentUser.role==="superadmin";
  const [showOwnerPwModal,setShowOwnerPwModal]=useState(null); // "close" | "unclose" | null
  const [showCloseConfirm,setShowCloseConfirm]=useState(false);
  const [closing,setClosing]=useState(false);
  const doMgrClose=async(passHash)=>{
    if(allPending.length>0){
      showToast(`承認待ちが${allPending.length}件あります。すべて承認または差戻ししてから月締めしてください。`,"warning");
      setShowCloseConfirm(false);
      return;
    }
    // 差戻し中があれば締め不可
    const rejectedCount=targetStaff.reduce((n,emp)=>n+Object.values(records[emp.id]||{}).filter(r=>r.date?.startsWith(approvalMonth)&&r.status==="rejected").length,0);
    if(rejectedCount>0){
      showToast(`差戻し中が${rejectedCount}件あります。修正・承認後に月締めしてください。`,"warning");
      setShowCloseConfirm(false);
      return;
    }
    setClosing(true);
    // 全員ぶん、スプレッドシートに届いたことを確認してから完了とする（1回の通信でまとめて送る）
    const ok=await setAdminClosedMany(targetStaff.map(emp=>emp.id),approvalMonth,me,currentUser.id,passHash,
      makeLog(me,"月締め","（対象"+targetStaff.length+"名）",approvalMonth+"（月締め）",""));
    setClosing(false);
    setShowCloseConfirm(false);
    bumpRerender();
    if(!ok){
      showToast(failMsg("月締めができませんでした。パスワードが正しいか、通信環境を確認してもう一度お試しください。"),"warning");
      return;
    }
    showToast(approvalMonth+"分を月締めしました");
  };
  // 月締め解除：全スタッフのフラグを外してスタッフが修正できる状態に
  const [unclosing,setUnclosing]=useState(false);
  const doMgrUnclose=async(passHash)=>{
    setUnclosing(true);
    const ok=await unsetAdminClosedMany(targetStaff.map(emp=>emp.id),approvalMonth,currentUser.id,passHash,
      makeLog(me,"月締め解除","（対象"+targetStaff.length+"名）",approvalMonth+"（月締め）",""));
    setUnclosing(false);
    bumpRerender();
    if(!ok){
      showToast(failMsg("解除ができませんでした。パスワードが正しいか、通信環境を確認してもう一度お試しください。"),"warning");
      return;
    }
    showToast("全員の月締めを解除しました。スタッフは修正できます。","warning");
  };

  return e("div",null,
    // 差戻し理由の入力
    rejectTarget&&e(RejectModal,{
      empName:nameOfStaff(rejectTarget.empId),
      date:rejectTarget.date,
      onSubmit:doReject,
      onCancel:()=>setRejectTarget(null)
    }),
    // 月締め・解除の本人確認（オーナーのみ）
    showOwnerPwModal&&e(OwnerPasswordModal,{
      currentUser,
      actionLabel:showOwnerPwModal==="close"?"月締め":"月締め解除",
      onCancel:()=>setShowOwnerPwModal(null),
      onConfirm:async(passHash)=>{
        const action=showOwnerPwModal;
        setShowOwnerPwModal(null);
        if(action==="close")await doMgrClose(passHash);
        else await doMgrUnclose(passHash);
      }
    }),
    // 管理者月締めバナー（締める・解除するのはオーナーのみ。店長・管理者には状態だけ見せる）
    mgrClosed
      ?e("div",{style:{background:"#d1fae5",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}},
        e("span",{style:{fontSize:14,fontWeight:700,color:"#065f46"}},"🔒 "+approvalMonth+"分 月締め済み"),
        isOwner
          ?e("button",{className:"btn btn-outline",style:{fontSize:11,padding:"4px 12px"},disabled:unclosing,onClick:()=>setShowOwnerPwModal("unclose")},unclosing?"解除中…":"月締めを解除")
          :e("span",{style:{fontSize:11,color:"#065f46",fontWeight:600}},"解除はオーナーのみ行えます")
      )
      :showCloseConfirm
        ?e("div",{style:{background:"#fff3cd",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
          e("span",{style:{fontSize:13,fontWeight:700,color:"#1e3a5f"}},approvalMonth+"分を月締めしますか？スタッフは入力・訂正できなくなります。"),
          e("button",{className:"btn btn-success",style:{fontSize:12,padding:"6px 16px"},disabled:closing,onClick:()=>setShowOwnerPwModal("close")},closing?"送信中…":"はい・月締めする"),
          e("button",{className:"btn btn-outline",style:{fontSize:12,padding:"6px 16px"},disabled:closing,onClick:()=>setShowCloseConfirm(false)},"キャンセル")
        )
        :e("div",{style:{background:partiallyClosed?"#fff3cd":"#f8faff",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}},
          partiallyClosed
            // 一部だけ締まっている状態（本来は起きないが、以前の方式で通信の一部が失敗した場合など）を知らせる
            ?e("span",{style:{fontSize:12,color:"#92400e",fontWeight:700}},
              "⚠ "+approvalMonth+"分は一部のスタッフだけ月締めされています（未締め："+notClosedStaff.length+"名："+notClosedStaff.map(x=>x.name).join("・")+"）。"+(isOwner?"「月締め」を押すと全員分がそろいます。":"オーナーに月締めをご依頼ください。"))
            :e("span",{style:{fontSize:12,color:"#64748b"}},isOwner?"月末に全員の承認が完了したら月締めしてください":"月末に全員の承認が完了したら、オーナーが月締めを行います"),
          e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
            isOwner&&e("button",{className:"btn btn-primary",style:{fontSize:13},onClick:()=>setShowCloseConfirm(true)},"🔒 "+approvalMonth+"分を月締め"),
            // 一部だけ締まっているときは、いったん全員分を解除して整え直す道も用意する
            isOwner&&partiallyClosed&&e("button",{className:"btn btn-outline",style:{fontSize:12},disabled:unclosing,onClick:()=>setShowOwnerPwModal("unclose")},unclosing?"解除中…":"全員分の月締めを解除")
          )
        ),
    // ヘッダー
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}},
      e("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
        e("input",{type:"month",value:approvalMonth,onChange:ev=>{setApprovalMonth(ev.target.value);setSelEmpId(null);},className:"input-field",style:{width:"auto",fontSize:14,fontWeight:700,padding:"6px 12px",color:"#1e3a5f",border:"2px solid #1e3a5f",borderRadius:10}}),
        e("span",{style:{fontSize:13,color:"#64748b"}},"担当店舗: "+managedStores.join("・")),
        e("span",{style:{fontSize:12,background:"#fff3cd",color:"#856404",padding:"2px 10px",borderRadius:20,fontWeight:700}},"承認待ち: "+allPending.length+"件")
      )
    ),
      // スタッフ選択（店舗ごとに見出しを付けて並べる）
    e("div",{style:{marginBottom:16}},
      ...groupByStore(targetStaff).map(([store,list])=>e("div",{key:store,style:{marginBottom:12}},
        e("div",{style:{fontSize:11.5,fontWeight:700,color:"#64748b",background:"#f1f5f9",
          borderRadius:6,padding:"4px 10px",marginBottom:6,display:"inline-block"}},
          store+"（"+list.length+"名）"),
        e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
      list.map(emp=>{
        const empMonthRecs=Object.values(records[emp.id]||{}).filter(r=>r.date?.startsWith(approvalMonth));
        const pendingCount=empMonthRecs.filter(r=>r.status==="submitted").length;
        const rejectedCount=empMonthRecs.filter(r=>r.status==="rejected").length;
        const isEmpClosed=isAdminClosed(emp.id,approvalMonth);
        const hasRejected=empMonthRecs.some(r=>r.status==="rejected");
        return e("button",{key:emp.id,
          onClick:()=>setSelEmpId(selEmpId===emp.id?null:emp.id),
          style:{padding:"8px 14px",borderRadius:10,border:`2px solid ${selEmpId===emp.id?"#1e3a5f":"#e2e8f0"}`,background:selEmpId===emp.id?"#1e3a5f":"white",color:selEmpId===emp.id?"white":"#1e3a5f",cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:6}},
          emp.name,
          // 2026年9月：以前は差戻し中の記録があると「月締済」を出さない条件になっていたが、締まっているなら必ず出す
          isEmpClosed&&e("span",{style:{fontSize:10,background:"#065f46",color:"white",padding:"1px 5px",borderRadius:8}},"月締済"),
          pendingCount>0&&e("span",{style:{fontSize:10,background:"#fff3cd",color:"#856404",padding:"1px 5px",borderRadius:8}},pendingCount+"件"),
          rejectedCount>0&&e("span",{style:{fontSize:10,background:"#fee2e2",color:"#991b1b",padding:"1px 5px",borderRadius:8}},"差戻"+rejectedCount)
        );
      })
        )
      ))
    ),
    // 選択スタッフの日別一覧
    selEmp&&e("div",null,
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8,flexWrap:"wrap"}},
        e("div",{style:{fontWeight:700,fontSize:14,color:"#1e3a5f"}},selEmp.name+" の"+approvalMonth+"の勤怠"),
        selRecs.filter(r=>r.status==="submitted").length>0&&e("button",{className:"btn btn-success",style:{fontSize:12,padding:"6px 16px"},onClick:approveAll},"✓ 承認待ちを一括承認")
      ),
      e("div",{style:{overflowX:"auto"}},
      e("table",{className:"table",style:{fontSize:13}},
        e("thead",null,e("tr",null,["日付","店舗","出勤","退勤","休憩",...(showTravel?["移動"]:[]),"備考","実働","状態","操作"].map(h=>e("th",{key:h},h)))),
        e("tbody",null,...selRecs.map((r,i)=>{
          const calc=calcRecord({...r,hourlyWage:r.hourlyWage!=null?r.hourlyWage:(selEmp.hourlyWage??1000)});
          const hasData=r.clockIn||r.clockOut;
          const breakStr=rangeText(r.breaks);
          const travelStr=rangeText(r.travelTimes);
          return e("tr",{key:i,style:{background:r.status==="rejected"?"#fff1f2":!hasData&&r.status!=="rejected"?"#fafafa":undefined}},
            e("td",{style:{fontWeight:600}},r.date),
            e("td",{style:{fontSize:11,color:"#475569"}},hasData?(r.store||"—"):"—"),
            e("td",null,r.clockIn||"—"),
            e("td",null,r.clockOut||"—"),
            e("td",{style:{fontSize:11,color:"#64748b"}},breakStr),
            showTravel&&e("td",{style:{fontSize:11,color:"#0369a1"}},travelStr),
            e("td",{style:{fontSize:11,color:"#64748b",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},r.note||"—"),
            e("td",null,hasData?mHHMM(calc.workMinutes):"—"),
            e("td",null,r.status
              ?e("span",{className:`status-badge ${S_CLASS[r.status]}`},S_LABEL[r.status])
              :e("span",{style:{fontSize:11,color:"#94a3b8"}},"データなし")
            ),
            e("td",null,
              r.status==="approved"
                ?e("div",{style:{display:"flex",gap:6}},
                  e("span",{style:{color:"#059669",fontSize:12}},"✓ 承認済"),
                  !mgrClosed&&e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 10px"},onClick:()=>askReject(r.empId,r.date)},"差戻")
                )
                :r.status==="rejected"
                  ?e("div",{style:{display:"flex",gap:6}},
                    e("button",{className:"btn btn-warning",style:{fontSize:11,padding:"4px 10px"},onClick:async()=>{
                      const rec=records[r.empId]?.[r.date];
                      let ok;
                      if(!rec||(!rec.clockIn&&!rec.clockOut)){
                        // データなしで差戻したケース→レコードを削除してデータなしに戻す（GAS側も削除）
                        ok=await gasDeleteRecord(r.empId,r.date,makeLog(me,"差戻し取消",nameOfStaff(r.empId),r.date,""));
                        if(ok)markLocalRecWrite(r.empId,r.date);
                        if(ok)setRecords(prev=>{
                          const empRecs={...(prev[r.empId]||{})};
                          delete empRecs[r.date];
                          return {...prev,[r.empId]:empRecs};
                        });
                      } else {
                        // データありで差戻したケース→承認待ちに戻す（差戻し理由も消す）
                        ok=await saveRecord({...rec,status:"submitted",
                          rejectReason:undefined,rejectBy:undefined,rejectAt:undefined},makeLog(me,"差戻し取消",nameOfStaff(r.empId),r.date,""));
                      }
                      if(!ok){showToast(failMsg("取り消せませんでした。通信環境を確認して、もう一度お試しください。"),"warning");return;}
                      showToast("差戻を取り消しました");
                    }},"差戻取消")
                  )
                  :e("div",{style:{display:"flex",gap:6}},
                    hasData&&e("button",{className:"btn btn-success",style:{fontSize:11,padding:"4px 10px"},onClick:()=>approve(r.empId,r.date)},"承認"),
                    !mgrClosed&&e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 10px"},onClick:()=>askReject(r.empId,r.date)},"差戻")
                  )
            )
          );
        }))
      )
      )
    ),
    !selEmp&&e("p",{style:{textAlign:"center",color:"#94a3b8",padding:"32px"}},"上のスタッフ名を選択すると日別一覧が表示されます")
  );
}

// ===== RESET BUTTON =====
function ResetButton({date,onConfirm}){
  const [confirming,setConfirming]=useState(false);
  if(confirming)return e("div",{style:{display:"flex",alignItems:"center",gap:8,background:"#fee2e2",borderRadius:8,padding:"8px 12px"}},
    e("span",{style:{fontSize:12,color:"#991b1b",fontWeight:600}},date+"のデータをリセットしますか？"),
    e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 12px"},onClick:()=>{onConfirm();setConfirming(false);}},"はい"),
    e("button",{className:"btn btn-outline",style:{fontSize:11,padding:"4px 12px"},onClick:()=>setConfirming(false)},"いいえ")
  );
  return e("button",{className:"btn btn-danger",style:{fontSize:13,padding:"7px 16px"},onClick:()=>setConfirming(true)},"リセット");
}
// ===== EMPLOYEE VIEW (共通：一般・管理者両方) =====
function EmployeeView({currentUser,setCurrentUser,onBack,records,setRecords,getRecord,saveRecord,saveRecords,submitRecord,submitting,selectedMonth,setSelectedMonth,getMonthlySummary,showToast,employees,setEmployees,admins,setAdmins,queueStaffOp,setView,ensureMonthLoaded}){
  const isAdmin=currentUser.role==="admin"||currentUser.role==="superadmin";
  const canSeePay=currentUser.role==="admin"||currentUser.role==="superadmin";
  const isBi=currentUser.bilingual===true||BILINGUAL_IDS.includes(currentUser.id);
  const [editDate,setEditDate]=useState(todayStr);
  // 「今日」の日付（2026年9月・総点検）：以前はページを開いた時点の日付を使い続けていたため、
  // 日付をまたいで開きっぱなしにすると翌日の入力ができなかった（更新ボタンを押すまで）。1分ごとに見直す
  const [todayNow,setTodayNow]=useState(()=>formatDate(new Date()));
  useEffect(()=>{
    const t=setInterval(()=>{const now=formatDate(new Date());setTodayNow(prev=>prev===now?prev:now);},60*1000);
    return()=>clearInterval(t);
  },[]);
  const [form,setForm]=useState({clockIn:"",clockOut:"",breaks:[{start:"",end:""}],travelTimes:[{start:"",end:""}],note:""});
  const [activeTab,setActiveTab]=useState("today");
  const [showPinChange,setShowPinChange]=useState(currentUser.passHash==null);
  // オーナーが別の端末でパスワードをリセットした場合（読み込みで passHash が null になる）も変更を求める
  useEffect(()=>{ if(currentUser.passHash==null)setShowPinChange(true); },[currentUser.passHash]);
  const [showHelp,setShowHelp]=useState(false);
  const [selectedStore,setSelectedStore]=useState(currentUser.store||"");
  const allStores=ALL_STORES; // 部署に関係なく全店舗から選択可能（他店舗ヘルプ勤務に対応）
  // 建設部門スタッフ、またはその日の対象店舗がモノレールなら移動時間を入力可能
  const isConstruction=isMonorailWork(currentUser.id,currentUser.store)||selectedStore==="モノレール";
  // 承認済みの日のみ対象店舗を変更不可（承認待ち・差戻し中は修正できる）
  const storeLocked=(records[currentUser.id]?.[editDate]||{}).status==="approved";
  // 同日に別店舗の出勤がある場合の入力欄
  const [showSubStore,setShowSubStore]=useState(false);
  const [subFrom,setSubFrom]=useState("");
  const [subTo,setSubTo]=useState("");
  const [subStore,setSubStore]=useState(currentUser.store||ALL_STORES[0]);

  const savePassToList=(hash)=>{
    const upd={...currentUser,passHash:hash};
    const inAdmins=(admins||[]).some(x=>x.id===currentUser.id);
    if(inAdmins)setAdmins(prev=>prev.map(x=>x.id===currentUser.id?upd:x));
    else setEmployees(prev=>prev.map(x=>x.id===currentUser.id?upd:x));
    queueStaffOp({action:"upsert",type:inAdmins?"admins":"employees",staff:upd});
    setCurrentUser(upd);showToast("パスワードを変更しました");
  };

  const rec=getRecord(currentUser.id,editDate);
  const monthOfEdit=editDate.substring(0,7);
  const monthClosed=isAdminClosed(currentUser.id,monthOfEdit);
  // 提出済み・到達済み（synced!==false）は、差戻しを経ないと編集できない
  // （Q1対策：管理者が確認中の内容が、本人の操作で書き換わらないようにする。
  //   まだスプレッドシートに届いていない＝synced:falseのときは、再送信のため引き続き編集可）
  const canEdit=rec.status!=="approved"&&!monthClosed&&(rec.status!=="submitted"||rec.synced===false);
  // 入力内容が保存済みの記録と異なるか（＝未保存の変更があるか）
  const hasUnsaved=(()=>{
    if(!canEdit)return false;
    const vb=a=>(a||[]).filter(x=>x.start&&x.end);
    const same=(rec.clockIn||"")===(form.clockIn||"")&&
      (rec.clockOut||"")===(form.clockOut||"")&&
      (rec.note||"")===(form.note||"")&&
      (rec.store||currentUser.store||"")===selectedStore&&
      JSON.stringify(vb(rec.breaks))===JSON.stringify(vb(form.breaks))&&
      JSON.stringify(vb(rec.travelTimes))===JSON.stringify(vb(form.travelTimes));
    return !same;
  })();
  // ナビゲーションバーの「🔄 最新の状態に更新」ボタンから見えるように、未保存の入力があるかどうかを
  // モジュール変数に反映しておく（画面を離れたら必ずfalseに戻す）
  useEffect(()=>{
    hasUnsavedEntryFlag=hasUnsaved;
    return ()=>{hasUnsavedEntryFlag=false;};
  },[hasUnsaved]);
  // 対象日を切り替えたとき、その日の記録を入力欄に読み込む。
  // ※以前はrecords（全員分の勤怠データ全体）が変わるたびに毎回ここで入力欄をリセットしていたが、
  //   「最新の情報に更新」ボタンやタブ復帰時の自動更新でrecordsが更新されるたびに、
  //   今まさに入力中（未提出）の内容まで消えてしまう不具合があったため、
  //   「日付を切り替えたとき」と「まだ何も入力していないとき」だけ読み込み直す方式に変更した。
  //   （入力中に裏側のデータが更新されても、提出するまでは自分の入力が優先される）
  // 2026年9月（追加修正⑥）：上の判定（hasUnsaved＝入力欄と保存済みの記録が違う）だけでは、
  // 「本人が入力した」のか「別の端末でリセット・差戻し等があり、記録の方が変わった」のかを区別できず、
  // 後者でも「入力中」と誤判定して、消えたはずの古い時刻が入力欄に残り続けていた。
  // そこで「入力欄に読み込んだ時点（＝本人がまだ手を加えていない状態）の内容」を覚えておき、
  // 本人が手を加えたときだけ、読み込み直しを止めるようにした。
  const formSnap=(f,store)=>JSON.stringify([f.clockIn||"",f.clockOut||"",f.note||"",store||"",
    (f.breaks||[]).filter(x=>x.start&&x.end),(f.travelTimes||[]).filter(x=>x.start&&x.end)]);
  const formBaseRef=useRef(null);
  // 入力欄が保存済みの記録と一致している間は、その内容を「手を加えていない状態」として覚え直す
  useEffect(()=>{ if(!hasUnsaved)formBaseRef.current=formSnap(form,selectedStore); });
  // 日付欄で古い月の日を選んだら、その月の勤怠を追加で読む
  useEffect(()=>{ if(ensureMonthLoaded)ensureMonthLoaded(String(editDate).substring(0,7)); },[editDate]);
  const prevEditDateRef=useRef(editDate);
  useEffect(()=>{
    const dateChanged=editDate!==prevEditDateRef.current;
    prevEditDateRef.current=editDate;
    const userEdited=formBaseRef.current!=null&&formSnap(form,selectedStore)!==formBaseRef.current;
    // 本人が入力中で、まだ提出できる状態なら、入力内容を優先して読み込み直さない
    if(!dateChanged&&userEdited&&canEdit)return;
    const r=getRecord(currentUser.id,editDate);
    const eb=r.breaks&&r.breaks.length?r.breaks:[{start:"",end:""}];
    const et=r.travelTimes&&r.travelTimes.length?r.travelTimes:[{start:"",end:""}];
    setForm({clockIn:r.clockIn||"",clockOut:r.clockOut||"",breaks:eb,travelTimes:et,note:r.note||""});
    // その日に記録された店舗を復元（未記録の日は自分の所属店舗）
    setSelectedStore(r.store||currentUser.store||"");
    // 別店舗入力欄は日付を変えたら閉じる
    // 別店舗の記録が備考にある日は、チェックを入れた状態で開く
    const hasSub=(r.note||"").split(" / ").some(s=>/^\d{1,2}:\d{2}-\d{1,2}:\d{2}\s+\S/.test(s.trim()));
    setShowSubStore(hasSub);setSubFrom("");setSubTo("");
  },[editDate,records]);
  // 未保存の入力があるまま日付を移動しようとしたら確認する
  const changeDate=(next)=>{
    if(!next||next===editDate)return;
    if(hasUnsaved&&!window.confirm(
      "入力中の内容が提出されていません。日付を変更すると入力内容が消えます。よろしいですか？"))return;
    setEditDate(next);
  };
  const summary=getMonthlySummary(currentUser.id);
  // calcはeditDateと選択中店舗を使って安全に計算（モノレール選択時は移動控除もプレビューに反映）
  const calc=editDate?calcRecord({...rec,...form,date:editDate,store:selectedStore,hourlyWage:currentUser.hourlyWage}):{workMinutes:0,overtimeMinutes:0,lateNightMinutes:0,pay:0};

  const doSave=(submit=true)=>{
    if(monthClosed){showToast("月締め済みのため入力できません","warning");return;}
    if(!form.clockIn||!form.clockOut){showToast("出勤・退勤時刻を入力してください","warning");return;}
    // 休憩・移動が勤務時間外チェック（日またぎ対応：isRangeWithinShiftで統一）
    const sameTime=arr=>(arr||[]).filter(b=>b.start&&b.end&&b.start===b.end);
    if(sameTime(form.breaks).length>0){showToast("休憩の開始と終了が同じ時刻です。修正してください。","warning");return;}
    if(isConstruction&&sameTime(form.travelTimes).length>0){showToast("移動時間の開始と終了が同じ時刻です。修正してください。","warning");return;}
    const outOfRange=arr=>(arr||[]).filter(b=>b.start&&b.end&&!isRangeWithinShift(form.clockIn,form.clockOut,b.start,b.end));
    if(outOfRange(form.breaks).length>0){showToast("勤務時間外の休憩があります。修正してください。","warning");return;}
    if(isConstruction&&outOfRange(form.travelTimes).length>0){showToast("勤務時間外の移動時間があります。修正してください。","warning");return;}
    if(rec.status==="approved"){showToast("承認済みのため訂正できません","warning");return;}
    // 提出済み・到達済み（管理者の確認待ち）は、差戻しを経ないと直せない
    // （Q1対策。ボタン自体も非表示にしているが、ここでも二重に防いでおく）
    if(rec.status==="submitted"&&rec.synced!==false){showToast("管理者の確認待ちです。内容を直したい場合は管理者に差し戻しを依頼してください","warning");return;}
    const r={...rec,...form,empId:currentUser.id,date:editDate,hourlyWage:currentUser.hourlyWage,
      // 承認済みの日は保存時も元の店舗を維持する
      store:storeLocked?(rec.store||selectedStore):selectedStore,status:"submitted",
      // 再提出したら、前の差戻し理由と承認者は消す
      rejectReason:undefined, rejectBy:undefined, rejectAt:undefined,
      approvedBy:undefined, approvedAt:undefined};
    submitRecord(r);
  };

  // 入力時刻が出勤〜退勤の範囲内か判定（日またぎ対応）
  const isWithinShiftFor=(ci,co,timeStr)=>{
    if(!ci||!co||!timeStr)return true;
    const inMin=parseInt(ci.slice(0,2))*60+parseInt(ci.slice(3));
    let outMin=parseInt(co.slice(0,2))*60+parseInt(co.slice(3));
    let tMin=parseInt(timeStr.slice(0,2))*60+parseInt(timeStr.slice(3));
    if(outMin<=inMin)outMin+=1440;
    let tAdjusted=tMin;
    if(tMin<inMin)tAdjusted=tMin+1440;
    return tAdjusted>=inMin&&tAdjusted<=outMin;
  };
  const isWithinShift=(timeStr)=>isWithinShiftFor(form.clockIn,form.clockOut,timeStr);
  // 休憩・移動の「区間」が出勤〜退勤の範囲内か判定（日またぎ対応・分ベース）
  // ※calcRecordのtoRangesと同じ正規化を行い、判定と計算のズレを防ぐ
  const isRangeWithinShift=(ci,co,start,end)=>{
    if(!ci||!co||!start||!end)return true;
    const inMin=parseInt(ci.slice(0,2))*60+parseInt(ci.slice(3));
    let outMin=parseInt(co.slice(0,2))*60+parseInt(co.slice(3));
    if(outMin<=inMin)outMin+=1440;
    let s=parseInt(start.slice(0,2))*60+parseInt(start.slice(3));
    let en=parseInt(end.slice(0,2))*60+parseInt(end.slice(3));
    if(s===en)return true;             // 同時刻＝0分として無視されるため範囲判定は通す
    if(s<inMin)s+=1440;
    if(en<inMin)en+=1440;
    if(en<=s)en+=1440;
    return s>=inMin&&en<=outMin;
  };
  // 出退勤変更時：既存の休憩・移動が範囲外ならエラー表示
  const checkExistingAfterClock=(ci,co)=>{
    if(!ci||!co)return;
    const bad=arr=>(arr||[]).filter(x=>{
      if(x.start&&x.end)return !isRangeWithinShift(ci,co,x.start,x.end);
      if(x.start)return !isWithinShiftFor(ci,co,x.start);
      if(x.end)return !isWithinShiftFor(ci,co,x.end);
      return false;
    });
    const outBreaks=bad(form.breaks);
    const outTravels=isConstruction?bad(form.travelTimes):[];
    if(outBreaks.length>0&&outTravels.length>0)showToast("休憩・移動時間が出勤〜退勤の範囲外です。修正してください","warning");
    else if(outBreaks.length>0)showToast("休憩時間が出勤〜退勤の範囲外です。修正してください","warning");
    else if(outTravels.length>0)showToast("移動時間が出勤〜退勤の範囲外です。修正してください","warning");
  };
  const doReset=async()=>{
    // 提出済み・到達済み（管理者の確認待ち）は、リセットも差戻しを経ないとできない
    // （Q1対策：再提出と同じ理由。ボタン自体も非表示にしているが、ここでも二重に防いでおく）
    if(rec.status==="submitted"&&rec.synced!==false){showToast("管理者の確認待ちです。内容を直したい場合は管理者に差し戻しを依頼してください","warning");return;}
    // 提出済み等でスプレッドシートに保存済みのものは、そちらも削除する。
    // 削除できたことを確認してから画面を消す（画面だけ消えて残るのを防ぐ）
    const existing=records[currentUser.id]?.[editDate];
    if(existing&&existing.status&&existing.status!=="draft"){
      const ok=await gasDeleteRecord(currentUser.id,editDate);
      if(!ok){showToast(failMsg("リセットできませんでした。通信環境を確認して、もう一度お試しください。"),"warning");return;}
    }
    markLocalRecWrite(currentUser.id,editDate);
    setRecords(prev=>{
      const empRecs={...(prev[currentUser.id]||{})};
      delete empRecs[editDate];
      return {...prev,[currentUser.id]:empRecs};
    });
    setForm({clockIn:"",clockOut:"",breaks:[{start:"",end:""}],travelTimes:[{start:"",end:""}],note:""});
    setSelectedStore(currentUser.store||"");
    showToast(editDate+"のデータをリセットしました");
  };
  // 差戻し中の日の知らせ。2026年9月（総点検）：以前は「今選んでいる月」の分しか出なかったため、
  // 月が替わってから先月分を差し戻されると本人が気づけなかった。月締め済みの月を除き、全期間を対象にする
  const rejectedDates=Object.values(records[currentUser.id]||{})
    .filter(r=>r.status==="rejected"&&r.date&&!isAdminClosed(currentUser.id,String(r.date).substring(0,7)))
