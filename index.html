<div id="root"></div>
<script>const {useState,useEffect,useRef,createElement:e} = React;

const INITIAL_EMPLOYEES = [];
const INITIAL_ADMINS = [];

const ALL_STORES = ["モノレール","土木","GOLF BAR KING","JP BAR KING","カリッジュ児島店","イベント出店","KOJIMA FOK COFFEE","KYOUEN","Qlotho by KING","営業"];

const storeOrder = s => { const i = ALL_STORES.indexOf(s); return i < 0 ? 999 : i; };

const sortByStore = list => [...list].sort((a,b)=>{
  const d = storeOrder(a.store) - storeOrder(b.store);
  return d !== 0 ? d : String(a.name).localeCompare(String(b.name), "ja");
});

const normEmpNo = v => (v == null || String(v).trim() === "" || !Number.isFinite(Number(v))) ? null : Number(v);

const sortByEmpNo = list => [...list].sort((a,b)=>{
  const na = normEmpNo(a.empNo), nb = normEmpNo(b.empNo);
  if (na != null && nb != null) return na - nb;
  if (na != null) return -1;
  if (nb != null) return 1;
  const d = storeOrder(a.store) - storeOrder(b.store);
  return d !== 0 ? d : String(a.name).localeCompare(String(b.name), "ja");
});

const groupByStore = list => {
  const sorted = sortByStore(list);
  const out = [];
  sorted.forEach(x => {
    const last = out[out.length - 1];
    if (last && last[0] === x.store) last[1].push(x);
    else out.push([x.store, [x]]);
  });
  return out;
};
const INACTIVE_STORES = ["架設中"];
const DEPARTMENT_STORES = {
  "建設部門":["モノレール","土木"],"飲食部門":["GOLF BAR KING","JP BAR KING","カリッジュ児島店","KOJIMA FOK COFFEE","KYOUEN","イベント出店"],
  "美容院部門":["Qlotho by KING"],"アパレル部門":["架設中"],"営業部門":["営業"],
};
const OVERTIME_THRESHOLD=8;
const INITIAL_PASSWORD="000000";
const PASSWORD_MIN=6;
const TODAY=new Date();
const formatDate=d=>{const dt=d instanceof Date?d:new Date(d);return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`};
const todayStr=formatDate(TODAY);

const S_LABEL={draft:"下書き",submitted:"承認待ち",approved:"承認済",rejected:"差戻し中"};
const S_LABEL_S={draft:"下書き",submitted:"承認待ち",approved:"承認済",rejected:"差戻し中"};
const S_CLASS={draft:"status-draft",submitted:"status-submitted",approved:"status-approved",rejected:"status-rejected"};

const T_LABEL={days:"労働日数",work:"実労働時間",normal:"所定労働時間",otOnly:"時間外労働",lnOnly:"深夜労働",lnOt:"時間外深夜労働"};
const T_LABEL_EN={days:"Work Days",work:"Total Hours",normal:"Scheduled Hours",otOnly:"Overtime",lnOnly:"Late Night",lnOt:"Late Night Overtime"};

const T_COL={work:"実労働\n時間",normal:"所定\n労働時間",otOnly:"時間外\n労働",lnOnly:"深夜\n労働",lnOt:"時間外\n深夜労働"};

const APPROVED_NOTE="※ 承認済みのデータのみ集計";

function colHead(label){
  const parts=String(label).split("\n");
  if(parts.length===1)return label;
  const out=[];
  parts.forEach((t,i)=>{ if(i>0)out.push(e("br",{key:"br"+i})); out.push(t); });
  return out;
}

function sumLine(label,value,opts){
  const o=opts||{};
  return e("div",{key:label,style:{fontWeight:o.weight||600,marginTop:o.marginTop||0,whiteSpace:"nowrap"}},
    e("span",{style:{display:"inline-block",minWidth:o.labelWidth||"8.5em"}},label),
    value
  );
}
const DOW=["日","月","火","水","木","金","土"];

function shortDateLabel(dateStr){
  const parts=String(dateStr||"").split("-").map(Number);
  if(parts.length!==3||parts.some(isNaN))return dateStr||"";
  const[y,mo,d]=parts;
  const dowIdx=new Date(y,mo-1,d).getDay();
  return `${mo}/${d}(${DOW[dowIdx]})`;
}

const BILINGUAL_IDS=[13,14];

function L(ja,en,isBi){return isBi?`${ja} / ${en}`:ja;}

function LB(ja,en,isBi){return isBi?[ja,e("br",{key:"br"}),e("span",{key:"en",style:{fontSize:"0.85em",fontWeight:500}},en)]:ja;}
function loadLS(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb}catch{return fb}}
function saveLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

function saveRecordsLS(recs){
  try{localStorage.setItem("kintai_records",JSON.stringify(recs));return;}catch{}
  try{
    const d=new Date();d.setMonth(d.getMonth()-2);
    const from=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
    const trimmed={};
    Object.keys(recs||{}).forEach(id=>{
      Object.entries(recs[id]||{}).forEach(([date,r])=>{
        if(String(date)>=from||(r&&r.synced===false)){(trimmed[id]=trimmed[id]||{})[date]=r;}
      });
    });
    localStorage.setItem("kintai_records",JSON.stringify(trimmed));
  }catch{}
}

async function sha256(str){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){

    let h=5381;for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))>>>0;}
    return "fb_"+h.toString(16)+"_"+str.length;
  }
}

async function verifyPassword(emp,input){
  if(!emp)return false;
  if(emp.passHash==null)return input===INITIAL_PASSWORD;
  return (await sha256(input))===emp.passHash;
}

function migrateAuth(list,initialList){
  return (list||[]).map(emp=>{
    const init=(initialList||[]).find(x=>x.id===emp.id);

    const pNow=(Array.isArray(emp.payHist)&&emp.payHist.length)?payAt(emp,monthKeyOf(new Date())):null;
    const isMonthly=pNow?pNow.type==="monthly":emp.payType==="monthly";
    if(pNow)emp={...emp,payType:isMonthly?"monthly":undefined,hourlyWage:pNow.hourlyWage,monthlyWage:pNow.monthlyWage};
    return {...emp,

      role:emp.role==="subadmin"?"admin":emp.role,

      hourlyWage:isMonthly?undefined:emp.hourlyWage,
      monthlyWage:isMonthly?emp.monthlyWage:undefined,
      loginId:emp.loginId||init?.loginId||("user"+emp.id+"@tribe.jp"),
      passHash:emp.passHash!==undefined?emp.passHash:null};
  });
}

const GAS_URL="https://script.google.com/macros/s/AKfycbz_YZdXZ20_PIUR6hofmuJLCLX2gh-CIug7wNC3HRKHT835QpzVx70nPJHZTgb_vowh/exec";

const GAS_TIMEOUT_MS=20000;
const GAS_RETRY=2;

async function fetchWithTimeout(url,opts={},ms=GAS_TIMEOUT_MS){
  if(typeof AbortController==="undefined")return fetch(url,opts);
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),ms);
  try{
    return await fetch(url,{...opts,signal:ctrl.signal});
  }finally{
    clearTimeout(timer);
  }
}

const commLog=[];
function recordComm(label,totalMs,r,tries){
  commLog.unshift({at:new Date(),label,totalMs,serverMs:(r&&typeof r.ms==="number")?r.ms:null,
    ok:!!(r&&r.success!==false),refused:!!(r&&r.refused),tries});
  if(commLog.length>30)commLog.length=30;
}

async function withRetry(fn,label){
  let last=null;
  const t0=Date.now();
  for(let i=0;i<=GAS_RETRY;i++){
    try{
      const r=await fn();
      if(r&&r.success!==false){recordComm(label,Date.now()-t0,r,i+1);return r;}

      if(r&&r.refused){recordComm(label,Date.now()-t0,r,i+1);return r;}

      if(r&&/不明なaction|データが不正/.test(String(r.error||""))){recordComm(label,Date.now()-t0,r,i+1);return r;}
      last=r;
    }catch(e){
      last={success:false,error:e.name==="AbortError"?"応答がありません（時間切れ）":e.message};
    }
    if(i<GAS_RETRY)await new Promise(res=>setTimeout(res,600*(i+1)));
  }
  console.error("GAS "+label+" 失敗:",last);
  recordComm(label,Date.now()-t0,last,GAS_RETRY+1);
  return last||{success:false,error:"通信に失敗しました"};
}

async function gasGet(action,params={}){
  return withRetry(async()=>{
    const q=new URLSearchParams({action,...params,_ts:Date.now()+"_"+Math.random().toString(36).slice(2)}).toString();
    const res=await fetchWithTimeout(`${GAS_URL}?${q}`,{cache:"no-store"});
    return await res.json();
  },"GET "+action);
}
async function gasPost(action,data={}){
  return withRetry(async()=>{
    const res=await fetchWithTimeout(GAS_URL,{method:"POST",body:JSON.stringify({action,...data}),cache:"no-store"});
    return await res.json();
  },"POST "+action);
}

const RECORD_WINDOW_MONTHS=3;
function monthKeyOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;}
function addMonths(month,n){const [y,m]=month.split("-").map(Number);const d=new Date(y,m-1+n,1);return monthKeyOf(d);}
function baseWindow(){const to=monthKeyOf(new Date());return {from:addMonths(to,-(RECORD_WINDOW_MONTHS-1)),to};}

const extraMonths=new Set();
function inLoadedRange(month){const w=baseWindow();return (month>=w.from&&month<=w.to)||extraMonths.has(month);}

const localRecWrites=new Map();
function markLocalRecWrite(empId,date,pending){localRecWrites.set(`${empId}_${date}`,{at:Date.now(),pending:!!pending});}

function settleLocalRecWrite(empId,date){const k=`${empId}_${date}`;const w=localRecWrites.get(k);localRecWrites.set(k,{at:w?w.at:0,pending:false});}
function isLocalRecWriteFresh(empId,date,since){const w=localRecWrites.get(`${empId}_${date}`);return !!w&&(w.pending||w.at>=since);}

let lastRefusal=null;

let onRefusalReload=null;
function refusalText(r){

  return String(r).replace(/（画面を最新の状態に更新してください）/g,"")+"（画面を最新の状態に読み込み直します）";
}
function failMsg(defaultMsg){
  const r=lastRefusal;lastRefusal=null;
  return r?refusalText(r):defaultMsg;
}

function gasDeleteRecord(empId,date,log){
  return gasPost("deleteRecord",{empId,date,log})
    .then(r=>{
      if(r&&r.refused){lastRefusal=r.error||null;if(onRefusalReload)onRefusalReload();return false;}
      const ok=!!(r&&r.success!==false);
      if(ok&&log)afterLogResult(r,log);
      return ok;
    })
    .catch(e=>{console.error("GAS削除エラー:",e);return false;});
}

let onLogFailed=null;

let hasUnsavedEntryFlag=false;
function makeLog(by,action,targetName,targetDate,note){
  return {at:new Date().toISOString(),by:by||"",action:action||"",targetName:targetName||"",targetDate:targetDate||"",note:note||""};
}

function afterLogResult(r,log){
  if(!r||r.logged===undefined){postLog(log);return;}
  if(r.logged===false&&onLogFailed)onLogFailed(log.action);
}
function postLog(log){
  return gasPost("addLog",{log}).then(r=>{
    const ok=!!(r&&r.success!==false);
    if(!ok&&onLogFailed)onLogFailed(log.action);
    return ok;
  }).catch(e=>{console.error("履歴の記録に失敗:",e);if(onLogFailed)onLogFailed(log.action);return false;});
}

const DATA_VERSION="v22";

localStorage.setItem("kintai_data_version",DATA_VERSION);

const closedSet=new Set();
function closeKey(empId,month){return `${empId}_${month}`;}
function getAdminCloseKey(empId,month){return `kintai_admin_closed_${empId}_${month}`;}

let closesLoadedFromServer=false;

const localCloseWrites=new Map();
function isAdminClosed(empId,month){
  if(closedSet.has(closeKey(empId,month)))return true;
  if(closesLoadedFromServer)return false;
  try{return localStorage.getItem(getAdminCloseKey(empId,month))==="1";}catch{return false;}
}

async function setAdminClosedMany(empIds,month,by,byId,passHash,log){
  return applyCloseMany(true,empIds,month,{by:by||"",byId,passHash,log});
}
async function unsetAdminClosedMany(empIds,month,byId,passHash,log){
  return applyCloseMany(false,empIds,month,{byId,passHash,log});
}
async function applyCloseMany(closed,empIds,month,body){
  const keys=empIds.map(id=>closeKey(id,month));
  const before=keys.map(k=>closedSet.has(k));
  keys.forEach(k=>{ if(closed)closedSet.add(k); else closedSet.delete(k); localCloseWrites.set(k,{closed,at:Date.now(),pending:true}); });
  let ok=false,r=null;
  try{
    r=await gasPost(closed?"setCloseBatch":"unsetCloseBatch",{empIds,month,...body});
    if(r&&r.success===false&&!r.refused&&/不明なaction/.test(String(r.error||""))){

      const rs=await Promise.all(empIds.map(id=>gasPost(closed?"setClose":"unsetClose",closed?{empId:id,month,by:body.by,byId:body.byId,passHash:body.passHash}:{empId:id,month,byId:body.byId,passHash:body.passHash}).then(x=>!!(x&&x.success!==false)).catch(()=>false)));
      ok=rs.every(Boolean);
      if(ok&&body.log)postLog(body.log);
    }else{
      ok=!!(r&&r.success!==false);

      if(r&&r.refused){lastRefusal=r.error||null;if(onRefusalReload)onRefusalReload();}
      if(ok&&body.log)afterLogResult(r,body.log);
    }
  }catch(e){ok=false;}
  keys.forEach((k,i)=>{
    if(ok){const w=localCloseWrites.get(k);localCloseWrites.set(k,{closed,at:w?w.at:0,pending:false});try{ if(closed)localStorage.setItem("kintai_admin_closed_"+k,"1"); else localStorage.removeItem("kintai_admin_closed_"+k); }catch{}}
    else{ if(before[i])closedSet.add(k); else closedSet.delete(k); localCloseWrites.delete(k); }
  });
  return ok;
}

function applyClosesFromServer(list,loadStartedAt){
  const next=new Set();
  (list||[]).forEach(c=>{ if(c&&c.empId!=null&&c.month)next.add(closeKey(c.empId,c.month)); });
  localCloseWrites.forEach((w,k)=>{ if(w.pending||w.at>=(loadStartedAt||0)){ if(w.closed)next.add(k); else next.delete(k); } });
  closedSet.clear();
  next.forEach(k=>closedSet.add(k));
  closesLoadedFromServer=true;

  try{
    const old=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf("kintai_admin_closed_")===0)old.push(k);}
    old.forEach(k=>localStorage.removeItem(k));
    closedSet.forEach(k=>localStorage.setItem("kintai_admin_closed_"+k,"1"));
  }catch{}
}

function toMin(t){
  if(!t||typeof t!=="string")return null;
  const m=t.match(/^(\d{1,2}):(\d{2})/);
  if(!m)return null;
  return parseInt(m[1],10)*60+parseInt(m[2],10);
}

function mergeRanges(ranges){
  if(ranges.length===0)return[];
  const sorted=[...ranges].sort((a,b)=>a[0]-b[0]);
  const out=[sorted[0].slice()];
  for(let i=1;i<sorted.length;i++){
    const cur=sorted[i],last=out[out.length-1];
    if(cur[0]<=last[1])last[1]=Math.max(last[1],cur[1]);
    else out.push(cur.slice());
  }
  return out;
}

const overlapMin=(a1,a2,b1,b2)=>Math.max(0,Math.min(a2,b2)-Math.max(a1,b1));

const UNIT_ROUND_START="2026-11";

function unitPrice(wage,rate){const v=Math.round((Number(wage)||0)*rate*1000)/1000;return Math.floor(v+0.5);}
function calcRecord(rec){

  const ZERO={workMinutes:0,overtimeMinutes:0,lateNightMinutes:0,pay:0,
    normalMinutes:0,normalPay:0,otOnlyMinutes:0,otOnlyPay:0,
    lnOnlyMinutes:0,lnOnlyPay:0,lnOtMinutes:0,lnOtPay:0,
    normalPayRaw:0,otOnlyPayRaw:0,lnOnlyPayRaw:0,lnOtPayRaw:0};

  if(rec&&rec.segs&&rec.segs.length)rec=flattenSegs(rec);
  if(!rec||!rec.clockIn||!rec.clockOut)return ZERO;
  const inMin=toMin(rec.clockIn);
  let outMin=toMin(rec.clockOut);
  if(inMin==null||outMin==null)return ZERO;

  if(outMin===inMin)return ZERO;

  if(outMin<inMin)outMin+=1440;
  const total=Math.min(outMin-inMin,24*60);
  const shiftEnd=inMin+total;

  const toRanges=arr=>{
    const out=[];
    (arr||[]).forEach(x=>{
      if(!x||!x.start||!x.end)return;
      let s=toMin(x.start),en=toMin(x.end);
      if(s==null||en==null)return;
      if(s===en)return;

      if(s<inMin)s+=1440;
      if(en<inMin)en+=1440;
      if(en<=s)en+=1440;

      const cs=Math.max(s,inMin),ce=Math.min(en,shiftEnd);
      if(ce>cs)out.push([cs,ce]);
    });
    return mergeRanges(out);
  };

  const breakRanges=toRanges(rec.breaks);

  const isMonorail=isMonorailWork(rec.empId,rec.store);
  const deductRanges=mergeRanges([...breakRanges,...toRanges(isMonorail?rec.travelTimes:[])]);
  let dm=deductRanges.reduce((n,[s,e2])=>n+(e2-s),0);

  if(dm===0&&rec.breakMinutes)dm=Math.max(0,Number(rec.breakMinutes)||0);

  const wm=Math.max(0,total-dm);
  const om=Math.max(0,wm-OVERTIME_THRESHOLD*60);

  let lnWork=0,lnDeduct=0;
  for(let k=-1;k<=1;k++){
    const ns=1320+1440*k, ne=1740+1440*k;
    lnWork+=overlapMin(inMin,shiftEnd,ns,ne);
    deductRanges.forEach(([s,e2])=>{lnDeduct+=overlapMin(s,e2,ns,ne);});
  }
  const ln=Math.min(wm,Math.max(0,lnWork-lnDeduct));

  const lnOt=Math.min(ln,om),lnOnly=ln-lnOt,otOnly=om-lnOt,normal=wm-om-lnOnly;
  const wage=Math.max(0,rec.hourlyWage!=null?Number(rec.hourlyWage)||0:1000),pm=wage/60;

  const normalPayRaw=normal*pm, otOnlyPayRaw=otOnly*pm*1.25, lnOnlyPayRaw=lnOnly*pm*1.25, lnOtPayRaw=lnOt*pm*1.5;

  const pay=Math.round(normalPayRaw+otOnlyPayRaw+lnOnlyPayRaw+lnOtPayRaw);
  const normalPay=Math.round(normalPayRaw);
  const otOnlyPay=Math.round(otOnlyPayRaw);
  const lnOnlyPay=Math.round(lnOnlyPayRaw);
  const lnOtPay=Math.round(lnOtPayRaw);
  const fin=x=>Number.isFinite(x)?x:0;
  return{workMinutes:Math.round(wm),overtimeMinutes:Math.round(om),lateNightMinutes:Math.round(ln),
    pay:fin(pay),
    normalMinutes:Math.round(normal),normalPay:fin(normalPay),
    otOnlyMinutes:Math.round(otOnly),otOnlyPay:fin(otOnlyPay),
    lnOnlyMinutes:Math.round(lnOnly),lnOnlyPay:fin(lnOnlyPay),
    lnOtMinutes:Math.round(lnOt),lnOtPay:fin(lnOtPay),
    normalPayRaw:fin(normalPayRaw),otOnlyPayRaw:fin(otOnlyPayRaw),lnOnlyPayRaw:fin(lnOnlyPayRaw),lnOtPayRaw:fin(lnOtPayRaw)};
}

const normCommuteDaily=v=>{const n=Number(v);return (v==null||String(v).trim()===""||!Number.isFinite(n)||n<0)?null:Math.round(n);};

const COMMUTE_START="2026-10";

const MAX_SEGS=3;
function isMultiSeg(rec){return !!(rec&&Array.isArray(rec.segs)&&rec.segs.length>0);}

function recSegs(rec){

    breaks:validRanges(s&&s.breaks),travelTimes:validRanges(s&&s.travelTimes),note:String((s&&s.note)||""),

function segsDayStatus(segs){

function fmtMin(m){const x=((m%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");}

function segTooLong(p){return p.length>1&&(p[p.length-1].e-p[0].s)>=1440;}

  const parts=[];let prevEnd=null;
  segs.forEach(s=>{
    let si=toMin(s.clockIn),so=toMin(s.clockOut);
    if(si==null||so==null||si===so)return;
    if(prevEnd==null)prevEnd=si;
    while(si<prevEnd)si+=1440;
    while(so<=si)so+=1440;
    parts.push({s:si,e:so,seg:s});prevEnd=so;
  });
  return parts;
}

function withDayFields(rec,segsIn){
  const segs=normSegs(segsIn||rec.segs);
  if(!segs)return rec;
  const parts=segParts(segs);
  const breaks=[],travels=[],notes=[],approvers=[],reasons=[];
  segs.forEach(s=>{
    breaks.push(...s.breaks);travels.push(...s.travelTimes);
    if(s.note)notes.push(segs.length>1?s.store+": "+s.note:s.note);
    if(s.status==="approved"&&s.approvedBy&&!approvers.includes(s.approvedBy))approvers.push(s.approvedBy);
    if(s.status==="rejected"&&s.rejectReason)reasons.push(segs.length>1?s.store+": "+s.rejectReason:s.rejectReason);
  });
  for(let j=1;j<parts.length;j++){ if(parts[j].s>parts[j-1].e)breaks.push({start:fmtMin(parts[j-1].e),end:fmtMin(parts[j].s)}); }

    breaks,travelTimes:travels,note:notes.join(" / "),status:segsDayStatus(segs),
    approvedBy:approvers.join("・")||undefined,approvedAt:segs.find(s=>s.approvedAt)?.approvedAt,

function flattenSegs(rec){
  const segs=normSegs(rec.segs);

  const parts=segParts(segs);
  if(!parts.length)return {...rec,segs:undefined,store:segs[0].store,clockIn:"",clockOut:"",breaks:[],travelTimes:[]};
  const base=parts[0].s,cap=base+1440,ranges=[];
  const addRange=(a,b)=>{ if(a>=cap)return; if(b>cap)b=cap; if(b<=a)return; ranges.push({start:fmtMin(a),end:fmtMin(b)}); };
  const addRel=(part,list)=>(list||[]).forEach(x=>{
    let a=toMin(x.start),b=toMin(x.end);
    if(a==null||b==null||a===b)return;
    while(a<part.s)a+=1440; while(b<=a)b+=1440;
    if(a<part.s)a=part.s; if(b>part.e)b=part.e;
    addRange(a,b);
  });
  parts.forEach((p,i)=>{
    addRel(p,p.seg.breaks);
    if(p.seg.store==="モノレール")addRel(p,p.seg.travelTimes);
    if(i>0&&p.s>parts[i-1].e)addRange(parts[i-1].e,p.s);
  });
  let end=parts[parts.length-1].e; if(end>cap)end=cap;
  return {...rec,segs:undefined,store:segs[0].store,clockIn:fmtMin(base),clockOut:fmtMin(end),breaks:ranges,travelTimes:[],breakMinutes:undefined};
}

function patchSeg(rec,idx,patch){
  if(!isMultiSeg(rec))return {...rec,...patch};
  const segs=rec.segs.map((s,i)=>i===idx?{...s,...patch}:s);
  return withDayFields(rec,segs);
}

function PasswordChangeModal({currentUser,onDone,onCancel,isForced}){
  const [p1,setP1]=useState("");
  const [p2,setP2]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState(null);
  const [busy,setBusy]=useState(false);
  const isBi=currentUser?.bilingual===true||BILINGUAL_IDS.includes(currentUser?.id);
  const submit=async()=>{
    if(busy)return;
    if(p1.length<PASSWORD_MIN){setErr(L("パスワードは"+PASSWORD_MIN+"文字以上にしてください","At least "+PASSWORD_MIN+" characters",isBi));return;}
    if(p1===INITIAL_PASSWORD){setErr(L("初期パスワードは使用できません","Initial password is not allowed",isBi));return;}
    if(p1!==p2){setErr(L("パスワードが一致しません。もう一度入力してください。","Passwords do not match.",isBi));setP2("");return;}
    setBusy(true);
    const h=await sha256(p1);

    try{await onDone(h);}finally{setBusy(false);}
  };
  const inputStyle={width:"100%",padding:"11px 14px",border:"1.5px solid #d1d5db",borderRadius:8,fontFamily:"inherit",fontSize:15,outline:"none"};
  return e("div",{style:{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",backdropFilter:"blur(8px)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,overflowY:"auto"}},
    e("div",{style:{background:"white",borderRadius:20,padding:28,width:360,maxWidth:"95vw",maxHeight:"100%",overflowY:"auto",margin:"auto"}},
      e("div",{style:{fontSize:32,marginBottom:8,textAlign:"center"}},"🔐"),
      e("h3",{style:{fontSize:16,fontWeight:700,color:"#1e3a5f",marginBottom:6,textAlign:"center"}},
        isForced?L("パスワードの設定が必要です","Password Setup Required",isBi):L("パスワード変更","Change Password",isBi)
      ),
      e("p",{style:{fontSize:12,color:"#64748b",marginBottom:16,textAlign:"center"}},
        isForced
          ?L("初期パスワードのままです。新しいパスワードを設定してください。","You are using the initial password. Please set a new one.",isBi)
          :L("新しいパスワードを設定してください。","Please set a new password.",isBi)
      ),
      e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},L("新しいパスワード（"+PASSWORD_MIN+"文字以上）","New Password ("+PASSWORD_MIN+"+ chars)",isBi)),
      e("input",{type:showPw?"text":"password",value:p1,onChange:ev=>{setP1(ev.target.value);setErr(null);},style:Object.assign({},inputStyle,{marginBottom:10}),autoComplete:"new-password"}),
      e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},L("もう一度入力","Confirm Password",isBi)),
      e("input",{type:showPw?"text":"password",value:p2,onChange:ev=>{setP2(ev.target.value);setErr(null);},onKeyDown:ev=>{if(ev.key==="Enter")submit();},style:Object.assign({},inputStyle,{marginBottom:8}),autoComplete:"new-password"}),
      e("label",{style:{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#64748b",marginBottom:10,cursor:"pointer"}},
        e("input",{type:"checkbox",checked:showPw,onChange:ev=>setShowPw(ev.target.checked)}),L("パスワードを表示","Show password",isBi)
      ),
      err&&e("p",{style:{color:"#dc2626",fontSize:12,fontWeight:700,marginBottom:10}},err),
      e("button",{className:"btn btn-primary",style:{width:"100%"},onClick:submit,disabled:busy},busy?L("設定中…","Saving…",isBi):L("この内容で設定する","Set Password",isBi)),
      e("button",{onClick:onCancel,style:{width:"100%",marginTop:10,fontSize:12,color:"#94a3b8",background:"none",border:"none",cursor:"pointer",textDecoration:"underline",fontFamily:"inherit"}},
        isForced?L("← TOPページに戻る","← Back to Top",isBi):L("← 戻る","← Back",isBi)
      )
    )
  );
}

function LoginScreen({employees,admins,onLogin,onAdminLogin,ready,loadFailed,onRetry,reloading}){
  const [loginId,setLoginId]=useState("");
  const [pw,setPw]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState(null);
  const [busy,setBusy]=useState(false);
  const doLogin=async()=>{
    if(busy)return;
    const idv=loginId.trim().toLowerCase();
    if(!idv||!pw){setErr("IDとパスワードを入力してください");return;}
    if(!ready){setErr(loadFailed?"従業員情報を読み込めていません。通信環境を確認して「再読み込み」を押してください。":"従業員情報を読み込んでいます。少し待ってから、もう一度押してください。");return;}
    setBusy(true);
    const all=[...employees,...(admins||[])];
    const emp=all.find(x=>String(x.loginId||"").toLowerCase()===idv);
    const ok=emp?await verifyPassword(emp,pw):false;
    setBusy(false);
    if(!ok){setErr("IDまたはパスワードが違います");setPw("");return;}

    if(isRetiredAt(emp,monthKeyOf(new Date()))){setErr("退職の手続きが済んでいるため、ログインできません。");setPw("");return;}
    if(emp.role==="admin"||emp.role==="superadmin")onAdminLogin(emp);
    else onLogin(emp);
  };
  return e("div",{style:{minHeight:"100vh",background:"#f0f2f5",display:"flex",flexDirection:"column"}},
    e("nav",{className:"nav"},
      e("div",{className:"nav-brand"},"⏱ 勤怠管理システム"),
      e(UpdateAppButton,null)
    ),
    e("div",{style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:24}},
      e("div",{style:{width:400,maxWidth:"100%",boxSizing:"border-box"}},
        e("div",{className:"card"},
          e("h2",{style:{fontSize:18,fontWeight:700,color:"#1e3a5f",marginBottom:4,textAlign:"center"}},"ログイン"),
          e("p",{style:{fontSize:12,color:"#94a3b8",marginBottom:20,textAlign:"center"}},"ログインIDとパスワードを入力してください"),
          e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},"ログインID"),
          e("input",{type:"email",value:loginId,onChange:ev=>{setLoginId(ev.target.value);setErr(null);},onKeyDown:ev=>{if(ev.key==="Enter")doLogin();},placeholder:"example@tribe.jp",autoComplete:"username",className:"input-field",style:{marginBottom:14}}),
          e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},"パスワード"),
          e("input",{type:showPw?"text":"password",value:pw,onChange:ev=>{setPw(ev.target.value);setErr(null);},onKeyDown:ev=>{if(ev.key==="Enter")doLogin();},autoComplete:"current-password",className:"input-field",style:{marginBottom:8}}),
          e("label",{style:{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#64748b",marginBottom:12,cursor:"pointer"}},
            e("input",{type:"checkbox",checked:showPw,onChange:ev=>setShowPw(ev.target.checked)}),"パスワードを表示"
          ),
          err&&e("p",{style:{color:"#dc2626",fontSize:12,fontWeight:700,marginBottom:12,textAlign:"center"}},err),
          e("button",{className:"btn btn-primary","data-testid":"login-btn",style:{width:"100%",padding:"12px",opacity:ready?1:.6},onClick:doLogin,disabled:busy||!ready},
            busy?"確認中…":ready?"ログイン":loadFailed?"従業員情報を読み込めていません":"従業員情報を読み込み中…"),
          !ready&&loadFailed&&e("button",{className:"btn btn-outline","data-testid":"login-retry",style:{width:"100%",padding:"10px",marginTop:8},disabled:reloading,onClick:onRetry},reloading?"読み込み中…":"再読み込み"),
          e("p",{style:{fontSize:11,color:"#94a3b8",marginTop:14,textAlign:"center",lineHeight:1.6}},"パスワードを忘れた場合は管理者（オーナー）にリセットを依頼してください")
        )
      )
    )
  );
}

function ApprovalTab({currentUser,employees,admins,records,setRecords,saveRecord,saveRecords,selectedMonth,showToast,ensureMonthLoaded}){
  const managedStores=currentUser.managedStores||[currentUser.store];
  const [approvalMonth,setApprovalMonth]=useState(selectedMonth);

  useEffect(()=>{ if(ensureMonthLoaded)ensureMonthLoaded(approvalMonth); },[approvalMonth]);
  const [selEmpId,setSelEmpId]=useState(null);

  const [,forceRerender]=useState(0);
  const bumpRerender=()=>forceRerender(n=>n+1);

  const allStaffMap=new Map();
  activeIn([...employees,...(admins||[])],approvalMonth).forEach(emp=>allStaffMap.set(emp.id,emp));

  const targetStaff=[...allStaffMap.values()].filter(emp=>{
    const isSelf=emp.id===currentUser.id;
    if(isSelf)return currentUser.role==="superadmin";
    if(emp.role==="superadmin")return currentUser.role==="superadmin";
    return managedStores.includes(emp.store);
  });
  const isOwner=currentUser.role==="superadmin";

  const rowStore=(emp,rec,seg)=>{
    if(rec&&isMultiSeg(rec))return seg?seg.store:"";
    return (rec&&rec.store)||(emp&&emp.store)||"";
  };

  const hasStoreManager=(store,emp)=>(admins||[]).some(a=>a.role==="admin"&&a.id!==(emp&&emp.id)&&!isRetiredAt(a,monthKeyOf(new Date()))&&(a.managedStores||[a.store]).includes(store));
  const canApproveSeg=(emp,rec,seg)=>{
    if(!emp)return false;
    if(emp.id===currentUser.id)return isOwner;
    if(emp.role==="superadmin")return isOwner;
    if(isOwner)return true;
    const st=rowStore(emp,rec,seg);
    if(managedStores.includes(st))return true;
    return !hasStoreManager(st,emp)&&managedStores.includes(emp.store);
  };
  const monthRecsOf=emp=>Object.values(records[emp.id]||{}).filter(r=>r.date?.startsWith(approvalMonth));

  const helperStaff=[...allStaffMap.values()].filter(emp=>
    !targetStaff.some(x=>x.id===emp.id)&&emp.id!==currentUser.id&&emp.role!=="superadmin"&&
    monthRecsOf(emp).some(r=>recSegs(r).some(sg=>canApproveSeg(emp,r,sg))));
  const helperGroups=managedStores.map(store=>[store,helperStaff.filter(emp=>monthRecsOf(emp).some(r=>recSegs(r).some(sg=>rowStore(emp,r,sg)===store&&canApproveSeg(emp,r,sg))))]).filter(g=>g[1].length>0);

  const countSegs=(emp,st,onlyMine)=>monthRecsOf(emp).reduce((n,r)=>n+recSegs(r).filter(sg=>sg.status===st&&(!onlyMine||canApproveSeg(emp,r,sg))).length,0);

  const selEmp=[...targetStaff,...helperStaff].find(x=>x.id===selEmpId);
  const getDaysInMonth=month=>{
    const [y,m]=month.split("-").map(Number);
    const days=[];
    const last=new Date(y,m,0).getDate();
    for(let d=1;d<=last;d++)days.push(`${month}-${String(d).padStart(2,"0")}`);
    return days;
  };
  const allDays=selEmp?getDaysInMonth(approvalMonth):[];
  const selRecs=selEmp?allDays.map(date=>{
    const r=records[selEmp.id]?.[date];
    return r?{...r,empName:selEmp.name,empStore:selEmp.store}:{empId:selEmp.id,date,empName:selEmp.name,empStore:selEmp.store,status:null,clockIn:"",clockOut:""};
  }):[];

  const showTravel=needTravelCol(selEmp,selRecs);

  const allPending=[];
  [...targetStaff,...helperStaff].forEach(emp=>{
    monthRecsOf(emp).forEach(r=>{
      recSegs(r).forEach(sg=>{ if(sg.status==="submitted"&&canApproveSeg(emp,r,sg))allPending.push({...r,empName:emp.name}); });
    });
  });

  const mgrClosed=targetStaff.length>0&&targetStaff.every(emp=>isAdminClosed(emp.id,approvalMonth));

  const notClosedStaff=targetStaff.filter(emp=>!isAdminClosed(emp.id,approvalMonth));
  const partiallyClosed=targetStaff.length>0&&notClosedStaff.length>0&&notClosedStaff.length<targetStaff.length;

  const nameOfStaff=empId=>([...employees,...(admins||[])].find(x=>x.id===empId)||{}).name||"";
  const me=currentUser?.name||"";

  const empClosed=empId=>isAdminClosed(empId,approvalMonth);

  const segLabel=(rec,idx)=>isMultiSeg(rec)&&rec.segs.length>1?"（"+(STORE_ABBR[rec.segs[idx].store]||rec.segs[idx].store)+"）":"";
  const approve=async(empId,date,idx)=>{
    if(empClosed(empId)){showToast("月締め済みです。月締めを解除してから操作してください。","warning");return;}
    const rec=records[empId]?.[date];if(!rec)return;

    const ok=await saveRecord(patchSeg(rec,idx||0,{status:"approved",approvedBy:me,approvedAt:new Date().toISOString()}),makeLog(me,"承認",nameOfStaff(empId),date+segLabel(rec,idx||0),""),{revertOnFail:true});
    if(!ok){showToast(failMsg("承認できませんでした。通信環境を確認して、もう一度お試しください。"),"warning");return;}
    showToast("承認しました ✓");
  };

  const [rejectTarget,setRejectTarget]=useState(null);
  const askReject=(empId,date,idx)=>{
    if(empClosed(empId)){showToast("月締め済みです。月締めを解除してから差戻ししてください。","warning");return;}
    setRejectTarget({empId,date,idx:idx||0});
  };
  const doReject=async(reason)=>{
    const {empId,date,idx}=rejectTarget;
    const existing=records[empId]?.[date];
    const emp=[...employees,...(admins||[])].find(x=>x.id===empId);

    const rec=existing||{empId,date,clockIn:"",clockOut:"",breaks:[],note:"",status:"draft",hourlyWage:emp?wageFor(emp,date):1000,store:emp?.store||""};
    const ok=await saveRecord(patchSeg(rec,idx,{status:"rejected",
      rejectReason:reason, rejectBy:me, rejectAt:new Date().toISOString()}),makeLog(me,"差戻し",nameOfStaff(empId),date+segLabel(rec,idx),reason),{revertOnFail:true});
    setRejectTarget(null);
    if(!ok){showToast(failMsg("差し戻せませんでした。通信環境を確認して、もう一度お試しください。"),"warning");return;}
    showToast("差し戻しました","warning");
  };

  const undoReject=async(r,idx)=>{
    const rec=records[r.empId]?.[r.date];
    let ok;
    if(!rec||(!rec.clockIn&&!rec.clockOut)){
      ok=await gasDeleteRecord(r.empId,r.date,makeLog(me,"差戻し取消",nameOfStaff(r.empId),r.date,""));
      if(ok)markLocalRecWrite(r.empId,r.date);
      if(ok)setRecords(prev=>{
        const empRecs={...(prev[r.empId]||{})};
        delete empRecs[r.date];
        return {...prev,[r.empId]:empRecs};
      });
    } else {
      ok=await saveRecord(patchSeg(rec,idx||0,{status:"submitted",rejectReason:undefined,rejectBy:undefined,rejectAt:undefined}),makeLog(me,"差戻し取消",nameOfStaff(r.empId),r.date+segLabel(rec,idx||0),""),{revertOnFail:true});
    }
    if(!ok){showToast(failMsg("取り消せませんでした。通信環境を確認して、もう一度お試しください。"),"warning");return;}
    showToast("差戻しを取り消しました");
  };

  const [deleteTarget,setDeleteTarget]=useState(null);
  const [deleting,setDeleting]=useState(false);
  const canDeleteSeg=(emp,rec,seg)=>isOwner||(currentUser.role==="admin"&&canApproveSeg(emp,rec,seg));
  const askOwnerDelete=(empId,date,idx)=>{
    const emp=allStaffMap.get(empId);
    const rec=records[empId]?.[date];
    if(!rec||!canDeleteSeg(emp,rec,recSegs(rec)[idx||0]))return;
    if(empClosed(empId)){showToast("月締め済みです。月締めを解除してから削除してください。","warning");return;}
    setDeleteTarget({empId,date,idx:idx||0});
  };
  const doOwnerDelete=async(reason,passHash)=>{
    const {empId,date,idx}=deleteTarget;
    const rec=records[empId]?.[date];
    if(!rec){setDeleteTarget(null);showToast("この記録はすでにありません","warning");return;}
    const label=segLabel(rec,idx);
    const multi=isMultiSeg(rec)&&rec.segs.length>1;
    const log=makeLog(me,isOwner?"削除（オーナー）":"削除（店長）",nameOfStaff(empId),date+label,reason);
    setDeleting(true);
    let r=null;
    try{ r=await gasPost("deleteSegByOwner",{empId,date,segIdx:idx,byId:currentUser.id,passHash,seen:rec,log}); }catch(err){ r=null; }
    setDeleting(false);
    if(r&&/不明なaction/.test(String(r.error||""))){showToast("削除できませんでした（GASが古い版です。GASを先に更新してください）","warning");return;}
    if(r&&r.refused){
      lastRefusal=r.error||null;setDeleteTarget(null);
      if(onRefusalReload)onRefusalReload();
      showToast(failMsg("削除できませんでした"),"warning");return;
    }
    if(!r||r.success===false){showToast("削除できませんでした。通信環境を確認して、もう一度お試しください。","warning");return;}
    markLocalRecWrite(empId,date);
    setRecords(prev=>{
      const empRecs={...(prev[empId]||{})};
      if(r.record)empRecs[date]={...r.record,synced:true};
      else delete empRecs[date];
      return {...prev,[empId]:empRecs};
    });
    afterLogResult(r,log);
    setDeleteTarget(null);
    showToast(nameOfStaff(empId)+"の"+date+(multi?label:"")+"を削除しました。本人にLINEなどで伝えてください。");
  };

  const approvableDays=()=>selRecs.filter(r=>r.status!==null).map(r=>{
    const segs=recSegs(r);
    const idxs=segs.map((sg,i)=>sg.status==="submitted"&&canApproveSeg(selEmp,r,sg)?i:-1).filter(i=>i>=0);
    return {r,idxs};
  }).filter(x=>x.idxs.length>0);
  const approveAll=async()=>{
    if(!selEmp){showToast("従業員を選択してください","warning");return;}
    if(empClosed(selEmp.id)){showToast("月締め済みです。月締めを解除してから操作してください。","warning");return;}
    const days=approvableDays();
    if(days.length===0){showToast("承認待ちのデータがありません","warning");return;}
    const at=new Date().toISOString();
    const targets=days.map(({r,idxs})=>idxs.reduce((acc,i)=>patchSeg(acc,i,{status:"approved",approvedBy:me,approvedAt:at}),records[selEmp.id][r.date]));

    const res=await saveRecords(targets,
      targets.map(r=>makeLog(me,"承認",selEmp.name,r.date,"一括承認")));
    if(!res.allOk){
      const reason=lastRefusal;lastRefusal=null;
      showToast(reason
        ?`${res.total}件のうち${res.ok}件だけ承認しました。残りは次の理由で承認できませんでした：${refusalText(reason)}`
        :`${res.total}件のうち${res.ok}件しか保存できませんでした。通信環境を確認して、もう一度お試しください。`,"warning");
      return;
    }
    showToast(`${selEmp.name}の${targets.length}件を承認しました`);
  };

  const [showOwnerPwModal,setShowOwnerPwModal]=useState(null);
  const [showCloseConfirm,setShowCloseConfirm]=useState(false);
  const [closing,setClosing]=useState(false);
  const doMgrClose=async(passHash)=>{
    if(allPending.length>0){
      showToast(`承認待ちが${allPending.length}件あります。すべて承認または差戻ししてから月締めしてください。`,"warning");
      setShowCloseConfirm(false);
      return;
    }

    const rejectedCount=targetStaff.reduce((n,emp)=>n+countSegs(emp,"rejected",false),0);
    if(rejectedCount>0){
      showToast(`差戻し中が${rejectedCount}件あります。修正・承認後に月締めしてください。`,"warning");
      setShowCloseConfirm(false);
      return;
    }
    setClosing(true);

    const ok=await setAdminClosedMany(targetStaff.map(emp=>emp.id),approvalMonth,me,currentUser.id,passHash,
      makeLog(me,"月締め","（対象"+targetStaff.length+"名）",approvalMonth+"（月締め）",""));
    setClosing(false);
    setShowCloseConfirm(false);
    bumpRerender();
    if(!ok){
      showToast(failMsg("月締めができませんでした。パスワードが正しいか、通信環境を確認してもう一度お試しください。"),"warning");
      return;
    }
    showToast(approvalMonth+"分を月締めしました");
  };

  const storeMembers=store=>{
    const m=targetStaff.filter(emp=>emp.store===store);
    if(!isOwner&&currentUser.store===store&&!m.some(x=>x.id===currentUser.id))m.push(currentUser);
    return m;
  };
  const storeState=store=>{
    const members=storeMembers(store);
    const closedN=members.filter(emp=>isAdminClosed(emp.id,approvalMonth)).length;

    const pending=members.reduce((n,emp)=>n+countSegs(emp,"submitted",false),0);
    const pendingOther=members.reduce((n,emp)=>n+countSegs(emp,"submitted",false)-countSegs(emp,"submitted",true),0);
    const rejected=members.reduce((n,emp)=>n+countSegs(emp,"rejected",false),0);
    return {members,closedN,allClosed:members.length>0&&closedN===members.length,pending,pendingOther,rejected};
  };
  const [storeConfirm,setStoreConfirm]=useState(null);
  const [storeBusy,setStoreBusy]=useState(null);
  const doStoreClose=async(store,passHash)=>{
    const st=storeState(store);
    if(st.pending>0){showToast(`${store}に承認待ちが${st.pending}件あります。すべて承認または差戻ししてから月締めしてください。`+(st.pendingOther>0?`（うち${st.pendingOther}件は他店舗で働いた分で、その店舗の店長の承認が必要です）`:""),"warning");setStoreConfirm(null);return;}
    if(st.rejected>0){showToast(`${store}に差戻し中が${st.rejected}件あります。修正・承認後に月締めしてください。`,"warning");setStoreConfirm(null);return;}
    setStoreBusy(store);
    const ok=await setAdminClosedMany(st.members.map(emp=>emp.id),approvalMonth,me,currentUser.id,passHash,
      makeLog(me,"月締め","（"+store+"・対象"+st.members.length+"名）",approvalMonth+"（月締め）",""));
    setStoreBusy(null);setStoreConfirm(null);
    bumpRerender();
    if(!ok){showToast(failMsg("月締めができませんでした。通信環境を確認してもう一度お試しください。"),"warning");return;}
    showToast(store+"の"+approvalMonth+"分を月締めしました");
  };
  const doStoreUnclose=async(store,passHash)=>{
    const st=storeState(store);
    setStoreBusy(store);
    const ok=await unsetAdminClosedMany(st.members.map(emp=>emp.id),approvalMonth,currentUser.id,passHash,
      makeLog(me,"月締め解除","（"+store+"・対象"+st.members.length+"名）",approvalMonth+"（月締め）",""));
    setStoreBusy(null);
    bumpRerender();
    if(!ok){showToast(failMsg("解除ができませんでした。パスワードが正しいか、通信環境を確認してもう一度お試しください。"),"warning");return;}
    showToast(store+"の月締めを解除しました。従業員は修正できます。","warning");
  };

  const storeCloseControls=store=>{
    const st=storeState(store);
    const busy=storeBusy===store;
    const canClose=isOwner||managedStores.includes(store);
    if(st.allClosed){
      return e("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}},
        e("span",{style:{fontSize:11,fontWeight:700,color:"#065f46",background:"#d1fae5",padding:"3px 10px",borderRadius:20}},"🔒 月締め済み"),
        isOwner&&e("button",{className:"btn btn-outline",style:{fontSize:11,padding:"3px 10px"},disabled:busy,onClick:()=>setShowOwnerPwModal({kind:"uncloseStore",store})},busy?"解除中…":"解除")
      );
    }
    if(!canClose)return null;
    if(storeConfirm===store){
      return e("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap",background:"#fff3cd",padding:"4px 10px",borderRadius:8}},
        e("span",{style:{fontSize:11.5,fontWeight:700,color:"#1e3a5f"}},store+"の"+approvalMonth+"分（"+st.members.length+"名）を月締めしますか？"),
        e("button",{className:"btn btn-success",style:{fontSize:11,padding:"3px 10px"},disabled:busy,
          onClick:()=>{ if(isOwner)setShowOwnerPwModal({kind:"closeStore",store}); else doStoreClose(store,null); }},busy?"送信中…":"はい・月締めする"),
        e("button",{className:"btn btn-outline",style:{fontSize:11,padding:"3px 10px"},disabled:busy,onClick:()=>setStoreConfirm(null)},"キャンセル")
      );
    }
    return e("div",{style:{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}},
      st.closedN>0&&e("span",{style:{fontSize:11,fontWeight:700,color:"#92400e"}},"⚠ 未締め"+(st.members.length-st.closedN)+"名"),
      e("button",{className:"btn btn-primary",style:{fontSize:11,padding:"3px 10px"},disabled:busy,onClick:()=>setStoreConfirm(store)},"🔒 この店舗を月締め")
    );
  };

  const [unclosing,setUnclosing]=useState(false);
  const doMgrUnclose=async(passHash)=>{
    setUnclosing(true);
    const ok=await unsetAdminClosedMany(targetStaff.map(emp=>emp.id),approvalMonth,currentUser.id,passHash,
      makeLog(me,"月締め解除","（対象"+targetStaff.length+"名）",approvalMonth+"（月締め）",""));
    setUnclosing(false);
    bumpRerender();
    if(!ok){
      showToast(failMsg("解除ができませんでした。パスワードが正しいか、通信環境を確認してもう一度お試しください。"),"warning");
      return;
    }
    showToast("全員の月締めを解除しました。従業員は修正できます。","warning");
  };

  return e("div",null,

    deleteTarget&&records[deleteTarget.empId]?.[deleteTarget.date]&&e(OwnerDeleteModal,{
      currentUser,
      empName:nameOfStaff(deleteTarget.empId),
      rec:records[deleteTarget.empId][deleteTarget.date],
      idx:deleteTarget.idx,
      busy:deleting,
      onSubmit:doOwnerDelete,
      onCancel:()=>{ if(!deleting)setDeleteTarget(null); }
    }),

    rejectTarget&&e(RejectModal,{
      empName:nameOfStaff(rejectTarget.empId),
      date:rejectTarget.date,
      onSubmit:doReject,
      onCancel:()=>setRejectTarget(null)
    }),

    showOwnerPwModal&&e(OwnerPasswordModal,{
      currentUser,
      actionLabel:(showOwnerPwModal==="close"||showOwnerPwModal.kind==="closeStore")?"月締め":"月締め解除",
      onCancel:()=>setShowOwnerPwModal(null),
      onConfirm:async(passHash)=>{
        const action=showOwnerPwModal;
        setShowOwnerPwModal(null);
        if(action==="close")await doMgrClose(passHash);
        else if(action==="unclose")await doMgrUnclose(passHash);
        else if(action.kind==="closeStore")await doStoreClose(action.store,passHash);
        else if(action.kind==="uncloseStore")await doStoreUnclose(action.store,passHash);
      }
    }),

    mgrClosed
      ?e("div",{style:{background:"#d1fae5",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}},
        e("span",{style:{fontSize:14,fontWeight:700,color:"#065f46"}},"🔒 "+approvalMonth+"分 月締め済み"),
        isOwner
          ?e("button",{className:"btn btn-outline",style:{fontSize:11,padding:"4px 12px"},disabled:unclosing,onClick:()=>setShowOwnerPwModal("unclose")},unclosing?"解除中…":"全員分の月締めを解除")
          :e("span",{style:{fontSize:11,color:"#065f46",fontWeight:600}},"解除はオーナーのみ行えます")
      )
      :showCloseConfirm
        ?e("div",{style:{background:"#fff3cd",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
          e("span",{style:{fontSize:13,fontWeight:700,color:"#1e3a5f"}},approvalMonth+"分を月締めしますか？従業員は入力・修正できなくなります。"),
          e("button",{className:"btn btn-success",style:{fontSize:12,padding:"6px 16px"},disabled:closing,onClick:()=>setShowOwnerPwModal("close")},closing?"送信中…":"はい・月締めする"),
          e("button",{className:"btn btn-outline",style:{fontSize:12,padding:"6px 16px"},disabled:closing,onClick:()=>setShowCloseConfirm(false)},"キャンセル")
        )
        :e("div",{style:{background:"#f8faff",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}},
          partiallyClosed

            ?e("span",{style:{fontSize:12,color:"#64748b"}},
              approvalMonth+"分：締め済み"+(targetStaff.length-notClosedStaff.length)+"名／未締め"+notClosedStaff.length+"名（店舗名の右のボタンで店舗ごとに締められます）")
            :e("span",{style:{fontSize:12,color:"#64748b"}},isOwner?"月末に承認が完了したら、店舗ごと（店舗名の右のボタン）または全員一括で月締めしてください":"月末に承認が完了したら、店舗名の右のボタンで担当店舗を月締めしてください（解除はオーナーのみ）"),
          e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
            isOwner&&e("button",{className:"btn btn-primary",style:{fontSize:13},onClick:()=>setShowCloseConfirm(true)},"🔒 "+approvalMonth+"分を全員一括で月締め"),
            isOwner&&partiallyClosed&&e("button",{className:"btn btn-outline",style:{fontSize:12},disabled:unclosing,onClick:()=>setShowOwnerPwModal("unclose")},unclosing?"解除中…":"全員分の月締めを解除")
          )
        ),

    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}},
      e("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
        e("input",{type:"month",value:approvalMonth,onChange:ev=>{setApprovalMonth(ev.target.value);setSelEmpId(null);},className:"input-field",style:{width:"auto",fontSize:14,fontWeight:700,padding:"6px 12px",color:"#1e3a5f",border:"2px solid #1e3a5f",borderRadius:10}}),
        e("span",{style:{fontSize:13,color:"#64748b"}},"担当店舗: "+managedStores.join("・")),
        e("span",{style:{fontSize:12,background:"#fff3cd",color:"#856404",padding:"2px 10px",borderRadius:20,fontWeight:700}},"承認待ち: "+allPending.length+"件")
      )
    ),

    e("div",{style:{marginBottom:16}},
      ...groupByStore(targetStaff).map(([store,list])=>e("div",{key:store,style:{marginBottom:12}},
        e("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:6}},
          e("div",{style:{fontSize:11.5,fontWeight:700,color:"#64748b",background:"#f1f5f9",
            borderRadius:6,padding:"4px 10px",display:"inline-block"}},
            store+"（"+list.length+"名）"),
          storeCloseControls(store)
        ),
        e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
      list.map(emp=>{

        const pendingCount=countSegs(emp,"submitted",true);
        const rejectedCount=countSegs(emp,"rejected",true);
        const isEmpClosed=isAdminClosed(emp.id,approvalMonth);
        return e("button",{key:emp.id,
          onClick:()=>setSelEmpId(selEmpId===emp.id?null:emp.id),
          style:{padding:"8px 14px",borderRadius:10,border:`2px solid ${selEmpId===emp.id?"#1e3a5f":"#e2e8f0"}`,background:selEmpId===emp.id?"#1e3a5f":"white",color:selEmpId===emp.id?"white":"#1e3a5f",cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:6}},
          emp.name,

          isEmpClosed&&e("span",{style:{fontSize:10,background:"#065f46",color:"white",padding:"1px 5px",borderRadius:8}},"月締め済"),
          pendingCount>0&&e("span",{style:{fontSize:10,background:"#fff3cd",color:"#856404",padding:"1px 5px",borderRadius:8}},pendingCount+"件"),
          rejectedCount>0&&e("span",{style:{fontSize:10,background:"#fee2e2",color:"#991b1b",padding:"1px 5px",borderRadius:8}},"差戻し"+rejectedCount)
        );
      })
        )
      )),

      ...helperGroups.map(([store,list])=>e("div",{key:"h_"+store,style:{marginBottom:12}},
        e("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:6}},
          e("div",{style:{fontSize:11.5,fontWeight:700,color:"#7c3aed",background:"#f5f3ff",borderRadius:6,padding:"4px 10px",display:"inline-block"}},
            store+"で働いた他店舗の従業員（"+list.length+"名）"),
          e("span",{style:{fontSize:11,color:"#94a3b8"}},"この店舗の行だけ承認できます。月締めは所属店舗で行います")
        ),
        e("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
          list.map(emp=>{
            const pendingCount=countSegs(emp,"submitted",true);
            const rejectedCount=countSegs(emp,"rejected",true);
            return e("button",{key:emp.id,
              onClick:()=>setSelEmpId(selEmpId===emp.id?null:emp.id),
              style:{padding:"8px 14px",borderRadius:10,border:`2px solid ${selEmpId===emp.id?"#1e3a5f":"#e2e8f0"}`,background:selEmpId===emp.id?"#1e3a5f":"white",color:selEmpId===emp.id?"white":"#1e3a5f",cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:6}},
              emp.name,
              e("span",{style:{fontSize:10,color:selEmpId===emp.id?"rgba(255,255,255,.7)":"#94a3b8"}},emp.store),
              pendingCount>0&&e("span",{style:{fontSize:10,background:"#fff3cd",color:"#856404",padding:"1px 5px",borderRadius:8}},pendingCount+"件"),
              rejectedCount>0&&e("span",{style:{fontSize:10,background:"#fee2e2",color:"#991b1b",padding:"1px 5px",borderRadius:8}},"差戻し"+rejectedCount)
            );
          })
        )
      ))
    ),

    selEmp&&e("div",null,
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8,flexWrap:"wrap"}},
        e("div",{style:{fontWeight:700,fontSize:14,color:"#1e3a5f"}},selEmp.name+" の"+approvalMonth+"の勤怠"),
        approvableDays().length>0&&!empClosed(selEmp.id)&&e("button",{className:"btn btn-success",style:{fontSize:12,padding:"6px 16px"},onClick:approveAll},"✓ 承認待ちを一括承認"),
        !targetStaff.some(x=>x.id===selEmp.id)&&e("span",{style:{fontSize:11,color:"#7c3aed",fontWeight:600}},"所属："+selEmp.store+"。担当店舗の行だけ承認できます")
      ),
      e("div",{style:{overflowX:"auto"}},
      e("table",{className:"table",style:{fontSize:13}},

        e("thead",null,e("tr",null,["日付","操作","店舗","出勤","退勤","休憩",...(showTravel?["移動"]:[]),"備考",T_LABEL.work,"状態"].map(h=>e("th",{key:h},h)))),
        e("tbody",null,...selRecs.flatMap((r,i)=>{
          const calc=calcRecord({...r,hourlyWage:r.hourlyWage!=null?r.hourlyWage:(selEmp.hourlyWage??1000)});
          const dayStatus=effStatus(r);
          const hasData=r.clockIn||r.clockOut;
          const segs=r.status===null?[{store:"",clockIn:"",clockOut:"",breaks:[],travelTimes:[],note:"",status:null}]:recSegs(r);
          const span=segs.length;
          const rowBg=dayStatus==="rejected"?"#fff1f2":!hasData&&dayStatus!=="rejected"?"#fafafa":undefined;
          const closed=empClosed(r.empId);
          return segs.map((sg,idx)=>{
            const can=canApproveSeg(selEmp,r,sg);
            const segHasData=!!(sg.clockIn||sg.clockOut);

            const delBtn=!closed&&(sg.status==="submitted"||sg.status==="rejected")&&records[r.empId]?.[r.date]&&canDeleteSeg(selEmp,r,sg)
              ?e("button",{className:"btn btn-outline","data-testid":"owner-delete",style:{fontSize:11,padding:"3px 9px",color:"#991b1b",borderColor:"#fca5a5"},
                  title:"この行を削除（店長・オーナー）",onClick:()=>askOwnerDelete(r.empId,r.date,idx)},"🗑 削除"):null;
            const ops=sg.status==="approved"
              ?e("div",{style:{display:"flex",gap:6}},
                e("span",{style:{color:"#059669",fontSize:12}},"✓ 承認済"),
                can&&!closed&&e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 10px"},onClick:()=>askReject(r.empId,r.date,idx)},"差戻し"))
              :sg.status==="rejected"
                ?e("div",{style:{display:"flex",gap:6}},
                  can&&!closed&&e("button",{className:"btn btn-warning",style:{fontSize:11,padding:"4px 10px"},onClick:()=>undoReject(r,idx)},"差戻し取消"),
                  delBtn)
                :e("div",{style:{display:"flex",gap:6}},
                  segHasData&&can&&!closed&&e("button",{className:"btn btn-success",style:{fontSize:11,padding:"4px 10px"},onClick:()=>approve(r.empId,r.date,idx)},"承認"),
                  can&&!closed&&e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 10px"},onClick:()=>askReject(r.empId,r.date,idx)},"差戻し"),
                  !can&&sg.status&&e("span",{style:{fontSize:11,color:"#94a3b8"}},(STORE_ABBR[sg.store]||sg.store)+"の店長が承認"),
                  delBtn);
            const cells=[];
            if(idx===0)cells.push(e("td",{key:"d",rowSpan:span,style:{fontWeight:600}},r.date));

const FAV_MAX=5;
const FAV_NAME_MAX=10;
const isHHMM=t=>/^([01]\d|2[0-3]):[0-5]\d$/.test(String(t||""));
const favRanges=arr=>(arr||[]).filter(x=>x&&isHHMM(x.start)&&isHHMM(x.end)&&x.start!==x.end).slice(0,5).map(x=>({start:x.start,end:x.end}));
function normFavTimes(list){
  if(!Array.isArray(list)||!list.length)return [];
  const out=[],seen={};
  for(const f0 of list){
    if(out.length>=FAV_MAX)break;
    const f=f0||{};
    const name=String(f.name||"").trim().slice(0,FAV_NAME_MAX);
    if(!name||seen[name]||!isHHMM(f.clockIn)||!isHHMM(f.clockOut)||f.clockIn===f.clockOut)continue;
    seen[name]=true;
    out.push({name,clockIn:f.clockIn,clockOut:f.clockOut,breaks:favRanges(f.breaks),travelTimes:favRanges(f.travelTimes)});
  }
  return out;
}

function favRangeText(f){return f.clockIn+"〜"+(toMin(f.clockOut)<toMin(f.clockIn)?"翌":"")+f.clockOut;}
function favBreakText(f,isBi){const v=favRanges(f.breaks);return v.length?L("休憩 ","Break ",isBi)+v.map(x=>x.start+"〜"+x.end).join("・"):L("休憩なし","No break",isBi);}

function lastWorkBefore(empRecs,date){
  const ds=Object.keys(empRecs||{}).filter(d=>d<date).sort().reverse();
  for(const d of ds){

      return {date:d,store:s0.store||r.store||"",clockIn:s0.clockIn,clockOut:s0.clockOut,breaks:validRanges(s0.breaks),travelTimes:validRanges(s0.travelTimes)};
  }
  return null;
}

    const inMin=parseInt(ci.slice(0,2))*60+parseInt(ci.slice(3));

    let tMin=parseInt(timeStr.slice(0,2))*60+parseInt(timeStr.slice(3));
    if(outMin<=inMin)outMin+=1440;
    let tAdjusted=tMin;
    if(tMin<inMin)tAdjusted=tMin+1440;
    return tAdjusted>=inMin&&tAdjusted<=outMin;

    let outMin=parseInt(co.slice(0,2))*60+parseInt(co.slice(3));
