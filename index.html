@media print{

  .print-only+.print-only{page-break-before:always;break-before:page}
  body{background:white;margin:0;padding:0}

.table{width:100%;border-collapse:collapse}
.table th{background:#f8fafc;color:#64748b;font-size:11px;font-weight:700;padding:10px 12px;text-align:left;border-bottom:2px solid #e2e8f0}

// ===== パスワード認証（SHA-256ハッシュ化して保存） =====
async function sha256(str){
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    // crypto.subtle が使えない環境（非https等）向けの簡易フォールバック
    let h=5381;for(let i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))>>>0;}
    return "fb_"+h.toString(16)+"_"+str.length;
  }
}
// passHash が null/undefined = 初期パスワードのまま（初回ログイン後に変更必須）
async function verifyPassword(emp,input){
  if(!emp)return false;
  if(emp.passHash==null)return input===INITIAL_PASSWORD;
  return (await sha256(input))===emp.passHash;
}

      passHash:emp.passHash!==undefined?emp.passHash:null};
  });
}

// ===== GAS通信関数 =====
async function gasGet(action,params={}){
  try{
    const q=new URLSearchParams({action,...params}).toString();
    const res=await fetch(`${GAS_URL}?${q}`);
    return await res.json();
  }catch(e){console.error("GAS GET error:",e);return{success:false,error:e.message};}
}
async function gasPost(action,data={}){
  try{
    const res=await fetch(GAS_URL,{method:"POST",body:JSON.stringify({action,...data})});
    return await res.json();
  }catch(e){console.error("GAS POST error:",e);return{success:false,error:e.message};}
}

// 「HH:MM」→分に変換
function toMin(t){
  if(!t||typeof t!=="string"||t.length<4)return null;
  const h=parseInt(t.slice(0,2),10),m=parseInt(t.slice(3,5),10);
  if(!Number.isFinite(h)||!Number.isFinite(m))return null;
  return h*60+m;
}

function mergeRanges(ranges){
  if(ranges.length===0)return[];
  const sorted=[...ranges].sort((a,b)=>a[0]-b[0]);
  const out=[sorted[0].slice()];
  for(let i=1;i<sorted.length;i++){
    const cur=sorted[i],last=out[out.length-1];
    if(cur[0]<=last[1])last[1]=Math.max(last[1],cur[1]);
    else out.push(cur.slice());
  }
  return out;
}
// 2区間の重なり（分）
const overlapMin=(a1,a2,b1,b2)=>Math.max(0,Math.min(a2,b2)-Math.max(a1,b1));

function calcRecord(rec){
  const ZERO={workMinutes:0,overtimeMinutes:0,lateNightMinutes:0,pay:0};
  if(!rec||!rec.clockIn||!rec.clockOut)return ZERO;
  const inMin=toMin(rec.clockIn);
  let outMin=toMin(rec.clockOut);
  if(inMin==null||outMin==null)return ZERO;
  // 出勤と退勤が同じ時刻＝勤務0分として扱う（打刻ミス対策）
  if(outMin===inMin)return ZERO;
  // 退勤が出勤より前なら翌日にまたぐ勤務とみなす
  if(outMin<inMin)outMin+=1440;
  const total=Math.min(outMin-inMin,24*60);
  const shiftEnd=inMin+total;

  // 休憩・移動を「シフト開始からの時間軸」に正規化して区間化
  const toRanges=arr=>{
    const out=[];
    (arr||[]).forEach(x=>{
      if(!x||!x.start||!x.end)return;
      let s=toMin(x.start),en=toMin(x.end);
      if(s==null||en==null)return;
      if(s===en)return;                // 同時刻＝0分として無視
      // 日をまたいだ時刻をシフト軸に合わせる
      if(s<inMin)s+=1440;
      if(en<inMin)en+=1440;
      if(en<=s)en+=1440;
      // 勤務時間の範囲内にクランプ（範囲外の入力で給与が狂わないように）
      const cs=Math.max(s,inMin),ce=Math.min(en,shiftEnd);
      if(ce>cs)out.push([cs,ce]);
    });
    return mergeRanges(out);
  };

  const breakRanges=toRanges(rec.breaks);
  let bm=breakRanges.reduce((n,[s,e2])=>n+(e2-s),0);

  // 移動時間（モノレール勤務のみ）。休憩と重なる分は二重控除しない
  const isMonorail=isMonorailWork(rec.empId,rec.store);
  const deductRanges=mergeRanges([...breakRanges,...toRanges(isMonorail?rec.travelTimes:[])]);
  let dm=deductRanges.reduce((n,[s,e2])=>n+(e2-s),0);
  // 旧データ（breakMinutesのみ保存されている場合）の互換
  if(dm===0&&rec.breakMinutes)dm=Math.max(0,Number(rec.breakMinutes)||0);

  const wm=Math.max(0,total-dm);
  const om=Math.max(0,wm-OVERTIME_THRESHOLD*60);

  // 深夜帯（22:00〜翌5:00）を前日・当日・翌日ぶん用意して重なりを合算
  let lnWork=0,lnDeduct=0;
  for(let k=-1;k<=1;k++){
    const ns=1320+1440*k, ne=1740+1440*k;   // 22:00〜29:00(=翌5:00)
    lnWork+=overlapMin(inMin,shiftEnd,ns,ne);
    deductRanges.forEach(([s,e2])=>{lnDeduct+=overlapMin(s,e2,ns,ne);});
  }
  const ln=Math.min(wm,Math.max(0,lnWork-lnDeduct));

  // 給与：通常×1.0 残業のみ×1.25 深夜のみ×1.25 深夜残業×1.5
  const lnOt=Math.min(ln,om),lnOnly=ln-lnOt,otOnly=om-lnOt,normal=wm-om-lnOnly;
  const wage=Math.max(0,rec.hourlyWage!=null?Number(rec.hourlyWage)||0:1000),pm=wage/60;
  const pay=Math.round(normal*pm+otOnly*pm*1.25+lnOnly*pm*1.25+lnOt*pm*1.5);
  return{workMinutes:Math.round(wm),overtimeMinutes:Math.round(om),lateNightMinutes:Math.round(ln),pay:Number.isFinite(pay)?pay:0};
}
function mHHMM(m){return `${Math.floor(m/60)}時間${String(m%60).padStart(2,"0")}分`}

// ===== 共通ヘルパー（同じ判定・整形が各所で必要なためまとめる） =====
// モノレール勤務か（移動時間の対象になるか）
function isMonorailWork(empId,store){
  return CONSTRUCTION_IDS.includes(empId)||store==="モノレール";
}
// 「移動」列を表示するか（対象スタッフ、またはその月に移動の記録がある）
function needTravelCol(emp,recs){
  if(!emp)return false;
  if(isMonorailWork(emp.id,emp.store))return true;
  return (recs||[]).some(r=>(r.travelTimes||[]).some(t=>t.start&&t.end));
}
// 休憩・移動の時間帯を「12:00〜13:00/15:00〜15:30」の形に整える
function rangeText(arr,fallback){
  const v=(arr||[]).filter(x=>x.start&&x.end);
  return v.length?v.map(x=>x.start+"〜"+x.end).join("/"):(fallback||"—");
}

// ===== LOGIN SCREEN（ID・パスワード方式） =====
function LoginScreen({employees,admins,onLogin,onAdminLogin}){
  const [loginId,setLoginId]=useState("");
  const [pw,setPw]=useState("");
  const [showPw,setShowPw]=useState(false);
  const [err,setErr]=useState(null);
  const [busy,setBusy]=useState(false);
  const doLogin=async()=>{
    if(busy)return;
    const idv=loginId.trim().toLowerCase();
    if(!idv||!pw){setErr("IDとパスワードを入力してください");return;}
    setBusy(true);
    const all=[...employees,...(admins||[])];
    const emp=all.find(x=>String(x.loginId||"").toLowerCase()===idv);
    const ok=emp?await verifyPassword(emp,pw):false;
    setBusy(false);
    if(!ok){setErr("IDまたはパスワードが違います");setPw("");return;}
    if(emp.role==="admin"||emp.role==="superadmin")onAdminLogin(emp);
    else onLogin(emp);
  };
  return e("div",{style:{minHeight:"100vh",background:"#f0f2f5",display:"flex",flexDirection:"column"}},
    e("nav",{className:"nav"},e("div",{className:"nav-brand"},"⏱ 勤怠管理システム")),
    e("div",{style:{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:24}},
      e("div",{style:{width:400,maxWidth:"100%",boxSizing:"border-box"}},
        e("div",{className:"card"},
          e("h2",{style:{fontSize:18,fontWeight:700,color:"#1e3a5f",marginBottom:4,textAlign:"center"}},"ログイン"),
          e("p",{style:{fontSize:12,color:"#94a3b8",marginBottom:20,textAlign:"center"}},"ログインIDとパスワードを入力してください"),
          e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},"ログインID"),
          e("input",{type:"email",value:loginId,onChange:ev=>{setLoginId(ev.target.value);setErr(null);},onKeyDown:ev=>{if(ev.key==="Enter")doLogin();},placeholder:"example@tribe.jp",autoComplete:"username",className:"input-field",style:{marginBottom:14}}),
          e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},"パスワード"),
          e("input",{type:showPw?"text":"password",value:pw,onChange:ev=>{setPw(ev.target.value);setErr(null);},onKeyDown:ev=>{if(ev.key==="Enter")doLogin();},autoComplete:"current-password",className:"input-field",style:{marginBottom:8}}),
          e("label",{style:{display:"flex",alignItems:"center",gap:6,fontSize:12,color:"#64748b",marginBottom:12,cursor:"pointer"}},
            e("input",{type:"checkbox",checked:showPw,onChange:ev=>setShowPw(ev.target.checked)}),"パスワードを表示"
          ),
          err&&e("p",{style:{color:"#dc2626",fontSize:12,fontWeight:700,marginBottom:12,textAlign:"center"}},err),
          e("button",{className:"btn btn-primary",style:{width:"100%",padding:"12px"},onClick:doLogin,disabled:busy},busy?"確認中…":"ログイン"),
          e("p",{style:{fontSize:11,color:"#94a3b8",marginTop:14,textAlign:"center",lineHeight:1.6}},"パスワードを忘れた場合は管理者（オーナー）にリセットを依頼してください")
        )
      )
    )
  );
}

// ===== APPROVAL TAB =====
function ApprovalTab({currentUser,employees,admins,records,setRecords,saveRecord,saveRecords,selectedMonth,showToast}){
  const managedStores=currentUser.managedStores||[currentUser.store];
  const [approvalMonth,setApprovalMonth]=useState(selectedMonth);
  const [selEmpId,setSelEmpId]=useState(null);

  // IDで重複排除（employeesとadminsに同一IDが存在する場合に備える）
  const allStaffMap=new Map();
  [...employees,...(admins||[])].forEach(emp=>allStaffMap.set(emp.id,emp));
  // 承認対象の判定
  // ・一般スタッフ：担当店舗にいれば承認可
  // ・管理者同士：同じ店舗の管理者は互いに承認可（自分自身は不可）
  // ・オーナー：全員＋自分自身も承認可（上位者が存在しないため）
  // ・オーナーの勤怠：オーナーのみ承認可
  const targetStaff=[...allStaffMap.values()].filter(emp=>{
    const isSelf=emp.id===currentUser.id;
    if(isSelf)return currentUser.role==="superadmin";
    if(emp.role==="superadmin")return currentUser.role==="superadmin";
    return managedStores.includes(emp.store);
  });

  // 選択中スタッフのその月の全日付レコード
  const selEmp=targetStaff.find(x=>x.id===selEmpId);
  const getDaysInMonth=month=>{
    const [y,m]=month.split("-").map(Number);
    const days=[];
    const last=new Date(y,m,0).getDate();
    for(let d=1;d<=last;d++)days.push(`${month}-${String(d).padStart(2,"0")}`);
    return days;
  };
  const allDays=selEmp?getDaysInMonth(approvalMonth):[];
  const selRecs=selEmp?allDays.map(date=>{
    const r=records[selEmp.id]?.[date];
    return r?{...r,empName:selEmp.name,empStore:selEmp.store}:{empId:selEmp.id,date,empName:selEmp.name,empStore:selEmp.store,status:null,clockIn:"",clockOut:""};
  }):[];
  // 移動列：建設部門スタッフ、またはその月に移動時間の記録があれば表示
  const showTravel=needTravelCol(selEmp,selRecs);

  // 全スタッフの承認待ち件数
  const allPending=[];
  targetStaff.forEach(emp=>{
    Object.values(records[emp.id]||{}).forEach(r=>{
      if(r.date?.startsWith(approvalMonth)&&r.status==="submitted")allPending.push({...r,empName:emp.name});
    });
  });

  const mgrClosed=targetStaff.length>0&&targetStaff.every(emp=>isAdminClosed(emp.id,approvalMonth));

  const approve=(empId,date)=>{
    if(mgrClosed){showToast("月締め済みです。月締めを解除してから操作してください。","warning");return;}
    const rec=records[empId]?.[date];if(!rec)return;
    saveRecord({...rec,status:"approved"});showToast("承認しました ✓");
  };
  const reject=(empId,date)=>{
    if(mgrClosed){showToast("月締め済みです。月締めを解除してから差戻ししてください。","warning");return;}
    const existing=records[empId]?.[date];
    const emp=[...employees,...(admins||[])].find(x=>x.id===empId);
    const rec=existing||{empId,date,clockIn:"",clockOut:"",breaks:[],note:"",status:"draft",hourlyWage:emp?.hourlyWage??1000,store:emp?.store||""};
    saveRecord({...rec,status:"rejected"});
    showToast("差し戻しました","warning");
  };
  const approveAll=()=>{
    if(mgrClosed){showToast("月締め済みです。月締めを解除してから操作してください。","warning");return;}
    if(!selEmp){showToast("スタッフを選択してください","warning");return;}
    const targets=selRecs.filter(r=>r.status==="submitted");
    if(targets.length===0){showToast("承認待ちのデータがありません","warning");return;}
    saveRecords(targets.map(r=>({...r,status:"approved"})));
    showToast(`${selEmp.name}の${targets.length}件を承認しました`);
  };
  const [showCloseConfirm,setShowCloseConfirm]=useState(false);
  const doMgrClose=()=>{
    if(allPending.length>0){
      showToast(`承認待ちが${allPending.length}件あります。すべて承認または差戻ししてから月締めしてください。`,"warning");
      setShowCloseConfirm(false);
      return;
    }
    // 差戻し中があれば締め不可
    const rejectedCount=targetStaff.reduce((n,emp)=>n+Object.values(records[emp.id]||{}).filter(r=>r.date?.startsWith(approvalMonth)&&r.status==="rejected").length,0);
    if(rejectedCount>0){
      showToast(`差戻し中が${rejectedCount}件あります。修正・承認後に月締めしてください。`,"warning");
      setShowCloseConfirm(false);
      return;
    }
    targetStaff.forEach(emp=>setAdminClosed(emp.id,approvalMonth));
    showToast(approvalMonth+"分を月締めしました");
    setShowCloseConfirm(false);
  };
  // 月締め解除：全スタッフのフラグを外してスタッフが修正できる状態に
  const doMgrUnclose=()=>{
    targetStaff.forEach(emp=>{
      try{localStorage.removeItem(getAdminCloseKey(emp.id,approvalMonth));}catch{}
    });
    showToast("全員の月締めを解除しました。スタッフは修正できます。","warning");
  };

  return e("div",null,
    // 管理者月締めバナー
    mgrClosed
      ?e("div",{style:{background:"#d1fae5",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}},
        e("span",{style:{fontSize:14,fontWeight:700,color:"#065f46"}},"🔒 "+approvalMonth+"分 月締め済み"),
        e("button",{className:"btn btn-outline",style:{fontSize:11,padding:"4px 12px"},onClick:doMgrUnclose},"月締めを解除")
      )
      :showCloseConfirm
        ?e("div",{style:{background:"#fff3cd",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
          e("span",{style:{fontSize:13,fontWeight:700,color:"#1e3a5f"}},approvalMonth+"分を月締めしますか？スタッフは入力・訂正できなくなります。"),
          e("button",{className:"btn btn-success",style:{fontSize:12,padding:"6px 16px"},onClick:doMgrClose},"はい・月締めする"),
          e("button",{className:"btn btn-outline",style:{fontSize:12,padding:"6px 16px"},onClick:()=>setShowCloseConfirm(false)},"キャンセル")
        )
        :e("div",{style:{background:"#f8faff",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}},
          e("span",{style:{fontSize:12,color:"#64748b"}},"月末に全員の承認が完了したら月締めしてください"),
          e("button",{className:"btn btn-primary",style:{fontSize:13},onClick:()=>setShowCloseConfirm(true)},"🔒 "+approvalMonth+"分を月締め")
        ),
    // ヘッダー
    e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16,flexWrap:"wrap",gap:10}},
      e("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
        e("input",{type:"month",value:approvalMonth,onChange:ev=>{setApprovalMonth(ev.target.value);setSelEmpId(null);},className:"input-field",style:{width:"auto",fontSize:14,fontWeight:700,padding:"6px 12px",color:"#1e3a5f",border:"2px solid #1e3a5f",borderRadius:10}}),
        e("span",{style:{fontSize:13,color:"#64748b"}},"担当店舗: "+managedStores.join("・")),
        e("span",{style:{fontSize:12,background:"#fff3cd",color:"#856404",padding:"2px 10px",borderRadius:20,fontWeight:700}},"承認待ち: "+allPending.length+"件")
      )
    ),
      // スタッフ選択
    e("div",{style:{display:"flex",gap:8,flexWrap:"wrap",marginBottom:16}},
      targetStaff.map(emp=>{
        const empMonthRecs=Object.values(records[emp.id]||{}).filter(r=>r.date?.startsWith(approvalMonth));
        const pendingCount=empMonthRecs.filter(r=>r.status==="submitted").length;
        const rejectedCount=empMonthRecs.filter(r=>r.status==="rejected").length;
        const isEmpClosed=isAdminClosed(emp.id,approvalMonth);
        const hasRejected=empMonthRecs.some(r=>r.status==="rejected");
        return e("button",{key:emp.id,
          onClick:()=>setSelEmpId(selEmpId===emp.id?null:emp.id),
          style:{padding:"8px 14px",borderRadius:10,border:`2px solid ${selEmpId===emp.id?"#1e3a5f":"#e2e8f0"}`,background:selEmpId===emp.id?"#1e3a5f":"white",color:selEmpId===emp.id?"white":"#1e3a5f",cursor:"pointer",fontFamily:"inherit",fontWeight:600,fontSize:13,display:"flex",alignItems:"center",gap:6}},
          emp.name,
          isEmpClosed&&!hasRejected&&e("span",{style:{fontSize:10,background:"#065f46",color:"white",padding:"1px 5px",borderRadius:8}},"月締済"),
          pendingCount>0&&e("span",{style:{fontSize:10,background:"#fff3cd",color:"#856404",padding:"1px 5px",borderRadius:8}},pendingCount+"件"),
          rejectedCount>0&&e("span",{style:{fontSize:10,background:"#fee2e2",color:"#991b1b",padding:"1px 5px",borderRadius:8}},"差戻"+rejectedCount)
        );
      })
    ),
    // 選択スタッフの日別一覧
    selEmp&&e("div",null,
      e("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10,gap:8,flexWrap:"wrap"}},
        e("div",{style:{fontWeight:700,fontSize:14,color:"#1e3a5f"}},selEmp.name+" の"+approvalMonth+"の勤怠"),
        selRecs.filter(r=>r.status==="submitted").length>0&&e("button",{className:"btn btn-success",style:{fontSize:12,padding:"6px 16px"},onClick:approveAll},"✓ 承認待ちを一括承認")
      ),
      e("div",{style:{overflowX:"auto"}},
      e("table",{className:"table",style:{fontSize:13}},
        e("thead",null,e("tr",null,["日付","店舗","出勤","退勤","休憩",...(showTravel?["移動"]:[]),"備考","実働","状態","操作"].map(h=>e("th",{key:h},h)))),
        e("tbody",null,...selRecs.map((r,i)=>{
          const calc=calcRecord({...r,hourlyWage:r.hourlyWage!=null?r.hourlyWage:(selEmp.hourlyWage??1000)});
          const hasData=r.clockIn||r.clockOut;
          const breakStr=rangeText(r.breaks);
          const travelStr=rangeText(r.travelTimes);
          return e("tr",{key:i,style:{background:r.status==="rejected"?"#fff1f2":!hasData&&r.status!=="rejected"?"#fafafa":undefined}},
            e("td",{style:{fontWeight:600}},r.date),
            e("td",{style:{fontSize:11,color:"#475569"}},hasData?(r.store||"—"):"—"),
            e("td",null,r.clockIn||"—"),
            e("td",null,r.clockOut||"—"),
            e("td",{style:{fontSize:11,color:"#64748b"}},breakStr),
            showTravel&&e("td",{style:{fontSize:11,color:"#0369a1"}},travelStr),
            e("td",{style:{fontSize:11,color:"#64748b",maxWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},r.note||"—"),
            e("td",null,hasData?mHHMM(calc.workMinutes):"—"),
            e("td",null,r.status
              ?e("span",{className:`status-badge ${S_CLASS[r.status]}`},S_LABEL[r.status])
              :e("span",{style:{fontSize:11,color:"#94a3b8"}},"データなし")
            ),
            e("td",null,
              r.status==="approved"
                ?e("div",{style:{display:"flex",gap:6}},
                  e("span",{style:{color:"#059669",fontSize:12}},"✓ 承認済"),
                  !mgrClosed&&e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 10px"},onClick:()=>reject(r.empId,r.date)},"差戻")
                )
                :r.status==="rejected"
                  ?e("div",{style:{display:"flex",gap:6}},
                    e("button",{className:"btn btn-warning",style:{fontSize:11,padding:"4px 10px"},onClick:()=>{
                      const rec=records[r.empId]?.[r.date];
                      if(!rec||(!rec.clockIn&&!rec.clockOut)){
                        // データなしで差戻したケース→レコードを削除してデータなしに戻す（GAS側も削除）
                        gasDeleteRecord(r.empId,r.date);
                        setRecords(prev=>{
                          const empRecs={...(prev[r.empId]||{})};
                          delete empRecs[r.date];
                          return {...prev,[r.empId]:empRecs};
                        });
                      } else {
                        // データありで差戻したケース→承認待ちに戻す
                        saveRecord({...rec,status:"submitted"});
                      }
                      showToast("差戻を取り消しました");
                    }},"差戻取消")
                  )
                  :e("div",{style:{display:"flex",gap:6}},
                    hasData&&e("button",{className:"btn btn-success",style:{fontSize:11,padding:"4px 10px"},onClick:()=>approve(r.empId,r.date)},"承認"),
                    !mgrClosed&&e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 10px"},onClick:()=>reject(r.empId,r.date)},"差戻")
                  )
            )
          );
        }))
      )
      )
    ),
    !selEmp&&e("p",{style:{textAlign:"center",color:"#94a3b8",padding:"32px"}},"上のスタッフ名を選択すると日別一覧が表示されます")
  );
}

// ===== RESET BUTTON =====
function ResetButton({date,onConfirm}){
  const [confirming,setConfirming]=useState(false);
  if(confirming)return e("div",{style:{display:"flex",alignItems:"center",gap:8,background:"#fee2e2",borderRadius:8,padding:"8px 12px"}},
    e("span",{style:{fontSize:12,color:"#991b1b",fontWeight:600}},date+"のデータをリセットしますか？"),
    e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 12px"},onClick:()=>{onConfirm();setConfirming(false);}},"はい"),
    e("button",{className:"btn btn-outline",style:{fontSize:11,padding:"4px 12px"},onClick:()=>setConfirming(false)},"いいえ")
  );
  return e("button",{className:"btn btn-danger",style:{fontSize:13,padding:"7px 16px"},onClick:()=>setConfirming(true)},"リセット");
}

// ===== EMPLOYEE VIEW (共通：一般・管理者両方) =====
function EmployeeView({currentUser,setCurrentUser,onBack,records,setRecords,getRecord,saveRecord,saveRecords,submitRecord,selectedMonth,setSelectedMonth,getMonthlySummary,showToast,employees,setEmployees,admins,setAdmins,setView}){
  const isAdmin=currentUser.role==="admin"||currentUser.role==="superadmin";
  const canSeePay=currentUser.role==="admin"||currentUser.role==="superadmin";
  const isBi=currentUser.bilingual===true||BILINGUAL_IDS.includes(currentUser.id);
  const [editDate,setEditDate]=useState(todayStr);
  const [form,setForm]=useState({clockIn:"",clockOut:"",breaks:[{start:"",end:""}],travelTimes:[{start:"",end:""}],note:""});
  const [activeTab,setActiveTab]=useState("today");
  const [showPinChange,setShowPinChange]=useState(currentUser.passHash==null);
  const [showHelp,setShowHelp]=useState(false);
  const [selectedStore,setSelectedStore]=useState(currentUser.store||"");
  const allStores=ALL_STORES; // 部署に関係なく全店舗から選択可能（他店舗ヘルプ勤務に対応）
  // 建設部門スタッフ、またはその日の対象店舗がモノレールなら移動時間を入力可能
  const isConstruction=isMonorailWork(currentUser.id,currentUser.store)||selectedStore==="モノレール";
  // 承認済みの日のみ対象店舗を変更不可（承認待ち・差戻し中は修正できる）
  const storeLocked=(records[currentUser.id]?.[editDate]||{}).status==="approved";
  // 同日に別店舗の出勤がある場合の入力欄
  const [showSubStore,setShowSubStore]=useState(false);
  const [subFrom,setSubFrom]=useState("");
  const [subTo,setSubTo]=useState("");
  const [subStore,setSubStore]=useState(currentUser.store||ALL_STORES[0]);

  useEffect(()=>{
    const r=getRecord(currentUser.id,editDate);
    const eb=r.breaks&&r.breaks.length?r.breaks:[{start:"",end:""}];
    const et=r.travelTimes&&r.travelTimes.length?r.travelTimes:[{start:"",end:""}];
    setForm({clockIn:r.clockIn||"",clockOut:r.clockOut||"",breaks:eb,travelTimes:et,note:r.note||""});
    // その日に記録された店舗を復元（未記録の日は自分の所属店舗）
    setSelectedStore(r.store||currentUser.store||"");
    // 別店舗入力欄は日付を変えたら閉じる
    // 別店舗の記録が備考にある日は、チェックを入れた状態で開く
    const hasSub=(r.note||"").split(" / ").some(s=>/^\d{1,2}:\d{2}-\d{1,2}:\d{2}\s+\S/.test(s.trim()));
    setShowSubStore(hasSub);setSubFrom("");setSubTo("");
  },[editDate,records]);

  const savePassToList=(hash)=>{
    const upd={...currentUser,passHash:hash};
    const inAdmins=(admins||[]).some(x=>x.id===currentUser.id);
    if(inAdmins)setAdmins(prev=>prev.map(x=>x.id===currentUser.id?upd:x));
    else setEmployees(prev=>prev.map(x=>x.id===currentUser.id?upd:x));
    setCurrentUser(upd);showToast("パスワードを変更しました");
  };

  const rec=getRecord(currentUser.id,editDate);
  const monthOfEdit=editDate.substring(0,7);
  const monthClosed=isAdminClosed(currentUser.id,monthOfEdit);
  const canEdit=rec.status!=="approved"&&!monthClosed;
  // 入力内容が保存済みの記録と異なるか（＝未保存の変更があるか）
  const hasUnsaved=(()=>{
    if(!canEdit)return false;
    const vb=a=>(a||[]).filter(x=>x.start&&x.end);
    const same=(rec.clockIn||"")===(form.clockIn||"")&&
      (rec.clockOut||"")===(form.clockOut||"")&&
      (rec.note||"")===(form.note||"")&&
      (rec.store||currentUser.store||"")===selectedStore&&
      JSON.stringify(vb(rec.breaks))===JSON.stringify(vb(form.breaks))&&
      JSON.stringify(vb(rec.travelTimes))===JSON.stringify(vb(form.travelTimes));
    return !same;
  })();
  // 未保存の入力があるまま日付を移動しようとしたら確認する
  const changeDate=(next)=>{
    if(!next||next===editDate)return;
    if(hasUnsaved&&!window.confirm(
      "入力中の内容が提出されていません。日付を変更すると入力内容が消えます。よろしいですか？"))return;
    setEditDate(next);
  };
  const summary=getMonthlySummary(currentUser.id);
  // calcはeditDateと選択中店舗を使って安全に計算（モノレール選択時は移動控除もプレビューに反映）
  const calc=editDate?calcRecord({...rec,...form,date:editDate,store:selectedStore,hourlyWage:currentUser.hourlyWage}):{workMinutes:0,overtimeMinutes:0,lateNightMinutes:0,pay:0};

  const doSave=(submit=true,isCorrect=false)=>{
    if(monthClosed){showToast("月締め済みのため入力できません","warning");return;}
    if(!form.clockIn||!form.clockOut){showToast("出勤・退勤時刻を入力してください","warning");return;}
    // 休憩・移動が勤務時間外チェック（日またぎ対応：isRangeWithinShiftで統一）
    const sameTime=arr=>(arr||[]).filter(b=>b.start&&b.end&&b.start===b.end);
    if(sameTime(form.breaks).length>0){showToast("休憩の開始と終了が同じ時刻です。修正してください。","warning");return;}
    if(isConstruction&&sameTime(form.travelTimes).length>0){showToast("移動時間の開始と終了が同じ時刻です。修正してください。","warning");return;}
    const outOfRange=arr=>(arr||[]).filter(b=>b.start&&b.end&&!isRangeWithinShift(form.clockIn,form.clockOut,b.start,b.end));
    if(outOfRange(form.breaks).length>0){showToast("勤務時間外の休憩があります。修正してください。","warning");return;}
    if(isConstruction&&outOfRange(form.travelTimes).length>0){showToast("勤務時間外の移動時間があります。修正してください。","warning");return;}
    if(rec.status==="approved"){showToast("承認済みのため訂正できません","warning");return;}
    if(isCorrect&&rec.status==="submitted"){
      const vb=a=>(a||[]).filter(x=>x.start&&x.end);
      const same=rec.clockIn===form.clockIn&&rec.clockOut===form.clockOut&&rec.note===form.note&&
        (rec.store||"")===selectedStore&&
        JSON.stringify(vb(rec.breaks))===JSON.stringify(vb(form.breaks))&&
        JSON.stringify(vb(rec.travelTimes))===JSON.stringify(vb(form.travelTimes));
      if(same){showToast("内容に変更がありません","warning");return;}
    }
    const r={...rec,...form,empId:currentUser.id,date:editDate,hourlyWage:currentUser.hourlyWage,
      // 承認済みの日は保存時も元の店舗を維持する
      store:storeLocked?(rec.store||selectedStore):selectedStore,status:"submitted"};
    submitRecord(r);
  };

  // 入力時刻が出勤〜退勤の範囲内か判定（日またぎ対応）
  const isWithinShiftFor=(ci,co,timeStr)=>{
    if(!ci||!co||!timeStr)return true;
    const inMin=parseInt(ci.slice(0,2))*60+parseInt(ci.slice(3));
    let outMin=parseInt(co.slice(0,2))*60+parseInt(co.slice(3));
    let tMin=parseInt(timeStr.slice(0,2))*60+parseInt(timeStr.slice(3));
    if(outMin<=inMin)outMin+=1440;
    let tAdjusted=tMin;
    if(tMin<inMin)tAdjusted=tMin+1440;
    return tAdjusted>=inMin&&tAdjusted<=outMin;
  };
  const isWithinShift=(timeStr)=>isWithinShiftFor(form.clockIn,form.clockOut,timeStr);
  // 休憩・移動の「区間」が出勤〜退勤の範囲内か判定（日またぎ対応・分ベース）
  // ※calcRecordのtoRangesと同じ正規化を行い、判定と計算のズレを防ぐ
  const isRangeWithinShift=(ci,co,start,end)=>{
    if(!ci||!co||!start||!end)return true;
    const inMin=parseInt(ci.slice(0,2))*60+parseInt(ci.slice(3));
    let outMin=parseInt(co.slice(0,2))*60+parseInt(co.slice(3));
    if(outMin<=inMin)outMin+=1440;
    let s=parseInt(start.slice(0,2))*60+parseInt(start.slice(3));
    let en=parseInt(end.slice(0,2))*60+parseInt(end.slice(3));
    if(s===en)return true;             // 同時刻＝0分として無視されるため範囲判定は通す
    if(s<inMin)s+=1440;
    if(en<inMin)en+=1440;
    if(en<=s)en+=1440;
    return s>=inMin&&en<=outMin;
  };
  // 出退勤変更時：既存の休憩・移動が範囲外ならエラー表示
  const checkExistingAfterClock=(ci,co)=>{
    if(!ci||!co)return;
    const bad=arr=>(arr||[]).filter(x=>{
      if(x.start&&x.end)return !isRangeWithinShift(ci,co,x.start,x.end);
      if(x.start)return !isWithinShiftFor(ci,co,x.start);
      if(x.end)return !isWithinShiftFor(ci,co,x.end);
      return false;
    });
    const outBreaks=bad(form.breaks);
    const outTravels=isConstruction?bad(form.travelTimes):[];
    if(outBreaks.length>0&&outTravels.length>0)showToast("休憩・移動時間が出勤〜退勤の範囲外です。修正してください","warning");
    else if(outBreaks.length>0)showToast("休憩時間が出勤〜退勤の範囲外です。修正してください","warning");
    else if(outTravels.length>0)showToast("移動時間が出勤〜退勤の範囲外です。修正してください","warning");
  };
  const doReset=()=>{
    // 提出済み等でGASに保存済みのレコードは、スプレッドシート側も削除
    const existing=records[currentUser.id]?.[editDate];
    if(existing&&existing.status&&existing.status!=="draft")gasDeleteRecord(currentUser.id,editDate);
    setRecords(prev=>{
      const empRecs={...(prev[currentUser.id]||{})};
      delete empRecs[editDate];
      return {...prev,[currentUser.id]:empRecs};
    });
    setForm({clockIn:"",clockOut:"",breaks:[{start:"",end:""}],travelTimes:[{start:"",end:""}],note:""});
    setSelectedStore(currentUser.store||"");
    showToast(editDate+"のデータをリセットしました");
  };
  const rejectedDates=Object.values(records[currentUser.id]||{}).filter(r=>r.status==="rejected"&&r.date?.startsWith(selectedMonth)).map(r=>r.date).sort().reverse();

  const tabs=[[("today"),L("📅 日次入力","📅 Daily Input",isBi)],[("monthly"),L("📊 月次一覧","📊 Monthly",isBi)]];
  if(isAdmin)tabs.push([("approval"),L("✅ 承認管理","✅ Approval",isBi)]);

  return e("div",null,
    showPinChange&&e(PasswordChangeModal,{currentUser,isForced:currentUser.passHash==null,
      onCancel:()=>{
        if(currentUser.passHash==null){
          setCurrentUser(null);setView("login");
        } else {
          setShowPinChange(false);
        }
      },
      onDone:hash=>{savePassToList(hash);setShowPinChange(false);}
    }),
    showHelp&&e(HelpModal,{isAdmin,isOwner:currentUser.role==="superadmin",onClose:()=>setShowHelp(false)}),
    // ヘッダー
    e("div",{className:"emp-header no-print",style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}},
      e("div",{className:"emp-header-left",style:{display:"flex",alignItems:"center",gap:12}},
        e("button",{onClick:onBack,className:"no-print",style:{display:"flex",alignItems:"center",gap:6,padding:"7px 14px",border:"1.5px solid #d1d5db",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,fontWeight:600,color:"#64748b",fontFamily:"inherit"}},"← "+L("ログアウト","Logout",isBi)),
        e("h2",{style:{fontSize:20,fontWeight:700,color:"#1e3a5f"}},L("マイ勤怠","My Attendance",isBi)),
        e("div",{style:{fontWeight:700,fontSize:20,color:"#1e3a5f"}},currentUser.name)
      ),
      e("button",{className:"no-print",onClick:()=>setShowHelp(true),style:{padding:"7px 14px",border:"1.5px solid #d1d5db",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,fontWeight:600,color:"#64748b",fontFamily:"inherit"}},"❓ "+L("使い方","Help",isBi)),
      e("button",{className:"no-print",onClick:()=>setShowPinChange(true),style:{padding:"7px 14px",border:"1.5px solid #d1d5db",borderRadius:8,background:"white",cursor:"pointer",fontSize:13,fontWeight:600,color:"#64748b",fontFamily:"inherit"}},"🔐 "+L("パスワード変更","Change Password",isBi))
    ),
    // 月選択・給与（金額は管理者・オーナーのみ表示）
    e("div",{style:{display:"flex",alignItems:"center",gap:16,marginBottom:16},className:"no-print"},
      e("input",{type:"month",value:selectedMonth,onChange:ev=>setSelectedMonth(ev.target.value),className:"input-field",style:{width:"auto",fontSize:16,fontWeight:700,padding:"10px 16px",color:"#1e3a5f",border:"2px solid #1e3a5f",borderRadius:12}}),
      (currentUser.role==="admin"||currentUser.role==="superadmin")&&e("p",{style:{color:"#475569",fontSize:16,fontWeight:700}},
        currentUser.payType==="monthly"
          ?L("月給","Monthly",isBi)+" ¥"+(currentUser.monthlyWage||0).toLocaleString()
          :L("時給","Hourly",isBi)+" ¥"+(currentUser.hourlyWage||0).toLocaleString()+L("/時間","/h",isBi)
      )
    ),
    // 統計（給与は非表示・承認済みのみ集計）
    e("div",{className:"stat-grid no-print",style:{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12,marginBottom:8}},
      ...[{label:L("勤務日数","Work Days",isBi),val:summary.workDays+"日"},{label:L("今月勤務時間","Monthly Hours",isBi),val:mHHMM(summary.totalWork)},{label:L("時間外労働","Overtime",isBi),val:mHHMM(summary.totalOvertime)},{label:L("深夜労働","Late Night",isBi),val:mHHMM(summary.totalLateNight)}]
        .map(s=>e("div",{key:s.label,className:"stat-box"},e("div",{style:{fontSize:18,fontWeight:700,color:"#1e3a5f"}},s.val),e("div",{style:{fontSize:11,color:"#94a3b8",fontWeight:600,marginTop:4}},s.label)))
    ),
    e("p",{className:"no-print",style:{fontSize:11,color:"#94a3b8",marginBottom:12}},"※ 承認済みのデータのみ集計"),
    // 差戻し中の日がある場合のアラート（月締め後は非表示）
    !monthClosed&&rejectedDates.length>0&&e("div",{style:{background:"#fee2e2",borderRadius:12,padding:"12px 16px",marginBottom:16,display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"},className:"no-print"},
      e("span",{style:{fontSize:13,fontWeight:700,color:"#991b1b"}},"⚠ 差戻し中の日があります:"),
      ...rejectedDates.map(date=>e("button",{key:date,onClick:()=>{setActiveTab("today");changeDate(date);},
        style:{fontSize:12,padding:"4px 12px",borderRadius:20,border:"none",background:"#dc2626",color:"white",cursor:"pointer",fontWeight:700}},date))
    ),
    // タブ
    e("div",{className:"card no-print"},
      e("div",{style:{display:"flex",borderBottom:"2px solid #f1f5f9",marginBottom:20,gap:4}},
        ...tabs.map(([k,l])=>e("button",{key:k,className:`tab ${activeTab===k?"active":""}`,onClick:()=>setActiveTab(k)},l))
      ),
      // 日次入力タブ
      activeTab==="today"&&e("div",null,
        // 対象店舗（承認済みのみ変更不可）
        e("div",{style:{marginBottom:14}},
          e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},L("対象店舗","Store",isBi)),
          e("div",{style:{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}},
            storeLocked
              ?e("div",{style:{width:200,maxWidth:"100%",flex:"1 1 160px",padding:"9px 12px",border:"1.5px solid #e2e8f0",borderRadius:8,background:"#f1f5f9",color:"#475569",fontSize:14,fontWeight:600}},selectedStore||"—")
              :e("select",{value:selectedStore,onChange:ev=>setSelectedStore(ev.target.value),className:"input-field",style:{width:200,maxWidth:"100%",flex:"1 1 160px"}},
                  allStores.filter(s=>!INACTIVE_STORES.includes(s)).map(s=>e("option",{key:s,value:s},s))
                ),
            e("span",{className:`status-badge ${S_CLASS[rec.status||"draft"]}`},S_LABEL[rec.status||"draft"]),
            storeLocked&&e("span",{style:{fontSize:11,color:"#94a3b8",fontWeight:600}},
              L("🔒 承認済みのため変更できません","🔒 Locked (approved)",isBi))
          )
        ),
        // 対象日
        e("div",{style:{marginBottom:14}},
          e("label",{style:{fontSize:12,color:"#64748b",fontWeight:700,display:"block",marginBottom:4}},
            L("対象日","Date",isBi),
            hasUnsaved&&e("span",{style:{marginLeft:8,fontSize:11,color:"#d97706",fontWeight:700}},

  if(ed)return e("tr",null,
    e("td",null,e("input",{value:form.name,onChange:ev=>setForm(f=>({...f,name:ev.target.value})),onCompositionEnd:ev=>setForm(f=>({...f,name:ev.target.value})),className:"input-field",style:{padding:"5px 8px",width:100}})),
    e("td",null,e("input",{value:form.loginId||"",onChange:ev=>setForm(f=>({...f,loginId:ev.target.value})),className:"input-field",style:{padding:"5px 8px",width:160},placeholder:"example@tribe.jp"})),
    e("td",null,e("select",{value:form.department,onChange:ev=>{const d=ev.target.value;setForm(f=>({...f,department:d,store:DEPARTMENT_STORES[d]?.[0]||""}))},className:"input-field",style:{padding:"5px 8px"}},
      Object.keys(DEPARTMENT_STORES).map(d=>e("option",{key:d,value:d},d))
    )),
    e("td",null,e("select",{value:form.store,onChange:ev=>setForm(f=>({...f,store:ev.target.value})),className:"input-field",style:{padding:"5px 8px"}},
      (DEPARTMENT_STORES[form.department]||[form.store]).map(s=>e("option",{key:s,value:s},s))
    )),
    e("td",null,e("select",{value:form.role,onChange:ev=>setForm(f=>({...f,role:ev.target.value})),className:"input-field",style:{padding:"5px 8px"}},
      e("option",{value:"employee"},"一般"),e("option",{value:"admin"},"管理者"),e("option",{value:"superadmin"},"オーナー")
    )),
    e("td",null,
      e("select",{value:form.payType||"hourly",onChange:ev=>setForm(f=>({...f,payType:ev.target.value})),className:"input-field",style:{padding:"4px 6px",width:80,marginBottom:4,fontSize:11}},e("option",{value:"hourly"},"時給"),e("option",{value:"monthly"},"月給")),
      (form.payType==="monthly")
        ?e("input",{type:"number",value:form.monthlyWage||0,onChange:ev=>setForm(f=>({...f,monthlyWage:Number(ev.target.value)})),className:"input-field",style:{padding:"5px 8px",width:110},min:0})
        :e("input",{type:"number",value:form.hourlyWage,onChange:ev=>setForm(f=>({...f,hourlyWage:Number(ev.target.value)})),className:"input-field",style:{padding:"5px 8px",width:100},min:0})
    ),
    // 担当店舗（管理者・オーナーのみ複数選択）
    e("td",null,
      (form.role==="admin"||form.role==="superadmin")
        ?e("div",{style:{display:"flex",flexWrap:"wrap",gap:4}},
          ALL_STORES.filter(s=>!INACTIVE_STORES.includes(s)).map(s=>e("label",{key:s,style:{display:"flex",alignItems:"center",gap:3,fontSize:11,cursor:"pointer"}},
            e("input",{type:"checkbox",checked:(form.managedStores||[]).includes(s),onChange:ev=>{setForm(f=>{const ms=f.managedStores||[];return{...f,managedStores:ev.target.checked?[...ms,s]:ms.filter(x=>x!==s)};})}}),s
          ))
        )
        :e("span",{style:{fontSize:11,color:"#94a3b8"}},"—")
    ),
    e("td",null,passStatus(form.passHash)),
    e("td",null,
      e("input",{type:"checkbox",checked:form.bilingual||false,onChange:ev=>setForm(f=>({...f,bilingual:ev.target.checked}))})
    ),
    e("td",null,e("div",{style:{display:"flex",gap:6}},
      e("button",{className:"btn btn-success",style:{fontSize:11,padding:"4px 10px"},onClick:()=>{onSave(form);setEd(false);}},"保存"),
      e("button",{className:"btn btn-outline",style:{fontSize:11,padding:"4px 10px"},onClick:()=>setEd(false)},"取消")
    ))
  );

  return e("tr",null,
    e("td",{style:{fontWeight:600}},emp.name),
    e("td",{style:{fontSize:11,color:"#64748b"}},emp.loginId||"—"),
    e("td",{style:{fontSize:12,color:"#64748b"}},emp.department),
    e("td",{style:{fontSize:12,color:"#64748b"}},emp.store),

    e("td",{style:{fontWeight:700,color:"#1e3a5f"}},emp.payType==="monthly"?"月 ¥"+(emp.monthlyWage||0).toLocaleString():"¥"+(emp.hourlyWage||0).toLocaleString()),
    e("td",{style:{fontSize:12,color:"#64748b"}},(emp.role==="employee")?"—":(emp.managedStores||[emp.store]).join("・")),
    e("td",null,passStatus(emp.passHash)),

      emp.bilingual?e("span",{style:{fontSize:12,color:"#059669",fontWeight:700}},"✓"):e("span",{style:{fontSize:12,color:"#94a3b8"}},"—")
    ),

      e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 10px"},onClick:()=>{if(confirm(emp.name+"のパスワードを初期パスワードにリセットしますか？"))onPassReset(emp);}},"PWリセット"),
      e("button",{className:"btn btn-danger",style:{fontSize:11,padding:"4px 10px",background:"#7c3aed",borderColor:"#7c3aed"},onClick:()=>{if(confirm(emp.name+"を削除しますか？"))onDelete(emp);}},"削除")
    ))
  );
}

// ===== ADMIN DASHBOARD (オーナーのみ) =====
function AdminDashboard({employees,setEmployees,admins,setAdmins,selectedMonth,setSelectedMonth,getMonthlySummary,showToast,currentUser,setCurrentUser,setView}){
  const [tab,setTab]=useState("summary");
  const [selEmp,setSelEmp]=useState(null);
  const isSuperAdmin=currentUser?.role==="superadmin";
  const [showPinChange,setShowPinChange]=useState(currentUser?.passHash==null);
  const [showHelp,setShowHelp]=useState(false);

  const savePassToList=hash=>{
    const upd={...currentUser,passHash:hash};
    const inAdmins=(admins||[]).some(x=>x.id===currentUser.id);
    if(inAdmins)setAdmins(prev=>prev.map(x=>x.id===currentUser.id?upd:x));
    else setEmployees(prev=>prev.map(x=>x.id===currentUser.id?upd:x));
    setCurrentUser(upd);showToast("パスワードを変更しました");
  };

  return e("div",null,
    showPinChange&&e(PasswordChangeModal,{currentUser,isForced:currentUser?.passHash==null,
      onCancel:()=>{
        if(currentUser?.passHash==null){
          setCurrentUser(null);setView("login");
        } else {
          setShowPinChange(false);
        }
      },
      onDone:hash=>{savePassToList(hash);setShowPinChange(false);}
    }),
    showHelp&&e(HelpModal,{isAdmin:true,isOwner:currentUser?.role==="superadmin",onClose:()=>setShowHelp(false)}),
    e("div",{className:"no-print",style:{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20,gap:10,flexWrap:"wrap"}},
      e("h2",{style:{fontSize:20,fontWeight:700,color:"#1e3a5f"}},"管理者ダッシュボード"),
      e("div",{style:{display:"flex",gap:10,flexWrap:"wrap"}},
        e("button",{className:"btn btn-outline",onClick:()=>setShowHelp(true)},"❓ 使い方"),
        e("input",{type:"month",value:selectedMonth,onChange:ev=>setSelectedMonth(ev.target.value),className:"input-field",style:{width:"auto"}}),
        e("button",{className:"btn btn-outline",onClick:()=>window.print()},
          tab==="employees"
            ?"🖨 従業員一覧を印刷"
            :selEmp
              ?"🖨 "+([...employees,...admins].find(x=>x.id===selEmp)?.name||"")+"さんの明細を印刷"
              :"🖨 全員分を印刷"
        )
      )
    ),
    e("div",{style:{display:"flex",borderBottom:"2px solid #e2e8f0",marginBottom:20,gap:4},className:"no-print"},
      [["summary","📊 月次集計"],["employees","👥 従業員設定"]].map(([k,l])=>
        e("button",{key:k,className:`tab ${tab===k?"active":""}`,onClick:()=>setTab(k)},l)
      )
    ),
    // 月次集計
    tab==="summary"&&e("div",null,
      e("div",{className:"no-print",style:{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:12,marginBottom:20}},
        ...[...employees,...admins].map(emp=>{
          const s=getMonthlySummary(emp.id);
          return e("div",{key:emp.id,className:"stat-box",style:{cursor:"pointer",border:selEmp===emp.id?"2px solid #1e3a5f":"2px solid transparent"},onClick:()=>setSelEmp(selEmp===emp.id?null:emp.id)},
            e("div",{style:{marginBottom:8}},
              e("div",{style:{fontWeight:700,fontSize:13,color:"#1e3a5f"}},emp.name),
              e("div",{style:{fontSize:10,color:"#94a3b8"}},emp.store)
            ),
            e("div",{style:{fontSize:18,fontWeight:700,color:"#059669"}},"¥"+s.totalPay.toLocaleString()),
            e("div",{style:{fontSize:10,color:"#94a3b8",marginTop:2}},mHHMM(s.totalWork))
          );
        })
      ),
      selEmp&&e("div",{className:"card no-print"},
        e("h3",{style:{fontSize:15,fontWeight:700,color:"#1e3a5f",marginBottom:12}},[...employees,...admins].find(x=>x.id===selEmp)?.name+" の月次明細"),
        e(MonthlyTable,{summary:getMonthlySummary(selEmp),currentUser,selectedMonth,isMgrClosed:isAdminClosed(selEmp,selectedMonth)})
      ),
      // 印刷対象：スタッフ選択中はその1人だけ、未選択なら全員（1人1ページ）
      ...[...employees,...admins]
        .filter(emp=>!selEmp||emp.id===selEmp)
        .map(emp=>e(PrintSummary,{key:emp.id,summary:getMonthlySummary(emp.id),selectedMonth,isAdmin:true}))
    ),
    // 従業員設定
    tab==="employees"&&e("div",null,
      e("div",{className:"card no-print"},
      e("h3",{style:{fontSize:15,fontWeight:700,color:"#1e3a5f",marginBottom:16}},"従業員設定"),
      // 新規追加フォーム
      e(AddEmployeeForm,{employees,setEmployees,admins,setAdmins,showToast}),
      e("div",{style:{overflowX:"auto",marginTop:16}},e("table",{className:"table",style:{fontSize:12}},
        e("thead",null,e("tr",null,["氏名","ログインID","部署","店舗","役割","給与","担当店舗","パスワード","英語","操作"].map(h=>e("th",{key:h},h)))),
        e("tbody",null,...[...employees,...admins].map(emp=>e(EmployeeRow,{key:emp.id,emp,isSuperAdmin,
          onSave:upd=>{
            const lid=String(upd.loginId||"").trim().toLowerCase();
            if(!lid){showToast("ログインIDを入力してください","warning");return;}
            const dup=[...employees,...admins].some(x=>x.id!==upd.id&&String(x.loginId||"").toLowerCase()===lid);
            if(dup){showToast("このログインIDは既に使われています","warning");return;}
            upd={...upd,loginId:lid};
            const wasAdmin=admins.some(x=>x.id===upd.id);
            const shouldBeAdmin=upd.role!=="employee";
            // 役割に応じた担当店舗の初期化・整理
            if(shouldBeAdmin&&(!upd.managedStores||upd.managedStores.length===0)){
              upd={...upd,managedStores:upd.role==="superadmin"?ALL_STORES.filter(s=>!INACTIVE_STORES.includes(s)):[upd.store]};
            }
            if(!shouldBeAdmin)upd={...upd,managedStores:undefined};
            // 役割変更時はemployees⇔admins間で配列を移動
            if(wasAdmin&&!shouldBeAdmin){
              setAdmins(prev=>prev.filter(x=>x.id!==upd.id));
              setEmployees(prev=>[...prev.filter(x=>x.id!==upd.id),upd]);
            }else if(!wasAdmin&&shouldBeAdmin){
              setEmployees(prev=>prev.filter(x=>x.id!==upd.id));
              setAdmins(prev=>[...prev.filter(x=>x.id!==upd.id),upd]);
            }else if(wasAdmin){
              setAdmins(prev=>prev.map(x=>x.id===upd.id?upd:x));
            }else{
              setEmployees(prev=>prev.map(x=>x.id===upd.id?upd:x));
            }
            showToast(upd.name+" を更新しました");
          },
          onDelete:emp=>{
            const inAdmins=admins.some(x=>x.id===emp.id);
            if(inAdmins)setAdmins(prev=>prev.filter(x=>x.id!==emp.id));
            else setEmployees(prev=>prev.filter(x=>x.id!==emp.id));
            showToast(emp.name+" を削除しました","warning");
          },
          onPassReset:emp=>{
            const inAdmins=admins.some(x=>x.id===emp.id);
            if(inAdmins)setAdmins(prev=>prev.map(x=>x.id===emp.id?{...x,passHash:null}:x));
            else setEmployees(prev=>prev.map(x=>x.id===emp.id?{...x,passHash:null}:x));
            showToast(emp.name+" のパスワードをリセットしました（初期パスワード: "+INITIAL_PASSWORD+"）");
          }
        })))
      ))),
      // 印刷用の従業員一覧（画面には出ない）
      e("div",{className:"print-only",style:{display:"none"}},
        e("h2",{style:{fontSize:14,marginBottom:4}},"従業員一覧"),
        e("p",{style:{fontSize:10,marginBottom:8,color:"#666"}},"出力日: "+formatDate(new Date())+" ／ 全"+([...employees,...admins].length)+"名"),
        e("table",{className:"print-table"},
          e("colgroup",null,...[16,24,12,16,9,11,12].map((w,i)=>e("col",{key:i,style:{width:w+"%"}}))),
          e("thead",null,e("tr",null,...["氏名","ログインID","部署","所属店舗","役割","給与","担当店舗"].map(h=>e("th",{key:h},h)))),
          e("tbody",null,...[...employees,...admins].map(emp=>e("tr",{key:emp.id},
            e("td",{className:"c-nowrap"},emp.name),
            e("td",{className:"c-wrap"},emp.loginId||"—"),
            e("td",{className:"c-nowrap"},emp.department||"—"),
            e("td",{className:"c-wrap"},emp.store||"—"),
            e("td",{className:"c-nowrap"},{employee:"一般",admin:"管理者",superadmin:"オーナー"}[emp.role]||emp.role),
            e("td",{className:"c-nowrap c-right"},emp.payType==="monthly"?"月 "+(emp.monthlyWage||0).toLocaleString():(emp.hourlyWage||0).toLocaleString()+"/h"),
            e("td",{className:"c-wrap"},emp.role==="employee"?"—":(emp.managedStores||[emp.store]).join("・"))
          )))
        )
      )
    )
  );
}

// ===== MAIN APP =====
function App(){
  const [employees,setEmpRaw]=useState(()=>migrateAuth(loadLS("kintai_employees",INITIAL_EMPLOYEES),INITIAL_EMPLOYEES));
  const [admins,setAdminsRaw]=useState(()=>migrateAuth(loadLS("kintai_admins",INITIAL_ADMINS),INITIAL_ADMINS));
  const [records,setRecRaw]=useState(()=>loadLS("kintai_records",{}));
  const [view,setViewRaw]=useState(()=>{try{const s=JSON.parse(localStorage.getItem("kintai_session")||"null");if(s&&s.view&&s.view!=="login")return s.view;}catch{}return "login";});
  const setView=v=>{setViewRaw(v);try{const cu=JSON.parse(localStorage.getItem("kintai_session")||"null");if(cu)saveLS("kintai_session",{...cu,view:v,ts:Date.now()});}catch{}};
  const [currentUser,setCUraw]=useState(()=>{
    try{const s=JSON.parse(localStorage.getItem("kintai_session")||"null");
      if(s){const emps=migrateAuth(loadLS("kintai_employees",INITIAL_EMPLOYEES),INITIAL_EMPLOYEES);const adms=migrateAuth(loadLS("kintai_admins",INITIAL_ADMINS),INITIAL_ADMINS);
        return emps.find(x=>x.id===s.empId)||adms.find(x=>x.id===s.empId)||null;}}catch{}return null;
  });
  // ログイン状態はログアウトするまで保持する（時間による自動ロックはしない）
  const [selectedMonth,setSelectedMonth]=useState(`${TODAY.getFullYear()}-${String(TODAY.getMonth()+1).padStart(2,"0")}`);
  const [toast,setToast]=useState(null);
  // スタッフ情報のGAS同期は状態更新の外で行う（更新関数内で通信すると二重送信になるため）
  const pendingStaffSync=useRef(null);
  const staffSyncing=useRef(false);
  const [syncBusy,setSyncBusy]=useState(false);
  useEffect(()=>{
    if(!pendingStaffSync.current)return;
    const p=pendingStaffSync.current;
    pendingStaffSync.current=null;
    staffSyncing.current=true;setSyncBusy(true);
    const done=ok=>{
      staffSyncing.current=false;setSyncBusy(false);
      if(ok)setToast({msg:"スタッフ情報を保存しました",type:"success"});
      else setToast({msg:"保存できませんでした。通信環境を確認して、もう一度保存してください。",type:"warning"});
      setTimeout(()=>setToast(null),3000);
    };
    gasPost("saveStaff",p).then(r=>done(!!(r&&r.success!==false))).catch(()=>done(false));
  });
  // 保存が終わる前にページを閉じようとしたら警告する（変更が消えるのを防ぐ）
  useEffect(()=>{
    const h=ev=>{if(staffSyncing.current){ev.preventDefault();ev.returnValue="";}};
    window.addEventListener("beforeunload",h);
    return ()=>window.removeEventListener("beforeunload",h);
  },[]);

  // 状態更新は必ずReactの最新値(prev)を基準にする
  // （素早い連続操作でも更新が失われないようにするため）
  const setEmployees=v=>{
    setEmpRaw(prev=>{
      const nx=typeof v==="function"?v(prev):v;
      saveLS("kintai_employees",nx);
      pendingStaffSync.current={type:"employees",data:nx};
      return nx;
    });
  };
  const setAdmins=v=>{
    setAdminsRaw(prev=>{
      const nx=typeof v==="function"?v(prev):v;
      saveLS("kintai_admins",nx);
      pendingStaffSync.current={type:"admins",data:nx};
      return nx;
    });
  };
  const setRecords=v=>{
    setRecRaw(prev=>{
      const nx=typeof v==="function"?v(prev):v;
      saveLS("kintai_records",nx);
      return nx;
    });
  };

  // GASから初期データ取得
  useEffect(()=>{
    async function loadFromGAS(){
      try{
        const [empRes,admRes,recRes]=await Promise.all([gasGet("getEmployees"),gasGet("getAdmins"),gasGet("getRecords")]);
        if(empRes.success&&Array.isArray(empRes.data)&&empRes.data.length>0){
          const mig=migrateAuth(empRes.data,INITIAL_EMPLOYEES);
          saveLS("kintai_employees",mig);setEmpRaw(mig);
        }
        if(admRes.success&&Array.isArray(admRes.data)&&admRes.data.length>0){
          const mig=migrateAuth(admRes.data,INITIAL_ADMINS);
          saveLS("kintai_admins",mig);setAdminsRaw(mig);
        }
        // 勤怠レコードもGASから取得してマージ（他端末で提出されたデータを反映）
        // ローカルの「下書き」は未同期の作業中データなので上書きしない
        if(recRes.success&&Array.isArray(recRes.data)){
          setRecRaw(prev=>{
            const merged={...prev};
            recRes.data.forEach(sr=>{
              if(!sr||sr.empId==null||!sr.date)return;
              const id=Number(sr.empId);
              if(!Number.isFinite(id))return;
              const cur=(merged[id]||{})[sr.date];
              if(cur&&cur.status==="draft")return;
              merged[id]={...(merged[id]||{}),[sr.date]:{...sr,empId:id}};
            });
            saveLS("kintai_records",merged);
            return merged;
          });
        }
      }catch(e){console.error("GAS初期ロードエラー:",e);}
    }
    loadFromGAS();
  },[]);
  const setCurrentUser=emp=>{
    if(emp)saveLS("kintai_session",{empId:emp.id,role:emp.role,ts:Date.now()});
    else try{localStorage.removeItem("kintai_session");}catch{}
    setCUraw(emp);
  };
  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3000);};

  useEffect(()=>{
    if(!currentUser)return;
    const t=setInterval(()=>{
      saveLS("kintai_session",{empId:currentUser.id,role:currentUser.role,view,ts:Date.now()});
    },5*60*1000);
    return()=>clearInterval(t);
  },[currentUser,view]);

  const getRecord=(empId,date)=>records[empId]?.[date]||{empId,date,clockIn:"",clockOut:"",breaks:[{start:"",end:""}],status:"draft",note:"",hourlyWage:[...employees,...admins].find(x=>x.id===empId)?.hourlyWage??1000};
  const saveRecord=rec=>{
    if(currentUser&&currentUser.role==="employee"&&rec.empId!==currentUser.id){showToast("他のユーザーのデータは編集できません","warning");return;}
    setRecords(prev=>({...prev,[rec.empId]:{...(prev[rec.empId]||{}),[rec.date]:{...rec}}}));
    // GASに非同期で保存（下書き以外）
    if(rec.status&&rec.status!=="draft"){
      const empName=[...employees,...admins].find(x=>x.id===rec.empId)?.name||"";
      gasPost("saveRecord",{record:{...rec,empName}}).catch(e=>console.error("GAS保存エラー:",e));
    }
  };
  const saveRecords=recs=>{
    setRecords(prev=>{
      const next={...prev};
      recs.forEach(rec=>{next[rec.empId]={...(next[rec.empId]||{}),[rec.date]:{...rec}};});
      return next;
    });
    // GASに非同期で一括保存（下書き以外）
    recs.filter(r=>r.status&&r.status!=="draft").forEach(rec=>{
      const empName=[...employees,...admins].find(x=>x.id===rec.empId)?.name||"";
      gasPost("saveRecord",{record:{...rec,empName}}).catch(e=>console.error("GAS保存エラー:",e));
    });
  };
  const submitRecord=rec=>{saveRecord({...rec,status:"submitted"});showToast("提出しました");};

  const getMonthlySummary=empId=>{
    const emp=[...employees,...admins].find(x=>x.id===empId);
    const allDays=Object.values(records[empId]||{}).filter(r=>r.date?.startsWith(selectedMonth));
    let tw=0,to=0,tp=0,tl=0,wd=0;
    const dd=allDays.map(r=>{
      // 保存時に記録した時給を優先（後から時給変更しても過去月は変わらない）
      const c=calcRecord({...r,hourlyWage:r.hourlyWage!=null?r.hourlyWage:(emp?.hourlyWage??1000)});
      // 給与・勤務日数は承認済みのみカウント
      if(r.status==="approved"){tw+=c.workMinutes;to+=c.overtimeMinutes;tp+=c.pay;tl+=c.lateNightMinutes;wd++;}
      return{...r,...c};
    });
    // 月給制：勤務日数が1日以上あれば固定の月給額。日給は表示しない
    const isMonthly=emp?.payType==="monthly";
    const monthlyPay=isMonthly?(wd>0?(emp?.monthlyWage||0):0):tp;
    return{emp,days:dd.sort((a,b)=>a.date>b.date?1:-1),totalWork:tw,totalOvertime:to,totalPay:monthlyPay,totalLateNight:tl,workDays:wd,isMonthly};
  };

  const handleLogin=emp=>{
    setCurrentUser(emp);setView("employee");
  };
  const handleAdminLogin=adm=>{
    setCurrentUser(adm);
    setView(adm.role==="superadmin"?"dashboard":"employee");
  };
  const handleBack=()=>{
    setCurrentUser(null);setView("login");
  };

  if(view==="login"||!currentUser)return e("div",null,
    e(LoginScreen,{employees,admins,onLogin:handleLogin,onAdminLogin:handleAdminLogin}),
    toast&&e("div",{className:`toast-center toast-center-${toast.type}`},
      e("div",{style:{fontSize:20,marginBottom:8}},toast.type==="warning"?"⚠️":"✅"),
      toast.msg
    ),
    // スタッフ情報を保存中の表示（閉じると変更が消えるため知らせる）
    syncBusy&&e("div",{style:{position:"fixed",bottom:16,left:"50%",transform:"translateX(-50%)",
      background:"#1e3a5f",color:"white",padding:"9px 18px",borderRadius:20,fontSize:13,
      fontWeight:700,zIndex:1200,boxShadow:"0 2px 10px rgba(0,0,0,.25)"}},"保存中… そのままお待ちください")
  );

  return e("div",{style:{fontFamily:"'Noto Sans JP',sans-serif",minHeight:"100vh",background:"#f0f2f5"}},
    e("nav",{className:"nav no-print"},
      e("div",{className:"nav-brand"},"⏱ 勤怠管理システム"),
      e("div",{style:{display:"flex",alignItems:"center",gap:10}},
        currentUser.role==="superadmin"&&e("span",{style:{fontSize:11,background:"rgba(124,58,237,.6)",padding:"2px 8px",borderRadius:20}},"オーナー"),
        currentUser.role==="admin"&&e("span",{style:{fontSize:11,background:"rgba(255,255,255,.2)",padding:"2px 8px",borderRadius:20}},"管理者"),
        e("button",{style:{fontSize:12,padding:"5px 12px",background:"transparent",color:"white",border:"1px solid rgba(255,255,255,.4)",borderRadius:6,cursor:"pointer",fontFamily:"inherit"},
          onClick:()=>{saveLS("kintai_session",{empId:currentUser.id,role:currentUser.role,view:"login",ts:Date.now()});setCurrentUser(null);setView("login");}},"⌂ ログアウト"),
        // オーナーのみダッシュボードへのリンク
        view==="employee"&&currentUser.role==="superadmin"&&e("button",{style:{fontSize:12,padding:"5px 12px",background:"rgba(124,58,237,.6)",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"},onClick:()=>setView("dashboard")},"📊 ダッシュボード"),
        view==="dashboard"&&currentUser.role==="superadmin"&&e("button",{style:{fontSize:12,padding:"5px 12px",background:"rgba(255,255,255,.2)",color:"white",border:"none",borderRadius:6,cursor:"pointer",fontFamily:"inherit"},onClick:()=>setView("employee")},"← マイ勤怠")
      )
    ),
    e("div",{style:{maxWidth:1100,margin:"0 auto",padding:"24px 20px"}},
      e("div",null,
          (view==="employee")&&e(EmployeeView,{currentUser,setCurrentUser,onBack:handleBack,records,setRecords,getRecord,saveRecord,saveRecords,submitRecord,selectedMonth,setSelectedMonth,getMonthlySummary,showToast,employees,setEmployees,admins,setAdmins,setView}),
          (view==="dashboard")&&currentUser.role==="superadmin"&&e(AdminDashboard,{employees,setEmployees,admins,setAdmins,selectedMonth,setSelectedMonth,getMonthlySummary,showToast,currentUser,setCurrentUser,setView})
        )
    ),
    toast&&e("div",{className:`toast-center toast-center-${toast.type}`},
      e("div",{style:{fontSize:20,marginBottom:8}},toast.type==="warning"?"⚠️":"✅"),
      toast.msg
    ),
    // スタッフ情報を保存中の表示（閉じると変更が消えるため知らせる）
    syncBusy&&e("div",{style:{position:"fixed",bottom:16,left:"50%",transform:"translateX(-50%)",
      background:"#1e3a5f",color:"white",padding:"9px 18px",borderRadius:20,fontSize:13,
      fontWeight:700,zIndex:1200,boxShadow:"0 2px 10px rgba(0,0,0,.25)"}},"保存中… そのままお待ちください")
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(e(App));
</script>
</body>
</html>
